name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-v2-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-v2-

      - run: npm ci

      - name: Install Quartz plugins
        run: |
          rm -rf .quartz/plugins
          npx quartz plugin install --from-config

      - name: Apply custom patches
        run: |
          cp quartz/patches/content-index.dist.js .quartz/plugins/content-index/dist/index.js
          cp quartz/patches/explorer.dist.js .quartz/plugins/explorer/dist/index.js
          cp quartz/patches/explorer.components.dist.js .quartz/plugins/explorer/dist/components/index.js
          cp quartz/patches/tag-page.dist.js .quartz/plugins/tag-page/dist/index.js

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # ★ 2026-08-07 — 개념지도는 /concepts 아래에만 올립니다.
          #   안방(루트)은 공부 지도가 씁니다. 이 두 줄이 없으면 공부 지도가 지워집니다.
          destination_dir: concepts
          keep_files: true
          # cname 은 루트를 맡는 쪽(공부 지도)이 관리합니다. 여기서 쓰면 안 됩니다.
