const DATA = {"course": {"scenes": [{"n": "ANTI-42", "part": 0, "title": "유나신이냐 ceftriaxone 이냐 — 1부", "line": "실제 진료는 「얘를 쓸까? 쟤를 쓸까?」 의 연속입니다. 먼저 버릴 생각 — 「Ampicillin-sulbactam은 ceftriaxone보다 한 단계 약한 항생제다.」 둘은 세기가 아니라 스펙트럼이 다릅니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["sam", "cro"], "more": [{"t": "둘 다 되는 곳 — pneumococcus 와 Streptococcus, H. influenzae, Moraxella. 판에서 반반으로 칠해진 칸입니다.", "focus": ["c_strep", "hflu", "morax"], "marks": [{"tip": "둘 다 좋다", "ids": ["pneumo"]}]}, {"t": "ceftriaxone 쪽 — 장내 그람음성균이 우수합니다(ESBL 은 안 되지만). 유나신은 E. coli 가 불확실합니다. 국내 감수성 data 로 내성이 22% 쯤이라, 될 수도 있고 안 될 수도 있습니다. E. coli 를 잡을지 애매한 약을 복부 · 요로감염의 main 으로 쓰기는 현실적으로 어렵습니다(22-4강).", "focus": ["ecoli", "kleb", "proteus", "esbl"], "marks": [{"tip": "유나신은 불확실 — 내성 22%", "ids": ["ecoli"]}]}, {"t": "유나신 쪽 — 구강 혐기성균과 E. faecalis 에 이점이 있습니다. 이쪽은 ceftriaxone 이 잘 못하는 곳입니다. 이렇게 보면 유나신이 더 하위 항생제인가요? 전혀 아닙니다.", "focus": ["gpos", "anaer"], "marks": [{"tip": "유나신만 좋다", "ids": ["oral_ana"]}, {"tip": "감수성 있으면 유나신", "ids": ["efaecalis"]}]}, {"t": "둘 다 안 되는 곳 — atypical pathogen, MRSA, Pseudomonas, 그리고 ESBL · inducible AmpC 는 둘 다 믿기 어렵습니다. 빗금 칸입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "둘 다 안 된다", "ids": ["pseudo"]}, {"tip": "둘 다 안 된다", "ids": ["mrsa"]}, {"tip": "둘 다 믿기 어렵다", "ids": ["esbl"]}]}, {"t": "지역사회획득폐렴 — Pseudomonas · MRSA 위험이 적은 일반적인 CAP 이면 둘 다 됩니다. 구강 쪽 단서가 있으면 유나신, 아니면 ceftriaxone 으로 기웁니다.", "focus": ["pneumo", "hflu", "morax", "oral_ana"], "fig": {"type": "cmp", "title": "일반적인 CAP — 어느 쪽으로 기우나", "vs": "vs", "cols": [{"h": "유나신 쪽", "tone": "", "pts": ["치주질환 · 치성 감염이 함께", "폐농양 · 괴사성 병변 · 농흉", "구강 · 인두 분비물 혼합감염", "두경부 감염이 함께"]}, {"h": "ceftriaxone 쪽", "tone": "", "pts": ["전형적인 CAP, 흡인 · 구강 특징 없음", "폐렴인지 요로감염인지 애매 — gram negative 를 잘", "하루 한 번이 병동에 유리", "신기능 저하로 유나신 간격 조절이 번거로움"]}]}}], "nums": ["국내 E. coli 의 유나신 내성 22%"], "says": ["아마 교수님이 너 왜 유나신썼어.. 했을때 이런식으로 이야기하면 한 2시간은 혼날것 같아.", "이렇게 보면 어때요, ampicillin-sulbactam이 더 하위 항생제인가요?"], "vid": "8fdEz8eO53s", "ope 기 어려운 곳 — MRSA, atypical pathogen, ESBL, AmpC. MSSA 에는 둘 다 활성이 있지만 MSSA 에는 전문 약이 따로 있으니 굳이 이 둘을 쓸 필요는 없습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "타조신도 믿으면 안 된다", "ids": ["esbl"]}, {"tip": "활성은 있지만 전문 약을", "ids": ["mssa"]}]}], "nums": [], "says": ["그리고 실제 임상에서는 감염내과가 아니라면 의사결정이 엄청 crude해요.", "그러니까 말씀드리고 싶은 것은 이 둘을 가르는 가장 중요한 기준은 중증도가 아니라"], "fig": {"type": "cmp", "title": "기준은 중증도가 아니라 Pseudomonas", "vs": "vs", "cols": [{"h": "ceftriaxone", "tone": "", "pts": ["중증 CAP 라도", "Pseudomonas 위험이 없으면"]}, {"h": "타조신", "tone": "", "pts": ["stable 해 보여도", "HAP · 과거 Pseudomonas 배양", "반복적인 담도 시술"]}]}, "vid": "ZGUQKO6oKEQ", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-45", "part": 0, "title": "ceftriaxone vs 타조신 — 2부", "line": "ceftriaxone 은 지역사회의 흔한 Streptococcus 와 Enterobacterales 를 편하게 겨냥하고, 타조신은 여기에 Pseudomonas · 혐기성균 · 감수성 있는 E. faecalis 를 더한 약입니다. 그래도 상위호환은 아닙니다. 병마다 볼까요.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["cro", "tzp"], "more": [{"t": "지역사회획득폐렴 — 일반 CAP 는 ceftriaxone(S. pneumoniae, H. influenzae, Moraxella). 중증이라 ICU 에 가도 Pseudomonas 위험인자가 없으면 그대로 갑니다. 과거 호흡기 검체의 Pseudomonas, 최근 입원 · IV 항생제, 기관지확장증 같은 구조적 폐질환의 반복 감염이 있을 때 타조신(정확히는 cefepime · meropenem 을 포함한 anti-pseudomonal 제제)을 고려합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "위험인자가 있을 때만", "ids": ["pseudo"]}], "fig": {"type": "pan", "title": "일반적이면 ceftriaxone, 위험인자가 있으면 타조신", "panels": [{"img": "책_45", "w": 520}]}}, {"t": "병원획득폐렴(HAP) — 경험적 치료부터 Pseudomonas 를 고려하니 타조신 같은 약을 씁니다. 타조신에 안 듣는 Pseudomonas 도 있으니 내성 위험이 크거나 위중하면 anti-pseudomonal agent 를 두 개 쓰기도 합니다. 타조신도 MRSA 는 못 잡으니 MRSA 위험이 있으면 vancomycin 이나 linezolid 를 따로 더합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "HAP — 처음부터 고려", "ids": ["pseudo"]}, {"tip": "둘 다 못 잡는다", "ids": ["mrsa"]}]}, {"t": "복강내 감염 — 여기서 타조신의 장점이 분명합니다. ceftriaxone 은 혐기성균이 안 되어 metronidazole 을 붙이지만, 타조신은 장내 gram (−) · 혐기성균 · 감수성 E. faecalis · Pseudomonas 를 혼자 덮습니다. 그래도 다 타조신은 아닙니다 — 귀한 약은 아껴야 합니다. ESBL 위험이 높으면 타조신으로도 안 되고 carbapenem 으로 갑니다.", "focus": ["c_entb", "anaer", "efaecalis", "pseudo"], "marks": [{"tip": "타조신은 혼자서 덮는다", "ids": ["bfrag"]}, {"tip": "ESBL 이면 carbapenem", "ids": ["esbl"]}], "fig": {"type": "cmp", "title": "복강내 감염 — 귀한 약은 아낀다", "vs": "vs", "cols": [{"h": "ceftriaxone + metronidazole", "tone": "", "pts": ["안정적인 지역사회획득 복강감염"]}, {"h": "타조신 고려", "tone": "", "pts": ["중증 복강감염 · 수술 후 복막염", "병원획득 감염", "최근 광범위 항생제", "반복적인 복강 내 처치"]}]}}, {"t": "담낭염 · 담관염 — 기본 표적인 장내 gram (−) 는 둘 다 덮습니다. 일반적이면 ceftriaxone, 혐기성균이 필요하면 + metronidazole, 중증이면 타조신. 중증이 녹농균 감염이라는 뜻은 아니고, 빗나갔을 때 대가가 크고 담도 시술 · 스텐트 같은 위험이 겹치기 쉬워서입니다. 그리고 「담도가 막혀있는데 타조신만 계속 줘서 뭐합니까」 — 배액(source control)이 먼저입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "둘 다 덮는다", "ids": ["kleb"]}, {"tip": "중증이면 넓게 — 타조신", "ids": ["pseudo"]}]}, {"t": "요로감염 — 위험인자 없는 pyelonephritis · UTI sepsis 의 표적은 E. coli · Klebsiella · Proteus 이고 ceftriaxone 으로 충분합니다. 과거 소변의 Pseudomonas, 장기 foley, 반복 요로 시술, 병원획득, 최근 광범위 항생제, 요양시설 · 반복 입원이면 타조신을 고민합니다. ESBL 이 나오는 환경이면 meropenem 을 고민합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "ceftriaxone 으로 충분", "ids": ["ecoli"]}, {"tip": "위험인자가 있으면 타조신", "ids": ["pseudo"]}]}, {"t": "ceftriaxone 이 그냥 더 맞는 곳 — 세균성 수막염(pneumococcus · meningococcus · H. influenzae, 내성 pneumococcus 에 vancomycin, Listeria 위험군에 ampicillin)과 임질. 그리고 타조신에는 실무 부담이 있습니다.", "focus": ["c_resp", "mening", "gono", "pneumo"], "marks": [{"tip": "ceftriaxone 이 표준", "ids": ["mening"]}, {"tip": "임질도 ceftriaxone", "ids": ["gono"]}], "fig": {"type": "cmp", "title": "쓰기 편한가", "vs": "vs", "cols": [{"h": "ceftriaxone", "tone": "go", "pts": ["대부분 하루 한 번", "신기능이 떨어져도 대개 용량조절 없이"]}, {"h": "타조신", "tone": "stop", "pts": ["대부분 신장 배설 — 신기능 따라 용량조절", "vancomycin 과 같이 쓰면 AKI 주의", "하루 여러 번 · 연장주입", "sodium 이 들어 있다 — 심부전 · 부종"]}]}}], "nums": [], "says": ["그럼 중증으로 가면 타조신 쓰면 되느냐 그거 아니라고 했어요.", "이런 식으로 귀한 약은 좀 save를 해야 돼."], "vid": "I1iFKQyUaA8", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-46", "part": 0, "title": "ceftazidime · cefepime vs 타조신", "line": "셋 다 pseudomonas 를 덮는데 아무거나 쓰면 될까요? 경험적 치료에서는 솔직히 타조신으로 손이 많이 갑니다 — 「이것저것 대충 우루루루 잘 잡기 때문」 입니다. 그런데 셋은 덮는 땅이 조금씩 다릅니다.", "focus": ["gneg"], "drug": ["fep", "tzp"], "more": [{"t": "셋 다 녹농균과 일반 G(−) 에 강합니다. 하나가 늘 우월한 것은 아니니 감수성 결과(MIC)를 보고 정하고, 이 약들에 감수성이 있으면 carbapenem 으로 가지 않고 이 약들을 먼저 씁니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "셋 다 강하다", "ids": ["pseudo"]}]}, {"t": "타조신은 「녹농균 이외에도 같이 잡아야 할 것이 많다」 때 — 특히 혐기성균. 복강 내 감염 · 장 천공, 중증 담도 감염, 골반강 감염, 심한 당뇨족 · 욕창 · 괴사성 연부조직, 장 내용물이 닿은 수술 부위, source 가 불명확한 패혈증, 장점막 · 항문 쪽이 의심되는 호중구감소성 발열.", "focus": ["anaer", "pseudo"], "marks": [{"tip": "타조신만 — 혐기성균까지", "ids": ["bfrag"]}], "fig": {"type": "hub", "title": "타조신 — 녹농균 말고도 잡을 것이 많을 때", "center": "타조신|다균성에 강한 넓은 약", "items": ["복강 내 감염 · 장 천공", "중증 담도 감염", "골반강 감염", "당뇨족 · 욕창 · 괴사성 연부조직", "장관 수술 부위 감염", "source 불명 패혈증", "혐기성이 의심되는 호중구감소성 발열"]}}, {"t": "타조신이 맞지 않는 둘 — ESBL 에는 방법이 없어 carbapenem 으로 가고, AmpC 균(E. cloacae complex, K. aerogenes, C. freundii)에는 권장되지 않습니다.", "focus": ["esbl", "ampc"], "marks": [{"tip": "타조신도 방법이 없다", "ids": ["esbl"]}, {"tip": "타조신은 권장 안 됨", "ids": ["ampc"]}]}, {"t": "cefepime 은 pseudomonas 와 gram (−) 를 같이, anaerobes 는 그닥 필요 없을 때 — HAP/VAP, 병원획득 UTI, 복부 · 항문이 아닌 호중구감소성 발열, 폐 · 요로 · 혈류가 source 인 G(−) 균혈증. 가장 결정적인 장점은 AmpC 에 대한 안정성입니다. 과거 배양에 E. cloacae · K. aerogenes · C. freundii 가 나왔다면 「자신있게 타조신보다 cefepime!」. 혐기성균이 걱정되면 cefepime + metronidazole.", "focus": ["ampc", "esbl", "pseudo", "ecoli", "kleb"], "marks": [{"tip": "cefepime 만 — AmpC 에 안정", "ids": ["ampc"]}]}, {"t": "cefepime 의 주의점 — cefepime induced encephalopathy(36강). 드물지만 고령에 콩팥기능이 떨어져 있고 기저 뇌질환이 있으면 꺼려집니다. 타조신은 그런 이슈가 별로 없습니다.", "focus": [], "fig": {"type": "cmp", "title": "신경계 쪽에서는", "vs": "vs", "cols": [{"h": "cefepime", "tone": "stop", "pts": ["cefepime induced encephalopathy", "고령 · 콩팥기능 저하 · 기저 뇌질환이면 꺼려진다"]}, {"h": "타조신", "tone": "go", "pts": ["그런 이슈는 별로 없다"]}]}}, {"t": "ceftazidime 은 「정말 녹농균·     if (t < -1 || l < -1 || t + f.offsetHeight * k > H + 1 || l + f.offsetWidth * k > W + 1) res.fig.push(i);
    f.querySelectorAll('.col, .fn, .hc, .hi span, td, th, .tm, .sw, figure, h4, .cap, .vs, .lb').forEach(el => {   // 글자가 상자를 벗어나는가(11-22)
      const r = el.getBoundingClientRect(); let over = el.scrollWidth > el.clientWidth + 1;
      el.querySelectorAll('*').forEach(c => { const q = c.getBoundingClientRect(); if (q.width && (q.right > r.right + 1 || q.left < r.left - 1)) over = true; });
      if (over) res.over.push(i + ' ' + el.textContent.trim().slice(0, 30)); });       // 카드가 판 밖으로
  });
  const pre = document.createElement('pre'); pre.id = 'check'; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
}
</script>
</body>
