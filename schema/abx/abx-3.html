const DATA = {"course": {"intro": "cephalosporin 열 편입니다. 세대라는 말이 왜 오해를 부르는지에서 시작해 penicillin 과의 차이, ESBL, cefazolin 과 경구약, 피부 · 연조직 감염, 중간점검, 그리고 2세대의 두 갈래까지 갑니다. 같은 균 지도 위를 약마다 다르게 칠하며 내려갑니다.", "scenes": [{"n": "ANTI-23", "part": 0, "title": "cephalosporin 의 세대는 오해를 부른다", "line": "cephalosporin 은 엄청나게 많이 쓰는 만큼 오해도 많은 약입니다. 가장 큰 오해는 세대가 올라갈수록 더 강하고, 더 넓고, 더 좋은 약처럼 느껴진다는 것입니다.", "focus": "*", "drug": null, "more": [{"t": "세대는 강함의 순서가 아니라 그 cephalosporin 이 개발된 시기를 뜻합니다. 아랫세대는 gram-positive 쪽이 강하고 세대가 올라가며 aerobic gram-negative bacilli 커버가 넓어지는 경향이 있기는 하지만, 이것도 예외가 많아서 꼭 그런 건 아닙니다.", "focus": [], "fig": {"type": "pan", "title": "세대 순서는 세기 순서가 아니다", "panels": [{"img": "책_23", "w": 540}]}}, {"t": "예를 들어 cefazolin 은 1세대지만 MSSA · streptococci · 수술 예방적 항생제에서 아주 중요한 약입니다. 반대로 ceftriaxone 은 3세대지만 MSSA 에는 cefazolin 보다 좋은 약이라고 보기 어렵습니다. 「3세대니까 1세대보다 상위호환」이 아닙니다.", "focus": ["c_strep", "c_staph", "gas", "gbs", "viridans", "mssa"], "drug": "cfz", "marks": [{"tip": "1세대지만 아주 중요한 약", "ids": ["mssa"]}]}, {"t": "같은 세대면 비슷한 약일까요? 3세대 안에서도 ceftriaxone 과 ceftazidime 은 「느낌이 완전히 다릅니다」. ceftriaxone 은 지역사회폐렴의 1차 선택약이 될 만큼 S. pneumoniae 에 잘 듣지만 Pseudomonas 는 cover 하지 않습니다. ceftazidime 은 Pseudomonas 까지 보는 대신 Gram-positive 에 약해서, pneumococcus 가 목표라면 좋은 선택이 아닙니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["cro", "caz"], "marks": [{"tip": "ceftriaxone 쪽이 잘 듣는다", "ids": ["pneumo"]}, {"tip": "ceftazidime 만 본다", "ids": ["pseudo"]}]}, {"t": "2세대도 두 갈래입니다. 보통의 cephalosporin(cefotiam · cefuroxime)은 1세대보다 gram-negative 를 조금 더 보려고 만든 약이라 H. influenzae · Moraxella 같은 호흡기 gram-negative 를 cefazolin 보다 더 봅니다. cephamycin(cefmetazole · cefoxitin)은 이름에 -mycin 이 붙었지만 리보솜을 때리는 약이 아니라 β-lactam 이고, 7α-methoxy group 덕에 β-lactamase 에 더 안정하고 Bacteroides 같은 anaerobe 를 어느 정도 봅니다.", "focus": ["c_resp", "hflu", "morax", "c_entb", "ecoli", "kleb", "anaer", "bfrag"], "drug": ["ctm", "cmz"], "marks": [{"tip": "cefotiam — 호흡기 G(−)", "ids": ["hflu"]}, {"tip": "Bacteroides 를 어느 정도", "ids": ["bfrag"]}]}, {"t": "4세대 c ESBL 은 ceftriaxone · cefotaxime · ceftazidime 같은 3세대 cephalosporin 을 분해할 수 있습니다. 감염이 있으면 대충 3세대 cepha 를 쓰는 게 습관처럼 된 지금, ESBL 이라면 이 약들이 아마 안 들을 테니 경각심을 줍니다.", "focus": [], "drug": "cro", "marks": [{"tip": "3세대 cepha 를 자른다", "ids": ["esbl"]}]}, {"t": "ESBL 유전자는 많은 경우 plasmid 에 실려 있습니다. ESBL 대장균이 증식해 딸세포가 갖는 것이 수직 전파, plasmid 가 다른 대장균이나 Klebsiella 로 건너가 원래 감수성이던 균도 ESBL 생산균이 되는 것이 수평 전파입니다. 「그러면 이건 그 한 녀석의 문제가 아닌거야.」", "focus": ["ecoli", "kleb", "esbl"], "drug": null, "fig": {"type": "pan", "title": "수직 전파와 수평 전파", "panels": [{"img": "책_25", "w": 520}]}}, {"t": "plasmid 에는 ESBL 유전자 하나만 덜렁 실리기보다 다른 내성 유전자가 같이 실린 경우가 많습니다. 그래서 ESBL 균은 ceftriaxone 만 안 듣는 게 아니라 fluoroquinolone · aminoglycoside · TMP-SMX 에도 같이 내성을 보이는 경우가 생겨, 선택지가 확 좁아질 수 있습니다.", "focus": ["esbl"], "drug": "cip", "marks": [{"tip": "FQ 도 같이 안 들을 수 있다", "ids": ["esbl"]}]}, {"t": "여러 gram-negative 가 ESBL 을 가질 수 있고 Pseudomonas aeruginosa · H. influenzae · N. gonorrhoeae 에서도 보고되지만, 특히 문제가 되는 것은 E. coli 와 Klebsiella 입니다. 워낙 흔하기 때문입니다 — E. coli 는 요로감염 · 담도감염 · 균혈증, Klebsiella 는 요로감염 · 폐렴 · 복강내 감염 · 병원감염에서 많이 나옵니다.", "focus": ["gneg"], "drug": null, "marks": [{"tip": "워낙 흔해서 문제", "ids": ["ecoli", "kleb"]}, {"tip": "여기서도 보고된다", "ids": ["pseudo"]}]}, {"t": "검사에서 E. coli 나 Klebsiella 가 3세대 cephalosporin 에 내성이거나 MIC 가 올라가 있으면 「엇, ESBL인가?」 하고, 그다음 cefoxitin 같은 cephamycin 을 봅니다. 전형적인 ESBL 은 cephamycin 을 잘 분해하지 못해서 cefoxitin 이 살아 있는 경우가 많습니다. cefoxitin 까지 안 좋으면 AmpC 나 porin loss 같은 다른 기전이 섞였을 가능성을 생각합니다.", "focus": ["c_entb", "esbl", "ampc"], "drug": "cmz", "marks": [{"tip": "cefoxitin 은 살아 있다", "ids": ["esbl"]}, {"tip": "cefoxitin 도 죽으면?", "ids": ["ampc"]}]}, {"t": "다만 cephamycin 감수성만으로 확진하지는 않습니다. 확인의 핵심은 이 β-lactamase 가 clavulanate 에 억제되는가입니다 — cefotaxime 단독에서 잘 억제되지 않던 균이 clavulanate 를 붙였을 때 훨씬 잘 억제되면 ESBL 입니다. 치료는 역시 carbapenem. ESBL 은 carbapenemase 가 아니라서 meropenem · imipenem · ertapenem 을 깨지 못합니다.", "focus": ["c_entb", "esbl"], "drug": "mem", "fig": {"type": "cmp", "title": "clavulanate 를 붙여 보면", "cols": [{"h": "cefotaxime 단독", "tone": "stop", "pts": ["잘 억제되지 않는다"]}, {"h": "cefotaxime + clavulanate", "tone": "go", "pts": ["훨씬 잘 억제된다", "→ ESBL"]}], "vs": "vs"}, "marks": [{"tip": "carbapenem 은 안 깨진다", "ids": ["esbl"]}]}], "nums": [], "says": ["그러면 이건 그 한 녀석의 문제가 아닌거야.", "왜냐면 ESBL이라면 이것들이 아마 안 들을 테니까.."], "vid": "Ykt-1uvzyOk", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-26", "part": 0, "title": "ESBL 생산균의 치료", "line": "가장 먼저 고르는 약은 carbapenem 이지만 유일한 선택은 아닙니다. 다른 약으로 잡을 수 있으면 carbapenem 은 되도록 아낍니다 — carbapenem-sparing.", "focus": ["c_entb", "ecoli", "kleb", "esbl"], "drug": "mem", "more": [{"t": "ESBL 은 penicillin · cephalosporin · aztreonam 같은 β-lactam 을 분해하는 효소라서 ciprofloxacin · levofloxacin · TMP-SMX · aminoglycoside · nitrofurantoin · fosfomycin 은 직접 분해하지 못합니다. 그렇다고 그냥 쓰면 되는 것은 아닙니다 — 다른 내성 유전자를 같이 가진 경우가 많아 감수성을 꼭 확인합니다. 그리고 네 가지를 늘 묻습니다.", "focus": [], "drug": null, "fig": {"type": "hub", "title": "ESBL 치료 전에", "center": "ESBL 치료|늘 묻는 넷", "items": ["감염 부위가 어디냐?", "환자가 얼마나 중하냐?", "혈류감염이 있느냐?", "먹는 약으로 전환할 수 있느냐?"]}}, {"t": "ESBL 에 의한 단순 방광염이면 「균은 되게 무시무시한데, 감염증은 상대적으로 경미한 측면이 있어.」 방광에 국한된 감염에 처음부터 meropenem 은 과할 수 있습니다. 감수성이 있으면 nitrofurantoin · TMP-SMX 가 선호되고, E. coli 라면 fosfomycin 도 고려합니다. fluoroquinolone 이나 carbapenem 은 듣더라도 가급적 아낍니다.", "focus": [], "drug": "mem", "marks": [{"tip": "방광염엔 meropenem 이 과하다", "ids": ["esbl"]}]}, {"t": "piperacillin/tazobactam 은 애매합니다. 감수성 결과에서 S 로 나와도 tazobactam 이 ESBL 을 항상 안정적으로 막아 주지는 못합니다. 균 수가 많으면 효소를 만드는 균도 많고, 전체 β-lactamase 양이 늘어 항생제가 더 많이 분해됩니다 — inoculum effect. 그래서 혈류감염 · 폐렴 · 복강내 감염 · 농양 · 수술부위 감염 같은 invasive infection 에서는 타조신만 믿고 가기 불안합니다.", "focus": [], "drug": "tzp", "fig": {"type": "pan", "title": "inoculum effect", "panels": [{"img": "책_26", "w": 520}]}, "marks": [{"tip": "S 라도 invasive 면 불안", "ids": ["esbl"]}]}, {"t": "cefmetazole · cefotetan · cefoxitin · flomoxef 같은 cephamycin 은 비교적 ESBL 에 안정적입니다. 하지만 비교적 안정적이라는 것과 써도 되느냐는 다른 문제입니다. 데이터가 제한적이고 inoculum effect 에서도 완전히 자유롭지 않아서, carbapenem 만큼 확립된 것은 아닙니다.", "focus": [], "drug": "cmz", "marks": [{"tip": "비교적 안정적 — 데이터는 부족", "ids": ["esbl"]}]}, {"t": "cefepime 은 AmpC 일 때 쓸 수 있다고 했지만, ESBL 에서는 이야기가 다릅니다. ESBL 은 cefepime 도 가수분해할 수 있습니다 — 잘라 버립니다.", "focus": ["c_entb", "esbl", "ampc"], "drug": "fep", "marks": [{"tip": "cefepime 도 잘린다", "ids": ["esbl"]}, {"tip": "AmpC 라면 쓸 수 있다", "ids": ["ampc"]}]}, {"t": "aminoglycoside(amikacin · gentamicin)와 quinolone 은 β-lactam 이 아니라 ESBL 이 분해하지 못하지만, 같은 plasmid 에 실린 내성 유전자 때문에 동반내성이 많아 감수성을 확인하고 씁니다. aminoglycoside 는 소변 농도가 높아, 경구약이 마땅치 않은 단순 방광염에서 단회 투여 대안이 될 수 있지만 신독성 · 이독성 때문에 오래 편하게 쓰는 약은 아닙니다.", "focus": ["c_entb", "esbl"], "drug": "cip", "marks": [{"tip": "감수성을 확인하고 쓴다", "ids": ["esbl"]}]}], "nums": [], "says": ["균은 되게 무시무시한데, 감염증은 상대적으로 경미한 측면이 있어.", "감염학이 이래서 어려워요.."], "vid": "0CmwKaHZjWo", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-27", "part": 0, "title": "1세대 대표 — cefazolin", "line": "엄청나게 많이 쓰는 1세대 대표 약입니다. 1세대니까 Gram positive 에 강하고 Gram negative 에 약합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "cfz", "more": [{"t": "특히 MSSA 와 Streptococcus 에 강해서 피부 · 연조직 감염, 수술부위 감염 예방에 씁니다. MSSA 에는 딱 그걸 위해 만든 nafcillin · oxacillin 이 있지만, 조사해 보면 cefazolin 도 그렇게 나쁘지 않고 독성도 적습니다. nafcillin 은 하루 4~6번 줘야 하고 phlebitis · 간독성 · 신독성 · 호중구감소까지 신경 쓸 게 많아 요새는 잘 없습니다.", "focus": ["c_strep", "c_staph", "gas", "gbs", "viridans", "mssa"], "marks": [{"tip": "nafcillin 대신 cefazolin", "ids": ["mssa"]}, {"tip": "Streptococcus 에도 강하다", "ids": ["gas"]}]}, {"t": "Gram negative 에 약하다는 건 아예 안 된다는 뜻이 아닙니다. PEK — Proteus mirabilis · E. coli · Klebsiella — 중 감수성 있는 일부 균주에는 활성이 있을 수 있습니다. 피부 · 연조직 감염으로 cefazolin 을 쓰는데 bed-ridden 이라 방광염이 같이 있고, 거기서 cefazolin 에 감수성 있는 E. coli 나 Proteus 가 나왔다면 약을 하나 더 쓰지 않아도 됩니다.", "focus": ["c_entb", "ecoli", "kleb", "proteus"], "marks": [{"tip": "감수성 있는 일부 균주만", "ids": ["ecoli", "kleb", "proteus"]}]}, {"t": "안 되는 것 — MRSA(「되면 얼마나 좋을까..」), Enterococcus(cefazolin 뿐 아니라 cepha 계열 전체를 기대하지 않습니다), Pseudomonas(gram negative 에 약한데 하물며 끝판왕), Enterobacter · Serratia 같은 AmpC 위험균, 그리고 penicillin · cepha · aztreonam 을 다 잘라 버리는 ESBL.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "되면 얼마나 좋을까", "ids": ["mrsa"]}, {"tip": "cepha 계열 전체가 별로", "ids": ["efaecalis"]}, {"tip": "하물며 끝판왕", "ids": ["pseudo"]}]}, {"t": "수술부위 감염에서 제일 중요한 균은 째고 들어가는 피부의 상재균 — 「S. aureus, CoNS, streptococci -- 그냥 이 3개야 외워!」 — 이고, 그걸 잡는 cefazolin 이 딱입니다. 조직침투성이 좋아 근육 · 피하조직 · 관절액 · 뼈에 잘 가서 정형외과 수술에 좋지만, CNS 로는 잘 못 가서 수막염에는 쓸 수 없습니다. 수술 직전, 절개 60분 이내에 줍니다.", "focus": ["c_strep", "c_staph"], "fig": {"type": "pan", "title": "피부 상재균 셋이 따라 들어간다", "panels": [{"img": "책_27", "w": 520}]}}, {"t": "MSSA bacteremia · septic arthritis 같은 중증 MSSA 감염에서도 cefazolin 은 중요한 선택지이고 endocarditis 에도 쓰이지만, 균량이 아주 많으면 일부 MSSA 가 β-lactamase 를 많이 만들어 효과가 떨어질 수 있다는 inoculum effect 문제제기가 있습니다. 감염내과에서 따져 보고 판단합니다.", "focus": ["c_staph", "mssa"], "marks": [{"tip": "균이 아주 많으면 효과가 준다", "ids": ["mssa"]}]}], "nums": ["수술 예방 — 절개 60분 이내 투여", "vancomycin · fluoroquinolone 은 수술 2시간 전부터"], "says": ["근데 조사를 해보면 뭐 그렇게 나쁜 것도 아니고, 독성도 적고 그냥 cefazolin도 괜찮다는 거야....", "정형외과 수술할 때 딱이지."], "vid": "U2azvOvxVeQ", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-28", "part": 0, "title": "경구 cephalosporin — 퇴원할 때 무엇으로 바꾸나", "line": "cefazolin 으로 잘 치료하다 퇴원할 때 경구약은 무엇으로? 원칙대로라면 「애매하게 경구 항생제 따위는 필요없습니다!」 이지만, 그러면 더 이상한 항생제가 나가는 일이 생깁니다. 그래서 최악을 막는 차악을 고릅니다.", "focus": ["c_strep", "c_staph", "gas", "mssa"], "drug": null, "more": [{"t": "주사로 1세대 cepha 를 썼으니 경구도 1세대면 좋겠습니다. 우리나라에서는 cefadroxil 500mg 1T bid 또는 cephalexin 500mg 1C tid~qid 정도가 적당해 보입니다. 둘 다 경구 흡수와 생체 이용률이 90% 이상입니다.", "focus": [], "drug": "oral1", "marks": [{"tip": "주사와 같은 과녁", "ids": ["mssa"]}]}, {"t": "엄청 흔히 쓰는 cefaclor 는 따져 보면 애매합니다. 2세대라 Gram negative 에 조금 더 활성이 있을 텐데 피부 · 연조직 감염과는 잘 맞지 않고, 그럴 거면 Gram positive 를 잘 잡는 1세대가 낫습니다. 감기에 가래가 누렇고 오래간다고 많이 쓰지만 대부분의 상기도 감염은 항생제가 필요 없고, 정말 필요하다면 amoxicillin/clavulanate 처럼 목적이 분명한 약이 낫습니다.", "focus": [], "drug": null, "fig": {"type": "pan", "title": "경구 cephalosporin 셋", "panels": [{"img": "책_28", "w": 520}]}}, {"t": "「cefaclor는 거의 문제가 생기지 않기 때문에 편하게 많이 쓴다」는 인식도 맞지 않습니다. 실제 약물이상반응 자료에서 cefaclor 는 다른 2 · 3세대 cephalosporin 보다 과민반응과 anaphylaxis 비율이 높게 나왔습니다. 항생제 알러지 이력이 있으면 특히 주의합니다.", "focus": [], "drug": null, "fig": {"type": "cmp", "title": "cefaclor 는 편한 약일까", "cols": [{"h": "흔한 인식", "pts": ["오구멘틴은 설사 같은 게 성가시다", "cefaclor 는 거의 문제가 없다"]}, {"h": "약물이상반응 자료", "tone": "stop", "pts": ["다른 2 · 3세대 cephalosporin 보다 과민반응 · anaphylaxis 비율이 높다", "항생제 알러지 이력이 있으면 특히 주의"]}], "vs": "vs"}}, {"t": "경구 3세대 cefixime 은 「사실 좀 황당한 처방입니다.」 staphylococcus 약이 아니어서 — 대부분의 staphylococci 가 내성입니다 — 수술 후 wound 나 cellulitis 에서 걱정하는 MSSA 가 확 빠집니다. 흡수율도 40-50% 에 그치고, 잡을 필요 없는 장내 그람음성균을 죽여 약제내성균을 만들고 C. difficile 감염 위험을 높일 수 있습니다.", "focus": ["c_staph", "mssa", "anaer", "cdiff"], "drug": "cfm", "marks": [{"tip": "MSSA 가 확 빠진다", "ids": ["mssa"]}, {"tip": "C. difficile 위험이 는다", "ids": ["cdiff"]}]}], "nums": ["cefadroxil 500mg bid · cephalexin 500mg tid~qid", "경구 흡수 — 1세대 둘 90% 이상 · cefixime 40-50%"], "says": ["그러면 더 이상한 항생제가 나가는 상황이 발생합니다.", "결국 이런 경우에 쓸 일은 없는 약이다."], "vid": "kR7uS0-jADw", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-29", "part": 0, "title": "피부 · 연조직 감염", "line": "cefazolin 이야기를 한 김에 피부 · 연조직 감염을 간단히 훑습니다. 다리가 퉁퉁 붓고 빨갛고 아프고 화끈거리는데 빨간 부위의 경계가 뚜렷하지 않은 것 — 전형적인 cellulitis(봉와직염)부터.", "focus": ["c_strep", "c_staph"], "drug": null, "more": [{"t": "피부의 어느 층까지 들어갔느냐로 나눕니다. 농가진(impetigo)은 표피의 얕은 감염, 단독(erysipelas)은 진피로 정상 피부와의 경계가 뚜렷하고, 봉와직염(cellulitis)은 진피~피하조직으로 경계가 불분명하며 하지에 흔합니다. 괴사성근막염(necrotizing fasciitis)은 피하조직~근막을 따라 빠르게 진행하는데, 초기 피부 소견은 괜찮아 보여도 환자는 엄청 아파합니다.", "focus": [], "fig": {"type": "pan", "title": "얼마나 깊이 들어갔나", "panels": [{"img": "책_29", "w": 520}]}}, {"t": "폐렴이면 객담, 요로감염이면 소변을 받는데, 봉와직염은 피부와 피하조직 안에서 퍼져서 고름이나 농이 없으면 어디를 배양할지 애매합니다. 남는 게 혈액배양인데 양성률이 5% 정도라 열 같은 전신증상이 심할 때 합니다. 그래서 원인균 확인 없이 경험적 항생제로 치료합니다.", "focus": [], "fig": {"type": "flow", "title": "봉와직염은 어디서 배양하나", "nodes": [{"t": "객담 · 소변이 없다", "sub": "고름 · 농도 없다"}, {"t": "혈액배양", "sub": "양성률 5% 정도"}, {"t": "경험적 항생제", "tone": "go"}], "arrows": ["남는 건", "그래서"]}}, {"t": "무엇을 겨냥할까요? streptococcus 와 MSSA 입니다. 1세대 cepha 가 딱 잘 잡는 균이 바로 이 둘이니 자연스럽게 cefazolin 입니다. 경증이면 경구 항생제로도 치료하지만, 열이 많이 나고 팅팅 부어 걷지 못하거나 범위가 넓거나, 당뇨 · 면역저하 · 고령으로 전신상태가 나쁘면 입원해서 cefazolin IV 가 안전합니다.", "focus": ["c_strep", "c_staph", "gas", "gbs", "viridans", "mssa"], "drug": "cfz", "marks": [{"tip": "streptococcus 를 겨냥", "ids": ["gas"]}, {"tip": "MSSA 를 겨냥", "ids": ["mssa"]}]}, {"t": "치료하다 괜찮아져 퇴원하는데 항생제를 조금 더 쓰고 싶다면, 28강의 cephalexin 이나 cefadroxil 같은 경구 1세대로 이어 갑니다.", "focus": [], "drug": "oral1", "marks": [{"tip": "같은 과녁을 경구로", "ids": ["mssa"]}]}, {"t": "피부 소견에 비해 통증이 너무 심하다, 진행이 너무 빠르다, 전신 독성이 심하다, 수포 · 괴사 · 감각저하가 있다 — 이러면 괴사성근막염입니다. 처음엔 원인균을 모르고 단일균일 수도 복합균일 수도 있어 vancomycin + 타조신(또는 carbapenem) + clindamycin 으로 아주 넓게 덮습니다. vanco 로 MRSA, 타조신이나 carbapenem 으로 나머지 G+ · G− · anaerobe, clinda 는 독소 생산 억제. 배양이 나오면 맞추고, 더 중요한 것은 debridement — source control 입니다. 작은 병원에서 볼 병이 아니라 신속히 상급병원 응급실로 전원합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["van", "tzp"], "marks": [{"tip": "vanco 로 MRSA", "ids": ["mrsa"]}, {"tip": "타조신으로 anaerobe 까지", "ids": ["bfrag"]}]}], "nums": ["봉와직염 혈액배양 양성률 5% 정도"], "says": ["그럼 어디에서 원인균을 찾아서 배양할거야?", "항생제도 중요하지만 더 중요하다고 할 수 있는 것은 source control이다."], "vid": "5uUcqz0OFF8", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-30", "part": 0, "title": "항생제 중간점검 — 복습 여행", "line": "새 약을 배우는 시간이 아니라 지금까지 나온 약을 판 위에 다시 칠해 보는 시간입니다. 「약 이름만 계속 외우면 반드시 무너집니다.」 원칙 → 예외 → 예외의 이유 → 임상적 결론의 순서로 봅니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": null, "fig": {"type": "flow", "title": "항생제를 생각하는 순서", "nodes": [{"t": "원칙", "sub": "G+ 는 벽이 바깥 · G− 는 outer membrane"}, {"t": "예외", "sub": "enterococcus · listeria · Pseudomonas · AmpC"}, {"t": "예외의 이유", "sub": "못 들어감 · 분해 · 표적이 바뀜"}, {"t": "임상적 결론", "tone": "go"}]}, "more": [{"t": "penicillin G 는 β-lactam 의 기준점입니다. peptidoglycan 이 있고, outer membrane 장벽이 없거나 약하고, PBP 가 예민하고, β-lactamase 에 잘리지 않아야 듣습니다 — 그래서 streptococcus · 일부 anaerobe · spirochete 쪽입니다. 우리나라 현실에서 대표 자리는 매독이고, cell wall 이 없는 mycoplasma 에는 듣지 않습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "pcng", "fig": {"type": "pan", "title": "네 가지를 묻는다", "panels": [{"img": "책_04", "w": 500}]}, "marks": [{"tip": "우리나라에선 매독", "ids": ["trepo"]}, {"tip": "cell wall 이 없다", "ids": ["atyp"]}]}, {"t": "ampicillin 하면 두 가지 — Listeria 와 E. faecalis 중증 감염. Listeria 는 gram positive rod 인데 cephalosporin 이 듣지 않아서, 50세 이상 · 면역저하자 · 임신부 · 신생아 수막염에 ceftriaxone + vancomycin 만 쓰면 Listeria 가 빠집니다. E. faecalis 균혈증 · 심내막염에서는 ampicillin 이 핵심이지만 단독으로 부족할 수 있어 gentamicin synergy 나 ampicillin + ceftriaxone 을 생각합니다.", "focus": ["c_strep", "c_entero", "c_listeria", "efaecalis", "listeria"], "drug": ["amp", "cro"], "marks": [{"tip": "ceftriaxone 으론 빠진다", "ids": ["listeria"]}, {"tip": "ampicillin 이 핵심", "ids": ["efaecalis"]}]}, {"t": "Pseudomonas 는 따로 묻는 칸입니다. Gram-negative coverage 가 있다고 Pseudomonas coverage 가 있는 것이 아닙니다 — ceftriaxone · ertapenem · amoxicillin/clavulanate 모두 넓어졌어도 Pseudomonas 는 안 됩니다. outer membrane 투과성이 낮고 efflux pump 가 강하고 AmpC · biofilm 까지 있어서입니다. penicillin 쪽에서 Pseudomonas 를 보려면 piperacillin, 현실에서는 piperacillin/tazobactam 입니다.", "focus": ["gneg"], "drug": ["cro", "tzp"], "fig": {"type": "pan", "title": "Pseudomonas 는 따로 묻는 칸", "panels": [{"img": "책_16", "w": 500}]}, "marks": [{"tip": "따로 확인하는 칸", "ids": ["pseudo"]}]}, {"t": "AmpC 위험균(Enterobacter cloacae complex · Klebsiella aerogenes · Citrobacter freundii)은 감수성표에서 ceftriaxone · cefotaxime · ceftazidime 이 S 로 보여도, 항생제를 만나며 AmpC 생산이 유도돼 치료 중 실패할 수 있습니다. invasive infection 에서는 3세대를 피하고 AmpC 에 비교적 안정적인 cefepime, 또는 carbapenem 을 씁니다. 전통적 inhibitor 조합은 AmpC 해결책이 아닙니다.", "focus": ["c_entb", "ampc"], "drug": ["cro", "fep"], "fig": {"type": "pan", "title": "S 로 시작해 치료 중 실패", "panels": [{"img": "책_17", "w": 500}]}, "marks": [{"tip": "S 를 그대로 믿으면 안 된다", "ids": ["ampc"]}]}, {"t": "ESBL 은 3세대 cephalosporin 까지 분해하고 plasmid 로 퍼지며 다른 내성도 같이 싣습니다. 그렇다고 무조건 meropenem 은 아닙니다 — 단순 방광염이면 과할 수 있고, 혈류감염 · 폐렴 · 복강내 감염 · 농양 같은 중증이면 carbapenem 쪽으로 기웁니다. piperacillin/tazobactam 은 S 로 나와도 invasive infection 에서는 inoculum effect 때문에 조심합니다. 넓은 타조신도 MRSA · atypical pathogen · carbapenemase 는 안 됩니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["tzp", "mem"], "marks": [{"tip": "중증이면 carbapenem 쪽", "ids": ["esbl"]}, {"tip": "타조신도 MRSA 는 안 된다", "ids": ["mrsa"]}]}, {"t": "마지막으로 cephalosporin 세대는 강함의 순서가 아닙니다. cefazolin 은 1세대지만 MSSA · streptococcus 에 강해 수술 예방 · 피부연조직감염 · MSSA 감염에서 중요하고, MSSA 치료에서는 ceftriaxone 보다 낫습니다. 퇴원할 때는 같은 과녁의 cefadroxil · cephalexin 으로 잇습니다. 「좋은 항생제는 무조건 넓은 약이 아닙니다.」 지금 잡으려는 균에 맞는 약입니다.", "focus": ["c_strep", "c_staph", "gas", "gbs", "viridans", "mssa"], "drug": "cfz", "marks": [{"tip": "1세대지만 MSSA 에 강하다", "ids": ["mssa"]}]}], "nums": [], "says": ["Pseudomonas는 별도 체크박스입니다.", "지금 잡으려는 균에 맞는 약입니다.", "하지만 아무 이유 없이 깨지는 것은 아닙니다."], "vid": "dfFYkpC7G0Y", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-31", "part": 0, "title": "2세대 ① cefotiam 계 — 왜 이렇게 애매한가", "line": "1세대 · 3세대는 많이 들어 봤어도 2세대는 지위가 애매해 모호한 채로 쓰게 됩니다. 2세대에는 일반 2세대와 cephamycin 계, 서로 다른 두 그룹이 있고 오늘은 일반 2세대 — cefotiam · cefuroxime 입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "ctm", "more": [{"t": "두 그룹을 먼저 갈라 둡니다. cefotiam · cefuroxime 은 호흡기 gram(−) 쪽으로 넓혔고, cephamycin 은 장관 gram(−) 와 Bacteroides 쪽입니다. 같은 2세대라도 다른 약입니다.", "focus": [], "drug": null, "fig": {"type": "pan", "title": "2세대의 두 갈래", "panels": [{"img": "책_32", "w": 520}]}}, {"t": "세대가 올라갈수록 Gram(−) 쪽으로 넓히며 Gram(+) 는 약간 희생했습니다. 그러니 Gram(+) 를 겨냥한다면 굳이 2세대를 쓸 필요가 없습니다. 피부 · 연조직 감염에 IV 는 cefazolin, PO 는 cephalexin 을 썼는데 여기에 cefotiam 을 쓴다? 「뭐 듣기야 하겠지만, 굳이...」", "focus": ["c_strep", "c_staph", "gas", "gbs", "viridans", "mssa"], "drug": ["ctm", "cfz"], "marks": [{"tip": "듣기야 하지만 1세대가 낫다", "ids": ["mssa"]}]}, {"t": "2세대는 1세대보다 gram-negative 를 조금 더 봅니다. 그럼 2세대를 쓰면 될까요? 정말 gram negative 를 잡고 싶으면 3세대를 쓰면 됩니다. 「cefotiam은 gram negative쪽으로 딱 한발 이동한 약인데,」 그 한 발로 gram negative 를 잡을 수 있느냐는 겁니다.", "focus": ["c_resp", "c_entb", "hflu", "morax", "ecoli", "kleb"], "drug": ["ctm", "cro"], "marks": [{"tip": "진짜 G(−) 면 3세대", "ids": ["ecoli"]}]}, {"t": "혐기성균은 다음 강의의 cephamycin 계가 약간 장점이 있지만 cefotiam 은 이것도 별로입니다. 복부 · 골반 · 장관 감염처럼 혐기성균을 생각해야 할 때 cefotiam 이라고 하기는 많이 무리가 있습니다.", "focus": ["anaer", "bfrag", "oral_ana"], "drug": ["ctm", "cmz"], "marks": [{"tip": "cefotiam 은 이것도 별로", "ids": ["bfrag"]}]}, {"t": "정리하면 피부 · 연조직 감염은 1세대, 본격적인 gram-negative 감염은 3세대, 복부 · 골반 · 혐기성균은 cephamycin 이나 metronidazole 조합이 더 선명합니다. MRSA · Enterococcus 는 cepha 일반계열로 안 되고, Pseudomonas 는 cefotiam 계의 영역이 아니며, atypical pathogen 은 cepha 계열 자체가 못 봅니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "ctm", "fig": {"type": "tbl", "title": "그 자리에 더 선명한 약", "head": ["영역", "더 선명한 약"], "rows": [["피부 · 연조직감염, MSSA, streptococcus", "cefazolin · cephalexin · cefadroxil"], ["본격적인 gram-negative 감염", "ceftriaxone · cefotaxime 등 3세대"], ["복부 · 골반 · 혐기성균", "cefmetazole · cefoxitin · cefotetan 또는 metronidazole 조합"]]}, "marks": [{"tip": "cepha 일반계열로는 안 됨", "ids": ["mrsa"]}, {"tip": "cefotiam계 영역 아님", "ids": ["pseudo"]}]}, {"t": "그럼 버리느냐 하면, 여기저기 어느 정도 듣는 약이라 끼어들 자리가 있습니다. 중증도가 높지 않고 gram(+) 같긴 한데 gram(−) 도 완전히 무시하기 아쉬울 때 — 일부 호흡기 감염입니다. 2세대가 넓힌 gram(−) 가 마침 H. influenzae · Moraxella 같은 호흡기 쪽이기 때문입니다. 다만 감기 · 급성 기관지염 대부분은 항생제가 필요 없고 부비동염으로 가면 amox-clav 를 쓰니, 그 중간에 아리까리할 때 정도입니다.", "focus": ["c_resp", "hflu", "morax"], "drug": "ctm", "marks": [{"tip": "마침 호흡기 쪽 G(−)", "ids": ["hflu", "morax"]}]}], "nums": [], "says": ["그럼.. 뭐야.. 이 약은 언제 써.. 그냥 버려??", "그 중간정도 아리까리할때 써볼 수 있겠다 정도의 뜻입니다."], "vid": "SOF6-AkfsKQ", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-32", "part": 0, "title": "2세대 ② cephamycin 계", "line": "cefmetazole · cefoxitin · cefotetan. cefotiam 계보다 자리가 덜 애매합니다 — 「나는 그래도 혐기성균 Bacteroides를 잡는다고!!」 하는 특장점이 있으니까요. 그렇다고 임상에서 아주 적극적으로 쓰지는 않습니다.", "focus": ["c_entb", "ecoli", "kleb", "anaer", "bfrag"], "drug": "cmz", "more": [{"t": "1세대에서 2세대로 가며 gram negative 가 넓어지는 건 같지만 방향이 다릅니다. cefotiam 이 호흡기 gram negative 로 넓어졌다면, cephamycin 은 장관 쪽 gram negative 로 넓어진 느낌입니다.", "focus": ["c_resp", "c_entb", "hflu", "morax", "ecoli", "kleb"], "drug": ["ctm", "cmz"], "marks": [{"tip": "cefotiam — 호흡기 쪽", "ids": ["hflu"]}, {"tip": "cephamycin — 장관 쪽", "ids": ["ecoli"]}]}, {"t": "그래서 복부 · 골반 · 장관 감염입니다. 장 내용물과 점막의 상재균 중에는 장내 gram negative(E. coli · Klebsiella)가 득실득실하고 Bacteroides 같은 혐기성균도 꽤 많습니다. 장천공 · 충수염 · 게실염 · 복강내 농양이면 둘을 같이 덮어야 하는데, 여기에 cephamycin 이 딱입니다. 이름에 -mycin 이 붙었지만 리보솜을 때리는 약이 아니라 PBP 에 붙는 β-lactam 이고, 7α-methoxy group 덕에 β-lactamase 에 더 안정합니다.", "focus": ["c_entb", "ecoli", "kleb", "anaer", "bfrag"], "drug": "cmz", "marks": [{"tip": "Bacteroides 를 어느 정도", "ids": ["bfrag"]}]}, {"t": "이론은 그렇지만 단정하기는 어렵습니다. 비교적 가볍고 지역사회에서 생겼고 내성균 위험이 크지 않고 수술이나 배액으로 source control 이 되면 후보가 됩니다. 많이 아프거나 패혈증, 병원획득, 최근 항생제 사용, ESBL · AmpC 위험, source control 이 잘 안 되는 농양 · 천공이면 cephamycin 만으로는 부족할 수 있어 ceftriaxone + metronidazole, 더 중증이면 piperacillin-tazobactam · carbapenem 까지 생각합니다. 약해서라기보다 「치료 실패를 절대 피해야 하는 상황에서 빈틈이 있기 때문」입니다.", "focus": ["c_entb", "ampc", "esbl"], "drug": "cmz", "fig": {"type": "cmp", "title": "cephamycin 이 후보가 될 때", "cols": [{"h": "후보가 된다", "tone": "go", "pts": ["비교적 가볍다", "지역사회 감염", "내성균 위험이 크지 않다", "source control 이 된다"]}, {"h": "이것만으론 부족", "tone": "stop", "pts": ["많이 아프다 · 패혈증", "병원획득 · 최근 항생제", "ESBL · AmpC 위험", "source control 이 안 되는 농양 · 천공"]}], "vs": "vs"}, "marks": [{"tip": "이 위험이 있으면 부족", "ids": ["esbl", "ampc"]}]}, {"t": "정리하면 cephamycin 은 enteric gram negative 와 혐기성균을 약간 보는 cepha 입니다. cefotiam 보다 뚜렷해서 복부 · 골반 감염에 생각해 볼 수는 있지만 자신 있게 쓸 약은 아닙니다. 요즘은 애매해 보이는 약의 자리가 점점 없어집니다 — 「그냥 의심이 되면 그걸 확실하게 잡는 걸 빵빵 쓰지!」", "focus": ["c_entb", "ecoli", "kleb", "anaer", "bfrag"], "drug": "cmz", "marks": [{"tip": "enteric G(−)", "ids": ["ecoli"]}, {"tip": "혐기성균은 약간", "ids": ["bfrag"]}]}], "nums": [], "says": ["그런데 그렇다고 아주 적극적으로 임상에서 많이 쓰느냐 하면 그렇지는 않습니다.", "여기에 요 cephamycin이 딱이지."], "vid": "Bu1kYHqbolw", "open": true, "open_date": "", "tier": "니은 회원"}], "board": "균지도", "part_no" function pick() {                         // 읽는 줄(화면 가운데쯤)에 가장 가까운 대목

let tick = false;
addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; pick(); }); } }, { passive: true });
addEventListener('resize', () => { cur = -2; pick(); });
const h = parseInt(location.hash.slice(1));
if (h && document.getElementById('L' + h)) document.getElementById('L' + h).scrollIntoView({ block: 'center' });
{ const g = location.search.match(/go=(\d+)/); if (g && steps[+g[1]]) steps[+g[1]].el.scrollIntoView({ block: 'center' }); }   // 확인용 — ?go=대목번호
pick();

// ── 검사(?check) — 검사.py 가 머리 없는 크롬으로 연다. 대목마다 판을 켜 보고 잰다 ──
if (/[?&]check/.test(location.search)) {

  res.cut = [];
  res.over = [];

  steps.forEach((st, i) => { cur = -2; light(i);
    { const t = st.focus === '*' ? FULL : box(new Set(st.focus)), V = [t[0], t[1], t[0] + t[2], t[1] + t[3]], L = st.focus === '*' ? null : box.lit;   // 비추는 칸이 화면 밖으로 잘리면
      if (L && (L[0] < V[0] - 1 || L[1] < V[1] - 1 || L[2] > V[2] + 1 || L[3] > V[3] + 1 || (svg.querySelector('path.veil') || {style: {}}).style.opacity !== '1')) res.cut.push(i);   // 칸이 잘리거나 가림막이 없으면
      if (!L && st.focus !== '*' && BD[curB].cards.some(c => cut(V, c) > 0 && cut(V, c) < (c[2] - c[0]) * (c[3] - c[1]) - 1)) res.cut.push(i); }
    if (!f.classList.contains('show')) return;

      const r = el.getBoundingClientRect(); let over = el.scrollWidth > el.clientWidth + 1;

  });

}
