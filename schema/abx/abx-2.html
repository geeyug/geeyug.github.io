const DATA = {"course": {"intro": "penicillin G 에서 출발한 약의 땅이 그람음성 · Pseudomonas · 내성균 쪽으로 넓어지는 구간입니다. aminopenicillin · piperacillin 이 어디까지 가는지, Pseudomonas 와 AmpC 가 왜 따로 노는지, β-lactamase inhibitor 를 붙이면 무엇을 얻는지를 판에 칠해 가며 봅니다.", "scenes": [{"n": "ANTI-14", "part": 0, "title": "penicillin 에서 멀어질수록 그람양성은 옅어지고 그람음성은 강해진다", "line": "penicillin 에서 멀어질수록 그람양성균 활성은 옅어지고 그람음성균 활성은 강해진다 — penicillin 만이 아니라 cepha 도, macrolide 도 그렇다는 말입니다. 다만 이건 「결과적으로 자주 보이는 패턴」이지 생물학적 법칙은 아닙니다. 약을 하나씩 바꿔 칠해 보면 땅이 어디로 옮겨 가는지 보입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "pcng", "more": [{"t": "출발점은 penicillin G 입니다. 그람양성 쪽은 강하고 그람음성 쪽은 약합니다. 그람음성은 바깥막 · porin · periplasmic β-lactamase · efflux pump 가 막고 있어서, 잡으려면 약이 네 가지를 해내야 합니다. 그래서 약을 고칠 때 그람음성 쪽 활성을 늘리는 방향으로 구조를 바꾸는 일이 많았고, 그러는 사이 그람양성 활성이 상대적으로 약해지기도 했습니다.", "focus": [], "marks": [{"tip": "모든 내성기전의 끝판왕", "ids": ["pseudo"]}], "fig": {"type": "flow", "title": "그람음성을 잡으려면 약이 해내야 할 것", "nodes": [{"t": "외막 porin 통과"}, {"t": "β-lactamase 에 덜 깨짐"}, {"t": "Gram− PBP 에 잘 붙음"}, {"t": "Pseudomonas 까지", "sub": "경우에 따라", "tone": "stop"}]}}, {"t": "aminopenicillin(ampicillin · amoxicillin)은 그람양성이 중간쯤으로 내려오고 그람음성이 늘었습니다. 늘어난 자리가 E. coli · H. influenzae 쪽이고, Enterococcus · Listeria 도 이 약의 몫입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "amp", "marks": [{"tip": "Gram− 쪽으로 넓어졌다", "ids": ["ecoli"]}, {"tip": "Listeria 는 이 약의 몫", "ids": ["listeria"]}]}, {"t": "그런데 바로 예외가 나옵니다. nafcillin · oxacillin 도 「penicillin에서 멀어진」 약인데, 그람음성이 넓어진 게 아니라 거의 MSSA 용입니다. penicill as 가 특별한 까닭", "center": "Pseudomonas|그람음성의 끝판왕", "items": ["외막 투과성 낮음", "efflux pump", "AmpC", "내성 획득이 빠름", "biofilm", "병원 환경 적응력"]}}, {"t": "그래서 「Gram-negative coverage」 와 「Pseudomonas coverage」 는 따로 묻는 칸입니다. ceftriaxone 은 E. coli · Klebsiella · Proteus · H. influenzae · Neisseria 에 쓰지만 anti-pseudomonal cephalosporin 은 아닙니다. ceftazidime 은 Pseudomonas 를 잡으려고 만든 성격이 강하고, 대신 MSSA · streptococcus 쪽은 ceftriaxone 보다 약한 편입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["cro", "caz"], "marks": [{"tip": "ceftazidime 만", "ids": ["pseudo"]}], "fig": {"type": "pan", "title": "ceftriaxone 의 체크박스", "panels": [{"img": "책_16", "w": 520}]}}], "nums": [], "says": ["Pseudomonas는 “그람음성의 끝판왕”이다.", "“들어왔네? 나가.”"], "vid": "x7WBS_UZWok", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-17", "part": 0, "title": "AmpC β-lactamase", "line": "AmpC 는 Ambler class C 에 드는 β-lactamase 입니다. 중요한 까닭은 「처음에는 별문제 없어 보이다가, 치료 중에 갑자기 문제가 될 수 있기 때문」 — 특히 3세대 cephalosporin 에서.", "focus": ["c_entb", "ampc"], "drug": "cro", "more": [{"t": "Enterobacter cloacae complex · Klebsiella aerogenes · Citrobacter freundii 는 AmpC 유전자를 원래 갖고 있습니다. 평소에는 조금만 만들어서 검사하면 ceftriaxone S 가 나올 수 있습니다. 「어? ceftriaxone 듣네?」 하고 쓰면, β-lactam 을 만난 균이 AmpC 생산을 확 늘려 치료 중에 non-susceptible 로 바뀝니다.", "focus": ["ampc", "esbl"], "marks": [{"tip": "검사는 S, 치료 중엔 깨진다", "ids": ["ampc"]}], "fig": {"type": "pan", "title": "치료 중에 늘어나는 AmpC", "panels": [{"img": "책_17", "w": 520}]}}, {"t": "그래서 invasive infection 에서 이 균들이 나오면 ceftriaxone · cefotaxime · ceftazidime 에 S 가 나와도 피합니다. 이 약들이 AmpC 를 아주 강하게 유도하는 건 아닌데, AmpC 가 늘어나면 잘 깨집니다. 그래서 AmpC 는 지금 얼마나 만들어지고 있느냐 — 양을 봅니다. ESBL 은 있느냐 없느냐만 보면 됩니다.", "focus": ["ampc", "esbl"], "marks": [{"tip": "S 가 나와도 피한다", "ids": ["ampc"]}, {"tip": "있느냐 없느냐", "ids": ["esbl"]}], "fig": {"type": "cmp", "title": "ESBL 과 AmpC — 보는 눈이 다르다", "vs": "vs", "cols": [{"h": "ESBL", "pts": ["있느냐 없느냐", "penicillin · cephalosporin · monobactam 을 넓게 깬다", "carbapenem · cephamycin 은 못 깬다"]}, {"h": "AmpC", "tone": "stop", "pts": ["지금 얼마나 만들어지나", "β-lactam 을 만나면 늘어난다", "늘어나면 3세대 cepha 가 깨진다"]}]}}, {"t": "AmpC 도 β-lactamase 니까 inhibitor 를 붙이면 되지 않나? 그렇지 않습니다. 흔히 쓰던 clavulanate · sulbactam · tazobactam 은 AmpC 를 충분히 억제하지 못합니다. ESBL 에서는 어느 정도 통할 수도 있지만 AmpC 는 다릅니다. avibactam 처럼 AmpC 억제력이 있는 newer inhibitor 는 따로입니다.", "focus": ["ampc", "esbl"], "drug": "tzp", "marks": [{"tip": "tazobactam 으로도 안 된다", "ids": ["ampc"]}]}, {"t": "그럼 cefepime 아니면 carbapenem 입니다. cefepime 은 AmpC 를 강하게 유도하지 않으면서 AmpC 에 비교적 잘 버텨 잘 안 잘립니다. carbapenem 은 오히려 AmpC 를 꽤 유도하지만, carbapenem 자체가 AmpC 에 잘 분해되지 않아 치료 효과가 유지됩니다 — 「너는 너대로, 나는 나대로」.", "focus": ["ampc", "esbl"], "drug": ["fep", "mem"], "marks": [{"tip": "cefepime 이나 carbapenem", "ids": ["ampc"]}], "fig": {"type": "cmp", "title": "AmpC 균에 쓰는 두 약", "vs": "or", "cols": [{"h": "cefepime", "tone": "go", "pts": ["AmpC 를 강하게 유도하지 않는다", "AmpC 에 비교적 잘 버틴다"]}, {"h": "carbapenem", "tone": "go", "pts": ["AmpC 를 꽤 유도한다", "그래도 AmpC 에 잘 분해되지 않는다"]}]}}], "nums": [], "says": ["유도는 약하게 하지만, 일단 AmpC가 많아지면 깨진다.", "너는 너대로, 나는 나대로.. 이런 느낌"], "vid": "kqEYIAtdO-Q", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-18", "part": 0, "title": "실전 사례 — Klebsiella aerogenes 감염", "line": "수술 부위 배양에서 Klebsiella aerogenes 가 나왔고, 감수성표에는 S 가 잔뜩 붙어 있습니다. 무엇을 쓸까요? S 가 많다고 그중 아무거나 쓰면 되는 일이 아닙니다.", "focus": ["c_entb", "ampc"], "drug": null, "more": [{"t": "먼저 균 이름을 봅니다. 단순 Klebsiella 가 아니라 Klebsiella aerogenes — AmpC 위험 Enterobacterales 입니다. cefotaxime S, ceftazidime S 가 나왔으니 편하고 하루 한 번이면 되는 ceftriaxone 을 쓰고 싶어집니다. 절대 그러면 안 됩니다. AmpC 를 유도해서 약이 깨질 위험이 있습니다. 이 균에서 3세대 cepha 는 안 됩니다.", "focus": ["ampc", "esbl"], "drug": "cro", "marks": [{"tip": "S 여도 3세대는 안 된다", "ids": ["ampc"]}], "fig": {"type": "pan", "title": "S 가 많아도 아무거나 쓰지 않는다", "panels": [{"img": "책_18", "w": 520}]}}, {"t": "1차 선택은 cefepime IV 입니다. AmpC 유도성이 낮고 AmpC hydrolysis 에도 비교적 안정적입니다. carbapenem 도 되지만 정말 위급할 때를 위해 아껴 둡니다 — 이걸 항생제 stewardship 이라고 합니다.", "focus": ["ampc", "esbl"], "drug": "fep", "marks": [{"tip": "1차 선택 cefepime IV", "ids": ["ampc"]}]}, {"t": "cefepime 이 없으면 carbapenem 입니다. K. aerogenes 하나뿐이고 Pseudomonas 를 덮을 필요가 없으면 깔끔하게 ertapenem. 상태가 더 나쁘거나 패혈증 · 균혈증이 의심되거나 감염이 깊으면 meropenem · imipenem 쪽을 생각합니다. 안정적이라면 「meropenem까지는 조금 과할 수 있습니다」.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["etp", "mem"], "marks": [{"tip": "ertapenem 으로 충분", "ids": ["ampc"]}, {"tip": "필요 없으면 과하다", "ids": ["pseudo"]}]}, {"t": "ciprofloxacin 도 S 라 쓸 수는 있습니다. 다만 단순 피부 상처가 아니라 수술 뒤 관절 감염 가능성이 있는 상황이라, 가능한 약보다 확실한 약을 써야 해서 조금 불안합니다. cefepime IV 로 시작해 안정되면 cipro 로 step-down 하는 건 몰라도, 처음부터 밀고 가기는 불안합니다. 다른 약이 다 없을 때 쓰는 3순위입니다.", "focus": ["ampc", "esbl"], "drug": "cip", "marks": [{"tip": "듣긴 듣지만 찝찝한 3순위", "ids": ["ampc"]}]}, {"t": "그리고 이 경우 항생제보다 더 중요한 것이 source control 입니다. 「source control이 제대로 되지 않으면, 항생제를 아무리 듣는 거를 써도, 감염증은 해결되지 않습니다」. 듣는 약을 썼는데 2–3일 안에 좋아지지 않으면, 관절 안에 남은 고름 · drain 문제를 점검하고 다시 aspiration · culture, 필요하면 lavage 를 다시 하자고 수술한 쪽에 전달합니다.", "focus": ["ampc", "esbl"], "drug": null, "fig": {"type": "flow", "title": "듣는 약을 썼는데 좋아지지 않으면", "nodes": [{"t": "항생제가 안 듣나?"}, {"t": "source control 은?", "sub": "남은 고름 · drain", "tone": "stop"}, {"t": "다시 aspiration · culture", "sub": "필요하면 lavage 다시"}]}}], "nums": [], "says": ["감수성표에서 S가 많아도 이거중에 아무거나 쓴다고 되는 일이 아니다.", "carbapenem은 정말 위급할 때를 위해 남겨두는 것이 좋아.. 아껴야 돼"], "vid": "Yqd--lkFC8A", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-19", "part": 0, "title": "ampicillin 과 amoxicillin 은 실제로 어디 쓰나", "line": "ampicillin 과 amoxicillin 은 스펙트럼상 거의 같은 계열입니다. 실전에서 갈리는 건 길입니다 — amoxicillin 은 경구 흡수가 대단히 좋아 먹는 외래약, ampicillin 은 주사로 쓰는 입원약.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "amp", "fig": {"type": "pan", "title": "amoxicillin 과 ampicillin 의 자리", "panels": [{"img": "책_19", "w": 520}]}, "more": [{"t": "amoxicillin 은 GAS 인두염에서 penicillin 과 함께 1차 선택인데, 먹기 편해서 amoxicillin 을 씁니다. 기저질환 없는 성인의 외래 폐렴에서도 S. pneumoniae 를 겨냥해 씁니다 — 대신 atypical coverage 가 없어 Mycoplasma · Chlamydophila · Legionella 는 못 잡습니다. 중이염 · 부비동염, 그리고 H. pylori 제균(PPI + amoxicillin + clarithromycin)도 amoxicillin 자리입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "인두염 1차 선택", "ids": ["gas"]}, {"tip": "외래 폐렴에서 겨냥", "ids": ["pneumo"]}, {"tip": "atypical 은 못 잡는다", "ids": ["atyp"]}]}, {"t": "aminopenicillin 의 가장 고유한 자리 하나가 E. faecalis UTI 입니다. 요로 배양에서 E. faecalis 가 ampicillin S 로 나오면 PO 로 amoxicillin 을 꽤 예쁘게 씁니다. 그런데 처음부터 경험적 UTI 약으로는 별로입니다. 흔한 원인균인 E. coli 가 ampicillin · amoxicillin 내성이 흔하기 때문입니다. 균혈증 · 심내막염 같은 중증에서는 단독으로 충분하지 않습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "S 면 amoxicillin 으로", "ids": ["efaecalis"]}, {"tip": "내성이 흔하다", "ids": ["ecoli"]}]}, {"t": "「ampicillin하면 listeria」 입니다. Listeria 는 cephalosporin 에 intrinsic resistance 가 있어서, 50세 이상 · 면역저하자 수막염에 ceftriaxone + vancomycin 만 쓰면 Listeria 가 빠집니다 — ampicillin 을 더합니다. E. faecalis 균혈증 · 심내막염에서도 ampicillin 이 핵심인데, Enterococcus 는 β-lactam 에 tolerance 가 있어 혼자서는 충분히 죽지 않습니다. 그래서 ampicillin + gentamicin, HLAR 이 있으면 ampicillin + ceftriaxone.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "ampicillin 하면 Listeria", "ids": ["listeria"]}, {"tip": "혼자서는 충분히 안 죽는다", "ids": ["efaecalis"]}]}, {"t": "반대로 쓰면 안 되는 곳이 더 중요합니다. MSSA 는 penicillinase 를 잘 만들어 단독으로는 안 믿고(MSSA 면 cefazolin · nafcillin), MRSA 는 당연히 안 됩니다. E. coli · Proteus · H. influenzae 쪽으로 「확장」 되었다지만 β-lactamase 와 내성 때문에 경험적 그람음성 약으로는 불안합니다 — 배양에서 S 가 확인된 좁은 상황이면 가능합니다. Pseudomonas 는 안 되고, K. aerogenes · Enterobacter cloacae · Citrobacter freundii 같은 AmpC 고위험균에는 어차피 큰 기대를 하면 안 됩니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "penicillinase 에 잘린다", "ids": ["mssa"]}, {"tip": "경험치료로는 불안", "ids": ["hflu", "ecoli"]}, {"tip": "안 된다", "ids": ["pseudo"]}]}, {"t": "실전에서는 β-lactamase inhibitor 를 붙인 꼴을 훨씬 자주 씁니다 — 먹는 amoxicillin/clavulanate, 주사 ampicillin/sulbactam. aminopenicillin 이 β-lactamase 에 잘 깨지니, 붙여서 H. influenzae · Moraxella · 일부 oral anaerobe · bite flora · mixed flora 쪽을 보강합니다. 구강 · 호흡기 flora, 교상, 흡인처럼 여러 균이 섞일 때입니다. 그래도 Pseudomonas · AmpC · ESBL 을 해결하는 약은 아닙니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["amp", "amc"], "marks": [{"tip": "clavulanate 가 보강한 자리", "ids": ["hflu", "morax"]}, {"tip": "구강 혐기성균", "ids": ["oral_ana"]}]}], "nums": [], "says": ["ampicillin하면 listeria입니다. (시험에서 나오기 매우 좋죠)", "이게 여러번 돌다 보니까 내용이 자꾸 겹치죠?"], "vid": "dTUWsJLel-s", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-20", "part": 0, "title": "인두염", "line": "amoxicillin 이 쓰이는 대표 장면이 GAS 에 의한 급성 인두염입니다. 인두염은 바이러스성과 세균성으로 나뉘는데, 세균성에서 실제로 중요하게 보는 건 GAS 입니다 — 항생제를 써야 하니까요.", "focus": ["c_strep", "gas"], "drug": "amp", "more": [{"t": "GAS 가능성을 짐작하는 간단하고 직관적인 방법이 Centor criteria 입니다. 기침이 없다 · 목 앞쪽 림프절이 붓고 누르면 아프다 · 열 · 인두에 백태(exudate). 셋 이상이면 GAS 가능성이 어느 정도 있고(30–50%), 하나 이하면 낮아서 보통 검사도 항생제도 필요 없습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "셋 이상이면 30–50%", "ids": ["gas"]}], "fig": {"type": "hub", "title": "Centor criteria", "center": "Centor|셋 이상이면 GAS 30–50%", "items": ["기침이 없다", "목 앞쪽 림프절 종대 (압통)", "발열", "인두 백태 (exudate)"]}}, {"t": "GAS 가 의심되어 amoxicillin 을 쓰려면 원칙적으로 throat swab 으로 신속항원검사(RADT)를 합니다. 소아과에서는 잘 맞지만 성인은 GAS 인두염 비율이 낮고 류마티스열 같은 합병증도 훨씬 드물어서, 기침 · 콧물 · 쉰 목소리처럼 바이러스를 시사하면 항생제 없이 대증치료로 갑니다. Centor 를 대부분 채우면 성인이라도 RADT 로 확인하고 양성이면 amoxicillin 이 제일 깔끔합니다.", "focus": [], "marks": [{"tip": "RADT 양성이면 amoxicillin", "ids": ["gas"]}], "fig": {"type": "flow", "title": "성인 인두염에서", "nodes": [{"t": "Centor 대부분 만족"}, {"t": "RADT", "sub": "throat swab"}, {"t": "양성이면 amoxicillin", "tone": "go"}]}}, {"t": "검사 없이 amoxicillin 을 썼을 때 유명한 함정이 전염성 단핵구증, EBV 입니다. 열 · 심한 인후통 · 편도 부종 · 삼출물로 GAS 인두염처럼 보이는데, 여기에 amoxicillin · ampicillin 을 주면 몸통을 중심으로 발진이 생깁니다. 항생제 시작 2–10일 뒤, 가렵고 넓게 퍼지는 꼴이 많습니다. 금방 두드러기 · 혈관부종 · 아나필락시스로 오는 IgE penicillin allergy 와 달리, 지연형 T-cell mediated drug eruption 에 가깝습니다.", "focus": [], "fig": {"type": "pan", "title": "amoxicillin 을 먹은 뒤", "panels": [{"img": "책_20", "w": 520}]}}, {"t": "그래서 성인 인두염에서 Centor 는 어느 정도 맞는데 RADT 를 못 하면, EBV 일까 봐 amoxicillin 을 쓰기 부담스러워 cefaclor 같은 cephalosporin 을 많이 씁니다. 정석은 아닙니다 — GAS 가 맞으면 amoxicillin 을 써야 하고, 아니면 항생제가 아예 필요 없습니다. 현장에서 amoxicillin 은 오히려 인두염이 아닐 때 — COPD 가 있는 경한 폐렴 · 기관지염에 amoxicillin-clavulanate 로, 또는 부비동염 · 중이염에 많이 씁니다.", "focus": [], "drug": null, "marks": [{"tip": "cefaclor 는 이도저도 아니다", "ids": ["gas"]}]}], "nums": ["Centor 셋 이상 → GAS 가능성 30–50%", "EBV 발진은 항생제 시작 2–10일 뒤"], "says": ["cefaclor는 이도저도 아니고 애매하다..", "괜히 약썼다 문제생기는 게 더 무섭거든요.."], "vid": "0UPGSSRwoXU", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-21", "part": 0, "title": "Pseudomonas 에 듣는 penicillin — piperacillin", "line": "piperacillin 은 penicillin 골격을 어떻게든 Pseudomonas 에 들이밀어 보자며 각고의 노력을 들인 결과물입니다. 장내세균도 잡지만 일부러 그걸 위해 쓰지는 않아서, 이 약의 목적은 「그냥 pseudomonas를 죽이는 것이다」 라고 해도 크게 틀리지 않습니다.", "focus": ["c_nonf", "pseudo"], "drug": "pip", "more": [{"t": "penicillin G 에 amino 기를 붙여 aminopenicillin 을 만들었고, 거기서 side chain 을 더 늘려 그람음성에 더 듣게 한 것이 acylaminopenicillin(ureidopenicillin), 그 대표가 piperacillin 입니다. 그람양성은 penicillin G · aminopenicillin 보다 조금 떨어지고 그람음성에는 강합니다. penicillin 가운데 Pseudomonas 에 O 인 것은 이것 하나입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "penicillin 중 이것 하나", "ids": ["pseudo"]}], "fig": {"type": "pan", "title": "side chain 이 바뀔수록", "panels": [{"img": "책_21", "w": 520}]}}, {"t": "그런데 piperacillin 단독은 감수성이 확인됐을 때 de-escalation 으로 쓰는 정도라 많이 줄었고, 대부분 piperacillin/tazobactam 으로 씁니다. tazobactam 이 붙으면 β-lactamase 를 만드는 장내 그람음성균과 혐기성균까지 들어옵니다. 다만 「광범위하다고 해서 다 좋은 건 아닙니다」 — β-lactamase 를 안 만드는 Pseudomonas 라면 그냥 piperacillin 으로 될 텐데, 현실은 이렇게 되어 버렸습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["pip", "tzp"], "marks": [{"tip": "tazobactam 이 더한 자리", "ids": ["bfrag"]}]}, {"t": "그래서 그람음성 + 일부 그람양성 + 혐기성균 + Pseudomonas 가능성까지, 이것저것 섞인 감염이 의심될 때 쓰기 좋습니다. 단 Pseudomonas 에도 「효과가 있다」 가 아니라 「감수성이 확인되면 쓸 수 있다」 입니다. Pseudomonas 면 무조건 듣는 게 아니라 반드시 감수성 결과를 봅니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "tzp", "marks": [{"tip": "감수성이 확인되면", "ids": ["pseudo"]}], "fig": {"type": "hub", "title": "piperacillin/tazobactam 을 쓰는 자리", "center": "타조신|섞인 감염", "items": ["병원획득 폐렴 — Pseudomonas 가능성", "복강내 감염 — 그람음성 + 혐기성균", "당뇨발 · 욕창 · 수술부위 — polymicrobial", "중증 감염의 경험적 항생제", "원인균이 애매한 sepsis"]}}, {"t": "조심할 것. tazobactam 이 붙었다고 모든 β-lactamase 를 막는 건 아닙니다 — AmpC · ESBL · carbapenemase 는 안정적으로 억제하지 못합니다. MRSA 와 atypical 도 덮지 않습니다. 신기능에 맞춰 조절하고, 특히 vancomycin 과 같이 쓸 때 AKI 를 조심합니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "tzp", "marks": [{"tip": "tazobactam 으로도 못 막는다", "ids": ["ampc", "esbl"]}, {"tip": "MRSA 는 안 된다", "ids": ["mrsa"]}]}], "nums": [], "says": ["광범위하다고 해서 다 좋은 건 아닙니다..", "그럼에도 불구하고, 이 penicillin골격을 어떻게든 pseudomonas에 들이밀어보자.. 라고 각고의 노력을 가한 결과물이 바로 piperacillin이라는 거죠."], "vid": "1Oe6xmG1w24", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-22", "part": 0, "title": "β-lactamase inhibitor 의 기전", "line": "β-lactamase inhibitor 는 세균의 β-lactamase 를 먼저 붙잡아서, 진짜 항생제인 β-lactam 이 잘리지 않게 지키는 약 — 「β-lactam 항생제의 방패」 입니다. 주된 살균제는 아닙니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": null, "more": [{"t": "네 단계로 갑니다. PBP 가 cross-linking 으로 세포벽을 만들고 → β-lactam 이 PBP 를 막고 → 세균이 β-lactamase 를 만들어 β-lactam 을 자르고 → 사람이 그 β-lactamase 를 막는 inhibitor 를 만들었습니다. 균을 죽이는 건 결국 β-lactam 이라 inhibitor 만 쓰면 아무 효과가 없습니다. 그래서 늘 amoxicillin + clavulanate, ampicillin + sulbactam, piperacillin + tazobactam 처럼 짝으로 나옵니다.", "focus": [], "fig": {"type": "pan", "title": "뒤의 것이 앞의 것을 막는다", "panels": [{"img": "책_22", "w": 520}]}}, {"t": "clavulanate 는 Streptomyces clavuligerus 라는 방선균이 만든 미끼입니다. β-lactam 인 척 β-lactamase 를 꼬셔서, 효소가 공격하는 순간 각성해 효소를 비활성화합니다 — 그래서 suicide inhibitor. 그런데 AmpC, 많은 carbapenemase, 특히 metallo-β-lactamase 에는 거의 안 통하고, ESBL 도 시험관에서는 되는 것처럼 나오는데 실제 임상에서는 안 되는 일이 종종 있습니다. 「아예 안 꼬셔 질수도 있고」, 꼬셔졌다가 「아닌가벼」 하고 나올 수도 있습니다.", "focus": ["c_entb"], "drug": "amc", "marks": [{"tip": "거의 안 통한다", "ids": ["ampc"]}, {"tip": "시험관에선 되는데", "ids": ["esbl"]}]}, {"t": "sulbactam 도 기전은 clavulanate 와 비슷한데, 혼자서 PBP 에 붙어 항균 효과를 냅니다. 유명한 것이 Acinetobacter 입니다. inhibitor 만으로는 효과가 없다고 했는데 sulbactam 은 그 예외라서, Acinetobacter 가 나오면 ampicillin/sulbactam 을 좀 더 적극적으로 생각합니다. tazobactam 은 sulbactam 과 비슷합니다.", "focus": ["c_nonf", "acine"], "drug": "sam", "marks": [{"tip": "sulbactam 혼자서도 듣는다", "ids": ["acine"]}]}, {"t": "그래서 새 inhibitor — avibactam, relebactam 이 나왔습니다. 꼬셔서 자살시키는 대신, 공유결합으로 β-lactamase 를 꽉 붙잡아 둡니다. 가역적이라 다시 풀릴 수 있지만 문제가 안 됩니다. 묶어 두는 동안 β-lactam 이 가서 균을 죽이면 되니까요. ceftazidime + avibactam, imipenem + relebactam, meropenem + vaborbactam — KPC · AmpC 같은 더 어려운 β-lactamase 를 겨냥한 약입니다.", "focus": ["c_entb"], "drug": "cza", "marks": [{"tip": "AmpC 를 겨냥", "ids": ["ampc"]}, {"tip": "KPC 를 겨냥", "ids": ["cre"]}]}], "nums": [], "says": ["묶어두는 동안에 행동대장들이 가서 균을 죽이면 되는 거잖아.", "그러니까 beta-lactam을 안쓰고 beta-lactamase inhibitor만 쓰는 건 아무 효과가 없겠죠."], "vid": "iD1yrOnBmKE", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-22-1", "part": 0, "title": "inhibitor 를 붙여 실제로 얻는 것", "line": "ampicillin · amoxicillin 은 혼자보다 sulbactam · clavulanate 를 붙여 쓰는 일이 더 많습니다. 붙여서 얻는 것은 셋 — MSSA, 혐기성균, 일부 그람음성균입니다. 파랑은 amoxicillin 혼자, 주황은 clavulanate 를 붙여야 듣는 자리입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["amp", "amc"], "more": [{"t": "첫째, MSSA. 대부분의 MSSA 는 penicillinase 를 만들어서 ampicillin · amoxicillin 만으로는 효과가 별로 없습니다. inhibitor 가 그걸 막으니 MSSA 에 효과가 생깁니다. 그래도 MSSA 가 문제의 중심인 bacteremia · endocarditis · osteomyelitis 에서는 처음부터 MSSA 를 잡는 nafcillin · oxacillin · cefazolin 을 씁니다 — 「전문가가 있으니 전문가에 맡긴다」. MRSA 에는 효과가 없습니다. mecA 로 표적 자체가 PBP2a 로 바뀌어서, β-lactamase 를 막아 봐야 상관이 없습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "inhibitor 로 다시 듣는다", "ids": ["mssa"]}, {"tip": "표적이 바뀌어 소용없다", "ids": ["mrsa"]}], "fig": {"type": "pan", "title": "MSSA 는 효소, MRSA 는 표적", "panels": [{"img": "책_22-1", "w": 520}]}}, {"t": "둘째, 혐기성균. ampicillin · amoxicillin 도 β-lactamase 를 안 만드는 peptostreptococcus · 일부 clostridium · 일부 oral anaerobes 는 혼자서 잡습니다. 그런데 Bacteroides fragilis · Prevotella 처럼 β-lactamase 를 만드는 혐기성균은 inhibitor 가 있어야 잡힙니다. 그래서 치아 · 구강 · 두경부 감염(치태 안 · 치주낭은 산소가 적다), 사람 · 동물 교상(입안 균이 조직 깊숙이 들어간다), 흡인으로 생긴 폐농양 · 농흉, 일부 복강 · 골반 감염에 씁니다.", "focus": ["anaer"], "marks": [{"tip": "혼자서도 일부 잡힌다", "ids": ["oral_ana"]}, {"tip": "inhibitor 가 있어야", "ids": ["bfrag"]}]}, {"t": "셋째, 일부 그람음성균. β-lactamase 를 만드는 그람음성균에도 활성이 다시 생깁니다. 호흡기 쪽 H. influenzae · Moraxella catarrhalis, 장내 쪽 일부 E. coli · 일부 Klebsiella · Proteus mirabilis — 지역과 감수성에 따라 다르지만 보강되는 쪽입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "호흡기 그람음성", "ids": ["hflu", "morax"]}, {"tip": "장내세균은 일부", "ids": ["ecoli", "kleb"]}]}], "nums": [], "says": ["전문가가 있으니 전문가에 맡긴다.", "입 안으로 공기 들어간다고 해서 모든 부위에 산소가 충분한 것은 아닙니다."], "vid": "WZKw8Bo243s", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-22-2", "part": 0, "title": "오구멘틴(amoxicillin-clavulanate)의 실전 사용", "line": "「오구멘틴은 경구로 쓰는 외래용 약이고」, 유나신은 주사로 쓰는 입원용 약입니다. 이 정도만 알아도 사실 충분합니다. 경구 흡수가 좋은 amoxicillin 에 clavulanate 를 붙였으니, 환자가 안정적이고 먹을 수 있는 외래 감염에서 씁니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "amc", "more": [{"t": "덮는 균을 나눠 보면 — Streptococcus 는 aminopenicillin 몫, MSSA · 호흡기 그람음성균(일부) · 구강 혐기성균은 β-lactamase inhibitor 를 붙여 얻은 몫입니다. 이 균들이 섞이는 community-acquired mixed infection, 특히 입 · 치아 · 상기도 · 흡인 · 교상과 엮인 감염에 잘 어울립니다. 「치과에서 오구멘틴을 많이 쓰는데는 이유가 있는 거예요」.", "focus": [], "marks": [{"tip": "aminopenicillin 몫", "ids": ["gas", "pneumo"]}, {"tip": "inhibitor 가 더한 몫", "ids": ["mssa"]}, {"tip": "구강 혐기성균도", "ids": ["oral_ana"]}]}, {"t": "급성 세균성 부비동염 · 일부 중이염. 원인균에 S. pneumoniae 말고도 H. influenzae · Moraxella catarrhalis 가 있는데, 이 둘에는 β-lactamase 를 만드는 균이 많아 amoxicillin 단독이 불안할 때 clavulanate 를 붙입니다. 다만 감기 · 콧물 · 기침이 있다고 쓰는 약이 아닙니다. 대부분 바이러스라 세균성인지 먼저 판단합니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "β-lactamase 를 잘 만든다", "ids": ["hflu", "morax"]}]}, {"t": "치성 감염 · 구강 · 두경부 감염에는 Streptococcus 와 구강 혐기성균이 함께 관여합니다. 안정적이고 먹을 수 있고 너무 깊지 않으면 좋은 선택 — 다만 농양이면 배농 · 발치 · 근관치료 같은 source control 이 먼저입니다. 개 · 고양이 · 사람 교상은 오구멘틴의 가장 전형적인 장면입니다. 입안 균이 조직 깊숙이 들어가니까요. 손 · 얼굴의 깊은 상처, 면역저하, 관절 · 골막 침범 가능성이 있으면 감염이 뚜렷하지 않아도 3–5일 예방적 치료를 생각합니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "Streptococcus 와 함께", "ids": ["oral_ana"]}], "fig": {"type": "hub", "title": "교상에서 들어오는 균", "center": "교상|입안 균이 깊숙이", "items": ["Streptococcus", "MSSA", "Pasteurella", "Eikenella (사람 교상)", "여러 혐기성균"]}}, {"t": "외래 CAP 에서는 거의 오구멘틴을 씁니다. amoxicillin 단독은 선뜻 고르기 어렵고, 경구 cephalosporin 은 유용성이 그다지 크지 않습니다. 다만 atypical(Mycoplasma · Chlamydophila · Legionella)은 못 잡아서, 필요하면 doxycycline · macrolide 를 함께 씁니다. 그리고 입원해 유나신 주사를 맞다가 좋아지면 오구멘틴으로 바꿔 퇴원하는 흐름도 많습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "못 잡는다 · 따로 붙인다", "ids": ["atyp"]}], "fig": {"type": "flow", "title": "유나신에서 오구멘틴으로", "nodes": [{"t": "유나신 주사", "sub": "입원"}, {"t": "열 · 전신상태 호전", "sub": "source control · 먹을 수 있음"}, {"t": "오구멘틴으로 퇴원", "tone": "go"}]}}], "nums": [], "says": ["치과에서 오구멘틴을 많이 쓰는데는 이유가 있는 거예요.", "고름이 차 있는데 오구멘틴만 계속 먹인다고 감염이 해결되는 것은 아닙니다."], "vid": "gZxOD4R4g_U", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-22-3", "part": 0, "title": "유나신(ampicillin-sulbactam)의 실전 사용", "line": "유나신은 오구멘틴과 스펙트럼이 거의 겹칩니다. 오구멘틴이면 될 것 같은 사람인데 좀 심해서 입원시켜 IV 로 쓸 때 — 이렇게 봐도 크게 무리는 없습니다(「약간의 무리는 있습니다」).", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "sam", "more": [{"t": "입원한 CAP · 농흉 · 폐농양. 다들 ceftriaxone 을 쓰지만 유나신도 CAP 치료에 정식으로 들어가 있는 표준 β-lactam 입니다. 구강 상태가 나쁘고 흡인 가능성이 있어 혐기성균을 잡고 싶다면, ceftriaxone 에 clindamycin 을 붙이기보다 유나신이 더 현명할 수 있습니다. atypical 이 필요하면 azithromycin · doxycycline 을 붙입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["cro", "sam"], "marks": [{"tip": "둘 다 CAP 표준", "ids": ["pneumo"]}, {"tip": "유나신 쪽 — 혐기성균", "ids": ["oral_ana"]}]}, {"t": "얼굴이 많이 붓고 삼키기 힘들고 deep neck infection 이 의심되는 심한 치성 감염, 깊이 물려 관절 침범 가능성 · cellulitis · 전신 증상이 있는 교상 — 가벼우면 오구멘틴, 심하면 입원해서 유나신 IV 입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "fig": {"type": "pan", "title": "가벼우면 먹는 약, 무거우면 주사", "panels": [{"img": "책_22-2", "w": 520}]}}, {"t": "일부 복강내 · 골반 감염에도 혐기성균 때문에 쓸 수 있게 되어 있습니다. 그런데 E. coli 의 유나신 감수성이 지역과 사람마다 달라 안 들을 수도 있어서, 현실에서 우선적으로 쓰지는 않습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "안 들을 수도 있다", "ids": ["ecoli"]}, {"tip": "혐기성균 때문에 쓴다", "ids": ["bfrag"]}]}, {"t": "오구멘틴에는 없고 유나신에만 있는 자리가 Acinetobacter 입니다. sulbactam 이 Acinetobacter 의 PBP 에 직접 붙어 스스로 항균 효과를 내기 때문입니다. 다만 적절한 상황에서 고려해 볼 수 있다는 뜻이지, CRAB(carbapenem-resistant A. baumannii) 을 유나신 단독으로 잡는다는 말이 아닙니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["amc", "sam"], "marks": [{"tip": "유나신에만 — sulbactam", "ids": ["acine"]}]}, {"t": "둘 다 안 되는 곳. MRSA 는 표적이 PBP2a 로 바뀌어 clavulanate · sulbactam 을 붙여도 해결되지 않습니다. Pseudomonas 도, atypical 도 안 됩니다. K. aerogenes · Enterobacter cloacae · Citrobacter freundii 같은 AmpC 고위험균도, 중증 ESBL 감염도 이 조합으로는 믿기 어렵습니다. 기억할 말은 「입, 치아, 물림, 그리고 흡인 후 만들어진 농양.」 — Streptococcus · MSSA · 호흡기 그람음성 · 혐기성균이 함께 섞이는 자리입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": "sam", "marks": [{"tip": "inhibitor 로 해결 안 됨", "ids": ["mrsa"]}, {"tip": "안 됩니다", "ids": ["pseudo"]}, {"tip": "AmpC · 중증 ESBL", "ids": ["ampc", "esbl"]}]}], "nums": [], "says": ["그러니까 입원해서는 유나신.", "입, 치아, 물림, 그리고 흡인 후 만들어진 농양."], "vid": "w9dRnmztElw", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-22-4", "part": 0, "title": "유나신 vs 타조신", "line": "타조신(piperacillin-tazobactam)은 β-lactam · β-lactamase inhibitor 복합제의 끝판왕입니다. 앞서 본 유나신과 견주면 정리가 쉽습니다. 판의 파랑은 유나신만, 주황은 타조신만, 반반은 둘 다 듣는 자리입니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "drug": ["sam", "tzp"], "more": [{"t": "가장 큰 차이는 Pseudomonas 입니다. 타조신은 애초에 antipseudomonal penicillin 인 piperacillin 을 바탕으로 만들어서 Pseudomonas 를 덮고, 유나신은 못 덮습니다. 그래서 병원획득폐렴(HAP) · 중환자실 감염 · 장기입원 · 과거 Pseudomonas 배양력 · 구조적 폐질환에서 경험적으로 고를 때, 타조신은 되고 유나신은 안 됩니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "타조신만", "ids": ["pseudo"]}]}, {"t": "일반 그람음성도 범위와 신뢰도가 다릅니다. ampicillin 은 그람음성으로 「그야말로 살짝 확장된거야」. piperacillin 은 그람음성 쪽으로 확 많이 간 ureidopenicillin 이라 E. coli · Klebsiella · Proteus · Serratia · Morganella · Enterobacter 에서 유나신보다 낫습니다. 우리나라에서 유나신은 E. coli 내성이 많아 요로 · 복부 감염에 자신 있게 쓰기 어렵습니다. 그래도 「어디까지나 유나신보다 낫다는 거야」 — Enterobacter cloacae · K. aerogenes 같은 AmpC 균에는 타조신도 문제가 있습니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks": [{"tip": "유나신은 내성이 많다", "ids": ["ecoli"]}, {"tip": "타조신이 더 넓다", "ids": ["kleb"]}, {"tip": "AmpC 는 둘 다 문제", "ids": ["ampc"]}]}, {"t": "혐기성균과 그람양성은 거의 비슷합니다. Streptococcus · MSSA · 감수성 있는 E. faecalis · 구강 혐기성균 · B. fragilis group 을 포함한 일부 복강내 혐기성균 — 둘 다 덮고, 여기서는 타조신이 훨씬 낫고 그런 건 아닙니다.", "focus": ["gas", "gbs", "pneumo", "viridans", "efaecalis", "efaecium", "vre", "mssa", "mrsa", "vrsa", "listeria", "hflu", "morax", "mening", "gono", "ecoli", "kleb", "proteus", "ampc", "esbl", "cre", "pseudo", "mdrp", "acine", "steno", "oral_ana", "bfrag", "cdiff", "trepo", "atyp"], "marks":
