const DATA = {"course": {"scenes": [{"n": "ANTI-33", "part": 0, "title": "어쩌다 ceftriaxone 을 이렇게 많이 쓰게 되었나", "line": "ceftriaxone 은 아마 가장 많이 쓰는 항생제입니다. 흔한 균을 잡고, 하루 한 번이면 되고, 신기능 걱정이 적고, 여기저기 잘 들어가고, 부작용 부담도 덜합니다. 그 편함 때문에 「잘 모르겠으면, 그냥 ceftriaxone!」 으로 가기 쉽습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "cro", "more": [{"t": "첫째, 꽤 흔한 감염의 꽤 흔한 균을 잡습니다. pneumococcus · H. influenzae 는 폐렴, E. coli · Klebsiella 는 요로감염, meningococcus 까지 더하면 수막염, gonococcus 는 임질. 장내 gram negative 도 좀 잡아서 복부감염에도 씁니다(metronidazole 을 같이). 「이리저리 우루루루 대충 다 잡는다」 — 그래서 많이 씁니다.", "focus": ["pneumo", "hflu", "mening", "gono", "ecoli", "kleb"], "marks": [{"tip": "폐렴 — pneumococcus", "ids": ["pneumo"]}, {"tip": "요로감염 — E. coli", "ids": ["ecoli"]}, {"tip": "수막염 · 임질", "ids": ["mening"]}]}, {"t": "둘째, 편합니다. 성인은 보통 1–2 g 하루 한 번. cefotaxime 은 q8h, 심하면 q6h 로 줘야 합니다. 그리고 ceftriaxone 은 신장으로도, 담즙으로도 나가서(dual elimination) 신기능만 떨어진 경우에는 대개 용량조절 없이 씁니다. 항생제마다 eGFR 을 계산해 용량을 찾아보는 스트레스가 없습니다.", "focus": [], "fig": {"type": "hub", "title": "나가는 길이 둘 — dual elimination", "center": "ceftriaxone|1–2 g 하루 한 번", "items": ["신장으로도 나가고", "담즙으로도 나간다", "신기능만 떨어지면 → 대개 용량조절 없이", "신기능 · 간기능이 함께 많이 떨어지면 → 주의"]}}, {"t": "셋째, 여기저기 잘 들어갑니다. 혈중농도가 괜찮고, 소변과 담즙으로 나가니 요로 · 담도 감염에 쓰고, 수막에 염증이 있으면 CSF 로도 의미 있게 들어갑니다. 다만 들어간다고 다 잡는 건 아니니 잘 보고 씁니다.", "focus": [], "fig": {"type": "hub", "title": "자주 문제가 되는 장소에 잘 간다", "center": "ceftriaxone|잘 들어가는 곳", "items": ["폐", "요로", "담도", "수막 — 염증이 있으면 CSF 로"]}}, {"t": "넷째, 부작용이 「상대적으로」 덜 부담스럽습니다. 설사, 호산구증가, AST/ALT 상승, 담즙에 생기는 biliary sludge, 드물게 과민반응 · C. difficile · hemolytic anemia 도 있지만, aminoglycoside 나 fluoroquinolone, vancomycin 처럼 늘 신경 쓰이는 것은 아닙니다.", "focus": [], "fig": {"type": "cmp", "title": "신경 쓰이는 부작용 — 견주어 보면", "vs": "vs", "cols": [{"h": "다른 약", "tone": "stop", "pts": ["aminoglycoside — 신독성 · 이독성", "fluoroquinolone — tendon rupture · QT prolong · neuropathy · aortic aneurysm", "vancomycin — trough · AUC 를 보며"]}, {"h": "ceftriaxone", "tone": "go", "pts": ["설사 · 호산구증가 · AST/ALT 상승", "biliary sludge(담즙으로 나가서)", "과민반응 · C. difficile · hemolytic anemia — 있지만 부담은 적다"]}]}}, {"t": "그래서 애매하면 「에잇! 세프트리악손..!」 이 되는데, 그러면 안 됩니다. 못 잡는 것이 있습니다 — MRSA, Enterococcus, Listeria, Pseudomonas, 혐기성균, atypical pathogen, 그리고 ESBL/AmpC. 판의 빗금 칸이 그 구멍입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "피부 · 카테터 · 병원감염", "ids": ["mrsa"]}, {"tip": "병원감염 · 구조적 폐질환", "ids": ["pseudo"]}, {"tip": "믿으면 안 되는 대표 상황", "ids": ["esbl"]}]}], "nums": ["성인 1–2 g 하루 한 번(필요하면 q12h)", "cefotaxime 은 q8h, 심하면 q6h"], "says": ["사실 이 ceftriaxone이 제가 아마도 가장 많이 사용한 항생제라고 할 수 있을 정도로 많이 사용했습니다.", "그래서 이리저리 우루루루 대충 다 잡는다 그래서 많이 쓴다.. 이게 일차적인 이유입니다."], "vid": "VuHRG1OuHa4", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-34", "part": 0, "title": "ceftriaxone 실전 사용법", "line": "ceftriaxone 을 쓸 때는 「내가 지금 ceftriaxone으로 잡으려는건」 무엇인지부터 정합니다. 병마다 target 이 다르고, 붙여야 하는 약도 다릅니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "cro", "more": [{"t": "지역사회획득폐렴(CAP) — target 은 S. pneumoniae, H. influenzae, Moraxella, 일부 gram negative. atypical pathogen 은 안 되니 상황에 따라 macrolide 나 respiratory fluoroquinolone 을 함께 씁니다.", "focus": ["pneumo", "hflu", "morax", "atyp"], "marks": [{"tip": "CAP 의 target", "ids": ["pneumo"]}]}, {"t": "신우신염 · 요로패혈증 — target 은 E. coli, Klebsiella, Proteus. 지역사회획득이고 ESBL 위험이 낮으면 좋은 시작점입니다. 하지만 최근 입원, 반복한 항생제, 요양병원, 이전 ESBL, 도뇨관, 복잡성 요로감염이면 ceftriaxone 으로 부족할 수 있습니다.", "focus": ["c_entb", "c_resp"], "marks": [{"tip": "좋은 시작점", "ids": ["ecoli"]}, {"tip": "이전 ESBL · 도뇨관이면 부족", "ids": ["esbl"]}]}, {"t": "복강내 감염 — target 은 enteric gram negative. 그런데 혐기성균을 못 잡으니 metronidazole 을 같이 씁니다. 일부 경증이고 운이 좋으면 cephamycin 으로도 될 수 있습니다(32강).", "focus": ["ecoli", "kleb", "anaer"], "drug": ["cro", "mtz"], "marks": [{"tip": "metronidazole 을 같이", "ids": ["bfrag"]}]}, {"t": "수막염 — target 은 S. pneumoniae, H. influenzae, N. meningitidis. pneumococcus 중에는 ceftriaxone 감수성이 떨어지는 것이 있어 경험적 치료에는 vancomycin 을 붙입니다. 이때 vancomycin 은 MRSA 가 아니라 내성 pneumococcus 를 의식한 것입니다. Listeria 는 못 잡으니 고령자 · 임산부 · 면역저하자에서는 ampicillin 을 더합니다.", "focus": ["pneumo", "hflu", "mening", "listeria"], "marks": [{"tip": "내성 대비 — vancomycin", "ids": ["pneumo"]}, {"tip": "못 잡는다 — ampicillin 추가", "ids": ["listeria"]}]}, {"t": "임질 — gonococcus 에 잘 들어서 많이 씁니다. chlamydia 가 배제되지 않았으면 doxycycline 을 더합니다.", "focus": ["gono", "mening", "hflu"], "marks": [{"tip": "잘 듣는다 — 많이 쓴다", "ids": ["gono"]}]}, {"t": "그리고 「안 들으면 어떻게 할 것인가」를 미리 생각해 둡니다. 먼저 잡으려던 균이 무엇이었는지 정하고, 안 들으면 앞에서 본 구멍 쪽 가능성을 따집니다. 항생제 하나 쓰면서 따질 것이 참 많습니다 — 이 분야가 원래 그렇습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "fig": {"type": "hub", "title": "안 들으면 — 미리 물어 둘 것", "center": "ceftriaxone 이 안 듣는다면?|무엇을 놓쳤나", "items": ["혐기성균이 필요한 상황인가", "Enterococcus 가 필요한 상황인가", "Pseudomonas 위험이 있는가", "ESBL/AmpC 위험이 있는가", "source control 이 필요한 감염인가"]}}], "nums": [], "says": ["일단 내가 target으로 하는 균이 뭔지를 정리를 해야죠?", "항생제 하나쓰면서 참 따지고 생각할 것이 많죠?"], "vid": "KoDrZov2Dmw", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-35", "part": 0, "title": "cefotaxime 을 꼭 써야 하는 상황이 있을까", "line": "3세대의 쌍두마차 중 다른 하나, cefotaxime. 결론부터 「ceftriaxone과 별 차이가 없다」 — 다른 것은 반감기와 나가는 길입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "ctx", "more": [{"t": "스펙트럼은 ceftriaxone 과 같습니다. 1세대보다 gram negative 쪽으로 넓어져 E. coli · Klebsiella · Proteus 같은 장내세균, H. influenzae, Neisseria 를 커버하고, pneumococcus 커버가 살아 있어 폐렴 · 수막염에 중요합니다. 다만 MSSA 를 1세대보다 더 잘 잡지는 않습니다.", "focus": ["pneumo", "c_resp", "ecoli", "kleb", "proteus", "mssa"], "marks": [{"tip": "커버가 살아 있다", "ids": ["pneumo"]}, {"tip": "1세대보다 낫지 않다", "ids": ["mssa"]}]}, {"t": "가장 큰 차이는 반감기. cefotaxime 은 1시간이라 q6–8h 로 계속 줘야 합니다. ceftriaxone 은 2 g q24h 로 「빵! 하고 한번만」 주면 되니 편의성에서 밀렸습니다.", "focus": [], "fig": {"type": "pan", "title": "스펙트럼은 같고, 나가는 길이 다르다", "panels": [{"img": "책_35", "w": 520}]}}, {"t": "cefotaxime 의 굳이 꼽는 장점은 담즙 쪽 부담이 적다는 것. ceftriaxone 은 33–67% 가 소변, 나머지가 담즙으로 나가는데, 담즙 농도가 높아 calcium 과 침전을 만들 수 있습니다. sludge 나 stone 처럼 보여 pseudolithiasis 라 부릅니다. 대부분 증상이 없고 끊으면 좋아지지만, 쓰는 중에 RUQ pain · cholecystitis · cholangitis · pancreatitis 가 있으면 한 번 점검해 봅니다.", "focus": [], "fig": {"type": "flow", "title": "pseudolithiasis — ceftriaxone 이 담즙으로 나가서", "nodes": [{"t": "담즙 농도가 높다"}, {"t": "담즙의 calcium 과 결합", "sub": "침전물(precipitate)"}, {"t": "sludge · stone 처럼 보인다", "sub": "pseudolithiasis", "tone": "stop"}, {"t": "대부분 증상 없음", "sub": "약을 끊으면 좋아진다", "tone": "go"}], "arrows": ["", "", ""]}}, {"t": "ceftriaxone 을 calcium 이 든 수액과 동시에 넣으면 안 됩니다 — 침전이 생길 수 있습니다. 같은 line 으로 동시에, 또는 섞어서 넣는 것을 피하고, 순서대로(sequential) 넣는 것은 됩니다.", "focus": [], "fig": {"type": "cmp", "title": "ceftriaxone 과 수액", "vs": "vs", "cols": [{"h": "동시에 넣지 않는다", "tone": "stop", "pts": ["Hartmann solution · Hartmann-D", "Lactated Ringer's solution", "TPN 일부"]}, {"h": "문제없다", "tone": "go", "pts": ["Normal saline · half saline", "5%DW", "calcium 수액도 순서대로(sequential)는 된다"]}]}}, {"t": "간경화 SBP 에서 cefotaxime 을 많이 썼던 것은 오래전부터 이 약으로 연구가 많이 쌓였기 때문입니다. 지금은 SBP 에도 ceftriaxone 을 씁니다. 성인 내과에서 cefotaxime 을 반드시 써야 하는 경우는 드뭅니다.", "focus": [], "fig": {"type": "hub", "title": "cefotaxime 을 떠올려 볼 때", "center": "cefotaxime|ceftriaxone 이 찜찜할 때", "items": ["담즙 쪽이 좀 찝찝할 때", "calcium 이 든 수액이 계속 들어가야 할 때", "SBP — 데이터가 많이 쌓인 약(지금은 ceftriaxone 도 된다)"]}}], "nums": ["cefotaxime 반감기 1시간 → q6–8h", "ceftriaxone 2 g q24h", "ceftriaxone 33–67% 가 소변, 나머지가 담즙"], "says": ["그래서 이런 편의성 면에서 cefotaxime이 ceftriaxone한테 좀 밀렸다...", "현실적으로 성인 내과진료에서 cefotaxime을 반드시 써야만 하는 상황은 드물다"], "vid": "OEQJsnbaWkw", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-36", "part": 0, "title": "녹농균에 듣는 cephalosporin — ceftazidime · cefepime", "line": "남은 cephalosporin 둘, 3세대 ceftazidime 과 4세대 cefepime 은 공교롭게 둘 다 pseudomonas 에 듣습니다. 녹농균은 컨디션이 안 좋은 사람이 균이 득실거리는 환경에 있을 때 걸리니, 헛발질 없이 정확한 약을 써야 합니다.", "focus": ["c_nonf", "pseudo"], "drug": "caz", "more": [{"t": "ceftazidime 은 pseudomonas 에 활성이 있는 대신 gram positive 에 약합니다. 그래서 일반 폐렴에 녹농균까지 덮고 싶다고 ceftriaxone 대신 ceftazidime 하나로 가면 「완전 nonsense」 가 됩니다 — gram (+) 를 표준적으로, 안정적으로 잡지 못하기 때문입니다.", "focus": ["pseudo", "pneumo", "gas", "mssa"], "drug": "caz", "marks": [{"tip": "듣는다", "ids": ["pseudo"]}, {"tip": "약하다 — 폐렴에 단독은 ✗", "ids": ["pneumo"]}]}, {"t": "cefepime 도 pseudomonas 에 듣는데, ceftazidime 과 달리 Staphylococcus · Streptococcus 에도 효과가 있습니다. 그럼 고민 없이 cefepime 만 쓰면 되지 않나 싶지만, 그렇게 말할 수 없는 이유가 있습니다.", "focus": ["c_strep", "c_staph", "c_listeria", "c_entero"], "drug": ["caz", "fep"], "marks": [{"tip": "cefepime 은 듣는다", "ids": ["mssa"]}]}, {"t": "ceftazidime 을 쓰는 이유 둘. ① 녹농균인 걸 알면 걔만 잡으면 되니, gram (+) 를 덮을 필요가 없을 때 굳이 넓게 갈 필요가 없습니다(장내미생물에 덜하다는 data 는 없어서 큰 장점은 아닙니다). ② cefepime 은 신기능이 나쁠 때 cefepime 뇌증을 일으킬 수 있어, CNS 기저질환이나 CNS infection 에는 수막을 잘 통과하는 ceftazidime 을 씁니다. 다만 이것도 좀 과장되어 있고, ceftazidime 도 신기능이 떨어지면 neurotoxicity 가 생길 수 있습니다.", "focus": [], "fig": {"type": "pan", "title": "ceftazidime 과 cefepime", "panels": [{"img": "책_36", "w": 520}]}}, {"t": "그리고 감수성 결과. 「pseudomonas라고 해서 다 같은 pseudomonas가 아니야」 — 어떤 균주는 cefepime 에, 어떤 균주는 ceftazidime 에 더 잘 듣습니다. 녹농균의 내성은 AmpC 의 변화, efflux pump, 막 투과성 변화, PBP 가 함께 작동해서 생기기 때문입니다. 더 잘 듣는 약이 나오면 그걸 씁니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["caz", "fep"], "marks": [{"tip": "균주마다 잘 듣는 약이 다르다", "ids": ["pseudo"]}]}, {"t": "둘 다 ESBL 이 등장하면 어렵습니다 — 「얘네들도 어쩔수 없는 cepha일 뿐」. AmpC 쪽은 cefepime 이 낫습니다. AmpC 유도가 약하고 AmpC 가수분해에도 상대적으로 안정하기 때문입니다. Listeria 나 Enterococcus 에는 둘 다 효과가 거의 없습니다.", "focus": ["esbl", "ampc", "pseudo", "efaecalis", "listeria"], "drug": ["caz", "fep"], "marks": [{"tip": "둘 다 어렵다", "ids": ["esbl"]}, {"tip": "cefepime 이 낫다", "ids": ["ampc"]}]}], "nums": [], "says": ["그래서 이럴 때야말로 헛발질 없이, 정확하게 필요한 약을 쓰는 것이 중요하겠죠.", "우리가 인간이라고 해서 다 똑같은 인간이 아니잖아."], "vid": "o4OARdcvRdA", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-37", "part": 0, "title": "녹농균을 겨냥할 때 두 가지를 써야 하나", "line": "녹농균은 내성을 여러 방식으로 만들고, 버티지 못하는 환자에게 생깁니다. 그래서 하나만 쓰기 불안해 두 가지를 쓰자는 이야기가 있지만 — 녹농균을 겨냥한다고 늘 2제를 쓰는 것은 아닙니다.", "focus": ["c_nonf", "pseudo"], "drug": "fep", "more": [{"t": "2제는 중증이거나 내성이 우려될 때 씁니다. 배양 결과를 모르는데 septic shock 이 왔거나, HAP 에 SpO2 가 떨어지고 ventilator 를 달았거나. 또는 최근 광범위 항생제를 썼거나, 전에 나온 녹농균의 감수성 profile 이 나빴거나. 중증이 아니고, 내성 위험이 낮고, 감수성도 괜찮으면 1제로 됩니다.", "focus": [], "fig": {"type": "cmp", "title": "2제를 쓰는 때 · 1제로 되는 때", "vs": "vs", "cols": [{"h": "2제", "tone": "stop", "pts": ["배양 전인데 septic shock", "HAP · ventilator · SpO2 저하", "최근 광범위 항생제", "전에 나온 녹농균의 감수성이 나쁨"]}, {"h": "1제도 가능", "tone": "go", "pts": ["중증도가 높지 않다", "내성 위험이 낮다", "감수성도 괜찮다"]}]}}, {"t": "2제는 beta-lactam 하나 + 다른 하나. 예를 들면 cefepime 이나 piperacillin/tazobactam 에 amikacin · tobramycin 같은 AG, 또는 FQ 를 붙입니다. FQ 중에서는 ciprofloxacin · levofloxacin 이고, moxifloxacin 은 anti-pseudomonal 로 치지 않습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": ["fep", "cip"], "marks": [{"tip": "beta-lactam + FQ — 둘 다", "ids": ["pseudo"]}]}, {"t": "이런 약을 쓰는 종합병원에는 대개 감염내과가 있고, 그 병원에서 최근 분리된 pseudomonas 의 감수성 data(병원 antibiogram)를 가지고 있습니다. 환자의 배양 결과가 나오기 전이라도 경험적 항생제의 적중률을 올릴 수 있습니다.", "focus": [], "fig": {"type": "tbl", "title": "병원 antibiogram 의 예 — 최근 분리된 pseudomonas", "head": ["약", "감수성률"], "rows": [["cefepime", "85%"], ["piperacillin/tazobactam", "78%"], ["meropenem", "70%"]]}}, {"t": "2제의 가장 중요한 목적은 내성 발생을 막기보다 「첫 번째 약이 이미 내성일 가능성에 대비하여 적어도 하나는 듣게」 하는 것입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "적어도 하나는 듣게", "ids": ["pseudo"]}]}, {"t": "감수성 결과에서 beta-lactam 활성이 확인되면, 병합치료가 단독치료보다 나은 것은 입증되지 않았습니다. AG 는 신독성 · 이독성, FQ 는 QT 연장 · C. difficile · tendon · 신경계 부작용이 따라다니니 안 쓸 수 있으면 안 씁니다. 중증일 때 2제로 시작해 감수성이 확인되면 1제로 de-escalation 하는 것이 바람직한 흐름입니다.", "focus": [], "fig": {"type": "pan", "title": "적어도 하나는 듣게 — 그리고 하나로", "panels": [{"img": "책_37", "w": 520}]}}], "nums": ["antibiogram 예: cefepime 85% · piperacillin/tazobactam 78% · meropenem 70%"], "says": ["그런데 이렇게 녹농균을 겨냥한다고 해서 항상 2제를 쓰는 것은 아닙니다.", "뭔가 불안해서 aminoglycoside나 FQ를 계속 추가해서 쓰고 싶은것이 인지상정인데,"], "vid": "hxXIYVgNhLc", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-38", "part": 0, "title": "녹농균 coverage 를 생각해야 하는 상황", "line": "pseudomonas 는 「기회감염의 원인균이고 동시에 원내감염의 원인균이다!」 — 그리고 물을 좋아합니다. 이 셋을 깔고 생각하면 언제 녹농균을 덮어야 하는지가 자연스럽게 떠오릅니다.", "focus": ["c_nonf", "pseudo"], "drug": null, "more": [{"t": "면역저하 환자, 장기입원 환자(요양원에 오래 계신 분도), ICU 환자에서 주로 만납니다. 특히 피부라는 물리적 장벽이 무너진 분 — 크게 다쳤거나 화상, 수술 — 에서는 상처 표면에 정착해 있다가 조직 안으로 들어갈 수 있습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "기회감염 · 원내감염", "ids": ["pseudo"]}]}, {"t": "녹농균은 물과 습한 환경에서 잘 삽니다. 병동 · 중환자실은 수도 배관 · 세면대 · 배수구가 곳곳에 있는 「온통 물」 입니다. 거기서 ventilator 는 상기도 방어를 우회하고, foley 는 요로로 가는 통로가 되고, central catheter 에는 biofilm 이 생깁니다.", "focus": [], "fig": {"type": "pan", "title": "물이 많은 곳 + 몸 안으로 열린 통로", "panels": [{"img": "책_38", "w": 520}]}}, {"t": "처음부터 덮어야 하는 셋. ① HAP · VAP. ② 항암치료 중 발열과 호중구감소증이 있는 고위험군 — 지킬 군대가 없어 빠르게 악화하니 cefepime · tazocin · meropenem 같은 anti-pseudomonal agent 를 초기부터. ③ 수술 후 · ventricular drain · shunt 에 생긴 CNS infection — vanco + ceftazidime 또는 vanco + meropenem.", "focus": ["c_nonf"], "drug": "fep", "fig": {"type": "hub", "title": "처음부터 pseudomonas 를 cover", "center": "기본으로 cover|anti-pseudomonal agent", "items": ["HAP · VAP", "고위험 호중구감소성 발열", "수술 후 · drain · shunt 의 CNS infection"]}}, {"t": "경우에 따라 적극 고려하는 것도 있습니다. 위험인자가 있는 CAP(과거 pseudomonas, 최근 90일 입원 · 항생제에 중증), 기관지확장증 폐렴(손상된 기도에 만성으로 정착), 위험인자가 있는 복잡성 요로감염 · UTI sepsis, 최근 어디선가 내성 녹농균이 나온 중증 감염. 다 외우라는 것이 아니라, 기회감염 · 원내감염 · 물 좋아함을 깔고 차근차근 생각하면 떠오릅니다.", "focus": ["pseudo"], "drug": null, "fig": {"type": "hub", "title": "경우에 따라 cover 를 고려", "center": "위험인자가 있으면|과거 배양 · 최근 항생제 · 기구", "items": ["CAP + 녹농균 위험인자", "기관지확장증에서 온 폐렴", "복잡성 UTI · UTI sepsis", "중증인데 최근 내성 녹농균이 나왔던 분"]}}], "nums": ["CAP 녹농균 위험 — 최근 90일 안 입원 · 항생제"], "says": ["기회감염의 원인균이고 동시에 원내감염의 원인균이다!", "그래서 제가 지금 말씀드린 걸 다 외우라는 게 아닙니다. 외울 수도 없고요.."], "vid": "0Bvs2e2ZWmg", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-39", "part": 0, "title": "기를 쓰고 녹농균을 잡으려 하는 이유", "line": "녹농균이 나왔다고 늘 위독한 것은 아닙니다. 정말 긴장해야 하는 것은 취약한 환자에게 생긴 침습성 녹농균 감염 — 수 시간 단위로 혈압이 떨어지고 장기가 무너질 수 있습니다.", "focus": ["c_nonf", "pseudo"], "drug": null, "more": [{"t": "녹농균성 모낭염, 단순 외이도염처럼 가볍게 지나가는 감염도 있고, 기관지확장증 환자의 객담이나 오래 쓴 의료기구에서 조직 침범 없이 집락화만 된 경우도 있습니다. 이름만 보고 호들갑 떨 일은 아닙니다. 그러나 취약한 환자의 침습성 감염은 폐렴 · 균혈증 · 패혈성 쇼크로 빠르게 갑니다. 녹농균 균혈증은 한 연구에서 14일 사망률 15%, 30일 22% 였습니다.", "focus": [], "fig": {"type": "cmp", "title": "녹농균이 나왔을 때", "vs": "vs", "cols": [{"h": "호들갑 떨 일은 아니다", "tone": "go", "pts": ["녹농균성 모낭염 · 단순 외이도염", "기관지확장증 객담 · 오래 쓴 기구의 집락화"]}, {"h": "정말 긴장해야 한다", "tone": "stop", "pts": ["취약한 환자의 침습성 감염", "폐렴 · 균혈증 · 패혈성 쇼크로 수 시간 단위", "균혈증 14일 사망률 15% · 30일 22%(한 연구)"]}]}}, {"t": "왜 이렇게 위험한가 — 세 가지가 한꺼번에 겹치기 때문입니다. 첫째, 공격받는 환자가 원래 약합니다. 호중구감소 · 항암치료 · 면역억제제 · 화상 · 수술창 · ICU 기구 · 장기 기능 저하. 이미 지쳐 있고 방어선도 무너져 「싸울 군대도 부족한 상태」 에서 녹농균이 들어옵니다.", "focus": [], "fig": {"type": "pan", "title": "세 가지가 겹치면 회복할 시간이 없다", "panels": [{"img": "책_39", "w": 520}]}}, {"t": "둘째, 가만히 붙어 있는 균이 아닙니다. 독성인자와 효소로 상피장벽과 조직을 손상시키고 면역반응을 방해합니다. 일부는 type III secretion system 으로 독성 단백질을 숙주세포 안에 직접 주입합니다. 호중구감소 환자의 균혈증에서는 작은 홍반 · 수포가 하루 사이에 검은 괴사성 궤양이 되는 ecthyma gangrenosum 이 나타나기도 합니다.", "focus": [], "fig": "keep"}, {"t": "셋째가 더 큰 문제 — 처음 고른 약이 빗나갈 가능성이 높습니다. ceftriaxone, cefotaxime, 일반적인 경구 cephalosporin, amoxicillin-clavulanate 로는 녹농균이 기본적으로 치료되지 않습니다. 게다가 외막 투과성이 낮고, efflux pump 가 있고, AmpC 를 발현하고, porin 을 바꾸거나 잃습니다. 적절한 항생제가 이틀쯤 늦으면 30일 사망 위험이 유의하게 높아졌습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "cro", "marks": [{"tip": "흔히 쓰는 약은 안 듣는다", "ids": ["pseudo"]}]}, {"t": "그렇다고 가장 센 약을 여러 개, 오래 쓰자는 말이 아니라 정반대 — 초기에 제대로 하자는 것입니다. 배양은 하되 septic shock 이면 기다리느라 늦추지 않고, 중증도 · 과거 배양 · 최근 항생제 · 병원 antibiogram 으로 녹농균에 들 가능성이 높은 약을 고릅니다. 감염된 central catheter, 막힌 요로, 농양 · 괴사조직은 source control 을 합니다. 결과가 나오면 불필요한 약을 줄입니다.", "focus": ["pseudo"], "drug": null, "fig": {"type": "flow", "title": "녹농균이 의심되는 고위험 상황 — 초기에 제대로", "nodes": [{"t": "배양 먼저", "sub": "shock 이면 기다리지 않는다"}, {"t": "들을 가능성이 높은 약", "sub": "과거 배양 · 최근 항생제 · antibiogram", "tone": "go"}, {"t": "source control", "sub": "catheter 제거 · 요로 배액 · 농양"}, {"t": "결과 보고 줄이기", "sub": "감수성이 확인된 약으로", "tone": "go"}], "arrows": ["", "", ""]}}], "nums": ["녹농균 균혈증 14일 사망률 15% · 30일 22%(한 연구)", "적절한 항생제가 약 이틀 늦으면 30일 사망 위험이 유의하게 ↑"], "says": ["딱 긴장타고, 자세를 바로 하고, 눈을 부릅뜨고 전력을 다해서 상대해야 하는 녀석이라는 겁니다.", "그렇다고 무조건 가장 강한 항생제를 여러 개, 오래 사용하자는 이야기는 아닙니다."], "vid": "ViJFWdXwqP0", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-40", "part": 0, "title": "대부분의 항생제가 듣지 않는 녹농균 — MDRP", "line": "녹농균에 그나마 활성이 기대되는 약들이 있습니다. 그 약들조차 안 듣는 녹농균이 MDRP 입니다. 가장 중요한 것은 센 약이 아니라, 정말 치료할 감염인지 가리고 남은 약을 현명하게 쓰는 것입니다.", "focus": ["c_nonf", "mdrp"], "drug": null, "more": [{"t": "녹농균에 활성이 기대되는 약 — antipseudomonal penicillin piperacillin/tazobactam, antipseudomonal cepha ceftazidime · cefepime, 앞으로 나올 carbapenem imipenem · meropenem, FQ ciprofloxacin · levofloxacin, AG amikacin · tobramycin.", "focus": ["pseudo", "mdrp"], "fig": {"type": "hub", "title": "녹농균에 활성이 기대되는 약", "center": "녹농균|그나마 듣는 약", "items": ["piperacillin/tazobactam", "ceftazidime · cefepime", "imipenem · meropenem", "ciprofloxacin · levofloxacin", "amikacin · tobramycin"]}}, {"t": "이 주요 계열 가운데 3가지 이상에서 각각 적어도 한 약에 내성이면 다제내성(MDR). 그리고 DTR(difficult-to-treat) 은 「진짜 답이 없는 경우」 — 이 8가지에 전부 감수성이 없는 것입니다.", "focus": ["mdrp"], "marks": [{"tip": "3계열 이상에 내성", "ids": ["mdrp"]}], "fig": {"type": "hub", "title": "DTR — 이 8가지에 전부 감수성 없음", "center": "DTR|difficult-to-treat", "items": ["piperacillin-tazobactam", "ceftazidime", "cefepime", "aztreonam", "meropenem", "imipenem-cilastatin", "ciprofloxacin", "levofloxacin"]}}, {"t": "내성의 이유는 복합적입니다(16강). ① 외막 투과성 감소 — 애초에 못 들어온다. ② AmpC 증가 — 분해한다. ③ efflux pump 증가 — 들어온 놈을 다시 내보낸다, 「너 뭐야 꺼져」. ④ 표적 변이 — PBP 가 살짝 바뀐다. ⑤ biofilm — 끈적한 막 안에 모여 살며 항생제를 막는다.", "focus": [], "fig": {"type": "flow", "title": "녹농균이 항생제를 막는 다섯 가지", "nodes": [{"t": "외막 투과성 ↓", "sub": "못 들어온다"}, {"t": "AmpC ↑", "sub": "분해한다"}, {"t": "efflux pump ↑", "sub": "다시 내보낸다"}, {"t": "표적 변이", "sub": "PBP 가 바뀐다"}, {"t": "biofilm", "sub": "막으로 차단", "tone": "stop"}], "arrows": ["", "", "", ""]}}, {"t": "고위험군은 38강의 연장선 — 과거 녹농균 · MDR 녹농균이 나온 분, 광범위 항생제를 반복한 분, 장기입원 · ICU · 요양병원에 튜브가 꽂힌 분, 구조적 폐질환 · 만성 상처 · 면역저하. 그런데 배양됐다고 다 치료하지는 않습니다. tracheostomy 로 suction 하는 ICU 환자에서는 원래 잘 사는 균이니, 열 · 가래 증가 · 산소요구량 증가 · 새 infiltration 처럼 임상양상이 맞을 때 치료를 생각합니다.", "focus": ["mdrp"], "marks": [{"tip": "배양됐다고 다 치료하지 않는다", "ids": ["mdrp"]}]}, {"t": "치료는 전문영역이라 감염내과에 맡기는 것이 좋습니다. 원칙만 — 기존 beta-lactam 중 살아 있는 약(타조신 · cefepime · ceftazidime)이 있으면 그걸 쓰고, meropenem 도 살아 있으면 beta-lactam 을 먼저, carbapenem 은 나중을 위해 아낍니다. 중증이면 고용량을 3시간 이상 연장 주입합니다 — beta-lactam 은 시간을 타는(time-dependent) 약이라서입니다.", "focus": ["mdrp", "pseudo"], "drug": "fep", "marks": [{"tip": "살아 있으면 그걸 쓴다", "ids": ["mdrp"]}], "fig": {"type": "pan", "title": "MDR 녹농균 — 고르는 순서", "panels": [{"img": "책_40", "w": 520}]}}, {"t": "DTR 이면 신형 beta-lactam 에 감수성을 확인한 뒤 고려합니다 — ceftolozane-tazobactam, ceftazidime-avibactam, imipenem-cilastatin-relebactam, 그리고 결이 좀 다른 cefiderocol. 비싸고, 감염내과와 상의해 고르는 약입니다. 녹농균은 치료 중에 새 내성을 빨리 얻으니, 반응이 없거나 재발해 다시 나오면 예전 결과를 믿지 말고 감수성을 새로 봅니다.", "focus": ["mdrp"], "drug": "cza", "marks": [{"tip": "DTR — 감수성 확인 뒤", "ids": ["mdrp"]}]}], "nums": ["MDR — 주요 계열 3가지 이상에서 내성", "DTR — 8가지 약 전부 감수성 없음", "중증 예: cefepime 2 g q8h, 한 번에 3시간 이상(정상 신기능 기준)"], "says": ["이렇게 녹농균 치료에 사용되는 주요 항생제 계열 중 3가지 이상의 계열에서 각각 적어도 한 약제에 내성을 보이는 경우,", "결국 MDR 녹농균에서 가장 중요한 것은 무조건 강한 항생제를 쓰는 것이 아니라, 정말 치료가 필요한 감염인지 판단하고, 남아 있는 항생제를 가장 현명하게 사용하는 거라고 할 수 있겠습니다."], "vid": "l58dDHfSufU", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-41", "part": 0, "title": "cephalosporin 을 널리 쓰면서 생긴 문제들", "line": "cephalosporin 은 적당히 넓게 흔한 균을 잡고 부작용 부담이 적어, 전 세계 의사들이 엄청나게 많이 썼습니다. 그러자 문제가 생겼습니다 — 내성, C. difficile, 그리고 빈자리를 채우는 균.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "cro", "more": [{"t": "첫째, 내성. 균이 이 약을 분해하는 효소를 만들었습니다 — ESBL(extended spectrum beta-lactamase, 25–26강). ESBL 은 ceftriaxone, cefotaxime, ceftazidime 을 가리지 않고 대부분의 전통적인 cephalosporin 을 잘라 버립니다.", "focus": ["esbl", "ecoli", "kleb"], "marks": [{"tip": "cepha 를 가리지 않고 자른다", "ids": ["esbl"]}]}, {"t": "그러면 ESBL 에 듣는 carbapenem 을 쓰면 되지 않나? 그러면 carbapenem 을 또 많이 쓰게 되고, 결국 carbapenem 에 내성인 균이 나옵니다. CRE(carbapenem-resistant Enterobacteriaceae) 는 따지고 보면 cephalosporin 을 널리 쓴 끝에 나온 것이라 해도 크게 틀리지 않습니다.", "focus": ["esbl", "cre"], "drug": null, "marks": [{"tip": "cepha 를 널리 쓴 끝", "ids": ["cre"]}], "fig": {"type": "pan", "title": "많이 쓴 약이 다음 내성을 부른다", "panels": [{"img": "책_41", "w": 520}]}}, {"t": "둘째, C. difficile. 넓게 때리다 보니 평화롭게 살던 장내세균도 무자비하게 없앱니다. 정상 장내세균총은 서로 견제하며 한 녀석이 과도하게 자리 잡는 것을 막는데, 그걸 못 하니 C. difficile 이 「이 때다.!!」 하며 증식하고 독소를 만들어 설사 · 위막성 대장염을 일으킵니다. 3 · 4세대가 위험이 높고, clindamycin 못지않습니다. fluoroquinolone · carbapenem 도 위험을 높입니다.", "focus": ["cdiff", "bfrag", "oral_ana"], "drug": null, "marks": [{"tip": "견제가 사라진 장에서 증식", "ids": ["cdiff"]}]}, {"t": "셋째, 빈자리를 채우는 녀석들. cephalosporin 은 Enterococcus 에 본질적으로 효과가 별로 없습니다(5강). 다른 균이 사라진 자리에서 Enterococcus 가 늘고, 오래 노출되면 VRE colonization · infection 과 연관됩니다 — VRE 를 만드는 게 아니라 경쟁균을 치워 자리를 내주는 것입니다. 같은 이유로 candida 도 과증식할 수 있어 면역저하자에서 문제가 됩니다.", "focus": ["gpos"], "drug": "cro", "marks": [{"tip": "본질적으로 안 듣는다", "ids": ["efaecalis"]}, {"tip": "경쟁균이 사라진 자리에", "ids": ["vre"]}]}], "nums": [], "says": ["그런데 저만 많이 쓰나?", "이건 얘가 VRE를 만드는 게 아니라, 경쟁균을 제거해서 VRE가 자리 잡기 좋은 환경을 만들어주기 때문으로 보시면 됩니다."], "vid": "3lv57TTM8nU", "open": true, "open_date": "", "tier": "니은 회원"}], "board": "균지도", "part_no": 4, "parts": [{"ko": "3세대 세파 및 녹농균에 대한 이야기", "sub": "ANTI-33 ~ 41"}], "course": "기역 항생제 4 · 3세대 세파 및 녹농균에 대한 이야기", "intro": "ANTI-33 ~ 41 를 균 지도 위에서 차례로 내려 읽습니다. 대목마다 지금 이야기하는 약이 듣는 균을 칠합니다.", "legend": ["<b>균 지도</b> 왼쪽이 그람양성, 오른쪽이 그람음성. 위가 기본이고 아래로 내려갈수록 내성을 얻은 균입니다", "<b>파랗게 칠해진 칸</b> 지금 이야기하는 약이 듣는 균 — 점선은 일부 · 약하게, 빗금은 안 듣는다. 두 약을 견줄 때는 파랑 · 주황 · 반반", "<b>자홍 화살표와 말풍선</b> 지금 읽는 대목이 가리키는 자리", "<b>파란 테</b> 판에 못 담는 것을 따로 보여 주는 그림 · 표"], "end": "<b>Part 4 「3세대 세파 및 녹농균에 대한 이야기」 끝.</b> <a href=\"index.html\">차례로 돌아가기</a>"}, "img": {"책_35": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIh   bugEls.forEach(g => { const r = g.querySelector('rect.bx').getBBox(); g.querySelectorAll('text').forEach(t => { const b = t.getBBox(); if (b.x < r.x - 1 || b.x + b.width > r.x + r.width + 1) res.over.push('균 칸 ' + t.textContent); }); });
  ['key', 'leg'].forEach(id => { const e = document.getElementById(id); if (e.scrollWidth > e.clientWidth + 1) res.over.push(id); });
  steps.forEach((st, i) => { cur = -2; light(i);
    { const t = st.focus === '*' ? FULL : box(new Set(st.focus)), V = [t[0], t[1], t[0] + t[2], t[1] + t[3]], L = st.focus === '*' ? null : box.lit;   // 비추는 칸이 화면 밖으로 잘리면
      if (L && (L[0] < V[0] - 1 || L[1] < V[1] - 1 || L[2] > V[2] + 1 || L[3] > V[3] + 1 || (svg.querySelector('path.veil') || {style: {}}).style.opacity !== '1')) res.cut.push(i);   // 칸이 잘리거나 가림막이 없으면
      if (!L && st.focus !== '*' && BD[curB].cards.some(c => cut(V, c) > 0 && cut(V, c) < (c[2] - c[0]) * (c[3] - c[1]) - 1)) res.cut.push(i); }
    if (!f.classList.contains('show')) return;
    const k = f.style.transform ? parseFloat(f.style.transform.slice(6)) : 1, t = parseFloat(f.style.top), l = parseFloat(f.style.left);
    if (t < -1 || l < -1 || t + f.offsetHeight * k > H + 1 || l + f.offsetWidth * k > W + 1) res.fig.push(i);
    f.querySelectorAll('.col, .fn, .hc, .hi span, td, th, .tm, .sw, figure, h4, .cap, .vs, .lb').forEach(el => {   // 글자가 상자를 벗어나는가(11-22)
      const r = el.getBoundingClientRect(); let over = el.scrollWidth > el.clientWidth + 1;
      el.querySelectorAll('*').forEach(c => { const q = c.getBoundingClientRect(); if (q.width && (q.right > r.right + 1 || q.left < r.left - 1)) over = true; });
      if (over) res.over.push(i + ' ' + el.textContent.trim().slice(0, 30)); });       // 카드가 판 밖으로
  });
  const pre = document.createElement('pre'); pre.id = 'check'; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
}
