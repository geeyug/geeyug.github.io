nt-size=\"17\" font-weight=\"800\">\n<path d=\"M 229 94 L 360 52\" stroke=\"#3f7465\" stroke-width=\"2\"/><text x=\"366\" y=\"57\" fill=\"#3f7465\">곰팡이 (Penicillium)</text>\n<path d=\"M 273 140 L 360 128\" stroke=\"#2f7d32\" stroke-width=\"2\"/><text x=\"366\" y=\"133\" fill=\"#25642a\">둘레만 맑게 비어 있음</text>\n<path d=\"M 130 230 L 360 214\" stroke=\"#b07a12\" stroke-width=\"2\"/><text x=\"366\" y=\"219\" fill=\"#8a5a0e\">포도상구균이 자란 자리</text>\n</g>\n<text x=\"366\" y=\"272\" font-size=\"16\" fill=\"#4c473f\">「이 곰팡이가 무언가를 내뿜어</text><text x=\"366\" y=\"296\" font-size=\"16\" fill=\"#4c473f\">세균의 성장을 막고 있구나.」</text>\n</svg>", "cap": "대부분은 버렸을 「망한 실험」 — 플레밍은 오염이 아니라 의미를 읽었습니다"}}, {"t": "그런데 그보다 훨씬 앞서 비슷한 것을 본 사람들이 있습니다. 1877년 파스퇴르와 주베르는 탄저균을 키우다 다른 미생물이 섞이면 탄저균이 덜 자란다는 것을 보았고, 1897년 뒤셴은 곰팡이가 장티푸스에 걸린 기니피그에 치료 효과가 있다는 논문을 냈습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "fig": {"type": "pan", "title": "현상을 봄 → 치료를 시도 → 물질로 붙잡아 이름 붙임", "panels": [{"img": "책_01", "w": 520}]}}, {"t": "셋을 견주면 — 파스퇴르 · 주베르는 현상 발견, 뒤셴은 치료 가능성 탐색, 플레밍은 특정 항균 물질로 개념화하고 이름을 붙인 사람입니다. 「곰팡이가 억제한다.. 가 아니라 곰팡이가 분비하는 물질이 억제한다는 것은 큰 차이입니다.」", "focus": [], "fig": "keep"}, {"t": "왜 큰 차이일까요. 「곰팡이가 있더니 세균이 안 자란다」는 아직 현상이라, 영양분을 빼앗았을 수도 있고 배지를 바꿨을 수도 있습니다. 「곰팡이가 여과 가능한 항균성 물질을 분비한다」고 말하는 순간 잡을 수 있는 물질이 생기고, 그때부터 분리하고 · 역가를 재고 · 어떤 균에 듣는지 보고 · 독성을 시험하는 길이 열립니다. 항생제 개발이 여기서 시작합니다.", "focus": [], "fig": {"type": "flow", "title": "현상에서 물질로", "nodes": [{"t": "현상", "sub": "곰팡이 둘레에 균이 안 자란다"}, {"t": "물질", "sub": "곰팡이가 내뿜는 penicillin", "tone": "go"}, {"t": "시험의 길", "sub": "분리 · 역가 · 어떤 균에 듣나 · 독성"}], "arrows": ["이름 붙임", "열린다"]}}, {"t": "플레밍이 이름 붙인 penicillin 을 훗날 플로리와 체인이 정제해 임상에 쓰고 대량생산까지 이어 갔습니다. 그래서 1945년 노벨상은 셋이 함께 받았습니다. 플레밍은 발견의 문을 연 사람, 플로리 · 체인은 그것을 실제 약으로 만든 사람입니다. 발견에서 중요한 것은 아이디어를 붙잡고 끝까지 물고 늘어지는 끈질김이 아닐까 합니다.", "focus": [], "fig": {"type": "flow", "title": "발견의 문에서 실제 약까지", "nodes": [{"t": "플레밍", "sub": "1929 논문 · penicillin 이름"}, {"t": "플로리 · 체인", "sub": "정제 · 임상 · 대량생산"}, {"t": "1945 노벨상", "sub": "셋이 함께", "tone": "go"}], "arrows": ["", ""]}}], "nums": [], "says": ["과학의 발견에 있어서 중요한 것은 아이디어를 붙잡고 끝까지 물어지는 능력.. 끈질김.. 이 아닐까 싶습니다.", "쉽게 말해, 현상을 본 단계였습니다."], "vid": "DzmgpADWtPg", "open": true, "open_date": "", "tier": ""}, {"n": "ANTI-02", "part": 0, "title": "이 penicillin 과 저 penicillin 은 어떻게 다른가", "line": "penicillin 은 β-lactam 계 항생제입니다. 종류가 많아 헷갈리지만 아무렇게나 늘어난 것이 아니라, 「새 penicillin은 대개 기존 penicillin의 약점을 보완하려고 나온다.」", "focus": ["gpos", "gneg", "anaer", "etc"], "more": [{"t": "β-lactam 고리는 탄소 셋 · 질소 하나의 사각형 고리로, 이 자리가 살균 효과를 냅니다. penicillin 말고도 cephalosporin · carbapenem · monobactam 이 이 고리를 가진 같은 계열입니다. 고리 여기저기 달린 side chain 이 어느 균에 들을지, 곧 스펙트럼을 정합니다.", "drug": null, "fig": {"type": "pan", "title": "β-lactam 고리와 side chain", "panels": [{"img": "책_02", "w": 520}]}, "focus": []}, {"t": "가장 기본은 penicillin G · V 입니다. streptococci, 매독균 Treponema pallidum, 일부 구강 혐기성균처럼 「이 균이면 잘 듣겠다」 싶은 균에 강한, 좁지만 고전적인 약입니다. 그러나 staphylococci 가 만드는 penicillinase 에 쉽게 깨지고, 많은 그람음성균에는 효과를 기대하기 어렵습니다.", "drug": "pcng", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "매독균에 좋은 활성", "ids": ["trepo"]}, {"tip": "penicillinase 에 깨진다", "ids": ["mssa"]}]}, {"t": "그래서 나온 것이 nafcillin · oxacillin 같은 anti-staphylococcal penicillin 입니다. β-lactam 고리 둘레에 부피 큰 side chain 을 달아 penicillinase 가 고리에 접근하기 어렵게 했습니다(steric hindrance). 「손을 뻗어서.. 오지마.. 오지마.. 하는 거죠.」 그 대가로 스펙트럼은 좁아서, MSSA 에는 강하지만 그람음성균까지 넓게 덮지는 못합니다.", "drug": "naf", "focus": ["gpos"], "marks": [{"tip": "큰 곁사슬로 효소를 막는다", "ids": ["mssa"]}]}, {"t": "이 약으로도 안 되는 것이 MRSA 입니다. 효소 때문이 아니라, mecA 가 만드는 PBP2a 라는 β-lactam 이 잘 못 붙는 표적을 쓰기 때문입니다. MSSA 의 문제는 효소, MRSA 의 문제는 표적입니다. MRSA 의 M 은 methicillin — 심한 간질성 신염 때문에 지금은 쓰지 않고 이름만 남았습니다.", "drug": "naf", "focus": ["gpos"], "marks": [{"tip": "표적이 PBP2a 로 바뀌었다", "ids": ["mrsa"]}]}, {"t": "ampicillin · amoxicillin(aminopenicillin)은 그람음성 쪽으로 조금 넓힌 약입니다. side chain 의 amino group 이 약을 더 친수성으로 만들어 그람음성균 외막의 porin 을 잘 지나갑니다. 대신 bulky side chain 이 없어 penicillinase 에 잘 깨지니 S. aureus 에는 기대하기 어렵습니다. 넓다고 더 좋은 약이 아닙니다 — 「딱 맞는 약을 딱 맞는 균에 써야 되는 거예요.」", "drug": "amp", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "porin 으로 더 잘 들어간다", "ids": ["ecoli"]}, {"tip": "penicillinase 에 잘 깨진다", "ids": ["mssa"]}]}, {"t": "piperacillin 은 Pseudomonas 까지 덮으려는 penicillin 입니다(ureidopenicillin). 대신 staphylococcus 에는 항균력이 없고, Streptococcus · Enterococcus 에는 듣지만 penicillin · ampicillin 보다 약합니다.", "drug": "pip", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "Pseudomonas 까지 덮는다", "ids": ["pseudo"]}], "fig": {"type": "pan", "title": "side chain 이 바뀌며 그람음성 쪽으로", "panels": [{"img": "책_21", "w": 520}]}}], "nums": [], "says": ["새 penicillin은 대개 기존 penicillin의 약점을 보완하려고 나온다.", "즉 MSSA 문제는 효소(beta-lactamase)이고, MRSA 문제는 표적 변화(PBP2a)입니다."], "vid": "WyyVWnRG1NY", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-03", "part": 0, "title": "레고블록으로 이해하는 penicillin 의 작용", "line": "penicillin 은 세균을 직접 때려눕히는 약이 아닙니다. 세균이 늘 하고 있던 성벽 보수공사를 망쳐 놓아 스스로 무너지게 하는 약입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "more": [{"t": "세균 안쪽은 삼투압 때문에 늘 부풀어 오르려 해서, 벽이 약하면 물풍선처럼 터집니다. 그래서 바깥에 peptidoglycan 벽을 쌓습니다. 레고로 치면 NAG · NAM 블록을 줄줄이 쌓고, 줄과 줄 사이를 세로 연결고리로 묶어야 단단해집니다. 이 묶는 일이 cross-linking 입니다.", "fig": {"type": "pan", "title": "블록을 쌓고, 핀으로 묶는다", "panels": [{"img": "책_03", "w": 520}]}, "focus": []}, {"t": "cross-linking 을 하는 장인이 PBP(penicillin-binding protein)입니다. 이름과 달리 본업은 penicillin 을 붙잡는 게 아니라, transpeptidase 로서 peptide 끝의 D-Ala-D-Ala 를 알아보고 줄과 줄 사이에 고정핀을 꽂는 일입니다.", "fig": "keep", "focus": []}, {"t": "그런데 β-lactam 은 PBP 눈에 그 블록 끝(D-Ala-D-Ala)과 똑같이 생겼습니다. 가져다 붙이려는데 안 붙습니다 — 「이거모지??? 이거모지???」 PBP 는 β-lactam 에 비가역적으로 acylation 되어 일을 못 하고, 벽은 더 이어지지 않습니다.", "fig": {"type": "flow", "title": "PBP 의 손이 묶인다", "nodes": [{"t": "β-lactam", "sub": "D-Ala-D-Ala 를 닮음"}, {"t": "PBP 에 붙음", "sub": "비가역적 acylation", "tone": "stop"}, {"t": "cross-link 멈춤", "sub": "새 벽이 안 이어진다"}], "arrows": ["", ""]}, "focus": []}, {"t": "그럼 이미 만들어 둔 벽은 남아 있지 않을까요? 벽은 한 번 쌓고 끝이 아니라, autolysin 이 계속 깎고 다시 쌓는 동적 균형입니다. 깎는 일은 계속되는데 새 벽이 안 생기니 결국 삼투압을 못 견디고 터집니다. 「세균이 원래 하고 있던 보수공사를 실패하게 만들어」 스스로 무너지게 하는 것입니다.", "fig": {"type": "flow", "title": "왜 이미 있는 벽도 무너지나", "nodes": [{"t": "autolysin", "sub": "기존 벽을 계속 깎는다"}, {"t": "새 벽이 없다", "sub": "PBP 가 묶여 있다", "tone": "stop"}, {"t": "삼투압", "sub": "물풍선처럼 터진다"}], "arrows": ["", ""]}, "focus": []}], "nums": [], "says": ["세균을 직접 때려눕히기는 거예요?", "본업은 세균 벽을 마무리 조립하는 효소입니다."], "vid": "11T6rLRONSs", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-04", "part": 0, "title": "penicillin 이 그람양성균에 잘 듣는 까닭", "line": "그람양성균과 그람음성균은 벽의 구조가 다릅니다. 이 차이만 알면 penicillin 이 왜 판의 왼쪽(그람양성)에는 잘 듣고 오른쪽(그람음성)에서는 막히는지가 풀립니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "pcng", "more": [{"t": "그람양성균은 바깥에 바로 두꺼운 peptidoglycan 레고 성벽이 있고, 벽을 마감하는 PBP 도 그 근처에서 일합니다. penicillin 이 쉽게 다가가 「저 기술자 손을 묶어버리자.」 할 수 있습니다. 그래서 전통적인 penicillin 은 Streptococcus · pneumococcus · 일부 anaerobe 에 강합니다.", "focus": ["gpos"], "fig": {"type": "pan", "title": "벽이 바깥에 있나, 외막 안쪽에 있나", "panels": [{"img": "책_04", "w": 520}]}}, {"t": "그람음성균은 얇은 peptidoglycan 바깥에 외막(outer membrane)이 한 겹 더 있습니다. penicillin 이 PBP 에 닿으려면 외막을 지나야 하는데, 아무 데로나 못 들어가고 작고 까다로운 porin 통로로 가야 합니다. periplasm 에 β-lactamase 가 있으면 닿기 전에 깨지고, PBP 와의 친화도도 약마다 다릅니다. 이 벽들을 넘으려고 ampicillin · piperacillin · cephalosporin · carbapenem 이 차례로 개발되었습니다.", "focus": ["gneg"], "marks": [{"tip": "외막 · porin 부터 넘어야", "ids": ["ecoli"]}]}, {"t": "예외도 중요합니다. Staphylococcus aureus 는 그람양성인데 penicillinase 로 penicillin G 를 깨 버리고, MRSA 는 PBP2a 를 만들어 PBP 자체를 바꿨기 때문에 β-lactam 이 잘 못 붙습니다. 반대로 일부 그람음성균은 ampicillin · ceftriaxone · piperacillin-tazobactam · carbapenem 으로 잘 치료됩니다.", "focus": ["gpos"], "marks": [{"tip": "penicillinase 로 깬다", "ids": ["mssa"]}, {"tip": "PBP 자체를 바꿨다", "ids": ["mrsa"]}]}, {"t": "작용 원리에서 임상 사실 몇 가지가 따라 나옵니다. 세포벽을 새로 합성하는 증식 중인 세균에 더 잘 듣고, 사람 세포에는 peptidoglycan 도 PBP 도 없어 비교적 안전합니다(selective toxicity). 농도를 한 번 높이 올리기보다 MIC 이상을 오래 유지하는 것이 중요해서(time-dependent killing) penicillin G 는 하루 최소 4번 줍니다 — 「병동에서 되게 싫어합니다」.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": null, "fig": {"type": "hub", "title": "작용 원리에서 따라 나오는 것", "center": "penicillin 의 작용|PBP 를 묶는다", "items": ["증식 중인 균에 더 잘 듣는다", "사람 세포에는 표적이 없다", "MIC 이상을 오래 — 자주 준다", "β-lactamase 에 깨지면 끝 → inhibitor"]}}], "nums": ["penicillin G 0.5–4 million U q 4–6hr — 하루 최소 4번"], "says": ["그람양성균은 레고 성벽이 바깥에 드러나 있어 PBP라는 조립공을 penicillin이 바로 공격할 수 있지만,", "전통적인 penicillin은 그람양성균에서 표적까지 접근하기 훨씬 쉽다."], "vid": "ekzvSU7ZL7c", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-05", "part": 0, "title": "enterococcus 에는 penicillin 만으로는 무리", "line": "enterococcus 는 그람양성구균인데도 β-lactam 으로 벽 합성을 막아도 잘 죽지 않습니다. 그래서 병합요법이 나오고, faecalis 인지 faecium 인지를 가려야 합니다.", "focus": ["c_entero"], "drug": "amp", "more": [{"t": "그람양성구균은 staphylococcus · streptococcus · enterococcus 셋이고, enterococcus 가 마지막 타자입니다. 원래 병원성이 낮아 문제가 안 되지만 면역이 떨어지면 UTI · endocarditis · 복강 내 감염 · meningitis 를 일으키고, 제대로 걸리면 항생제가 잘 안 들어 골치 아픕니다.", "drug": null, "focus": ["gpos"], "marks": [{"tip": "그람양성구균 셋의 마지막", "ids": ["efaecalis"]}]}, {"t": "penicillin 이 cross-linking 을 막으면 다른 균은 벽이 무너져 죽는데, enterococcus 는 대충 버팁니다. 「세포벽 억제 = 살균」이 아니라 「세포벽 억제 = 성장 억제」로 끝나는 intrinsic tolerance 입니다. 친화도가 낮은 PBP 때문인데, 끼워 넣어야 할 것을 「넌 뭐야? 꺼져!」 하는 비율이 늘어나는 셈입니다. cephalosporin 은 특히 더 안 듣고 ampicillin 이 그나마 낫습니다.", "drug": "cro", "focus": ["gpos"], "marks": [{"tip": "cepha 는 특히 더 안 듣는다", "ids": ["efaecalis"]}]}, {"t": "그래서 aminoglycoside(gentamicin)를 같이 씁니다. gentamicin 혼자서는 enterococcus 안으로 잘 못 들어가지만, β-lactam 이 벽을 건드리면 잘 들어가 살균력이 확 올라갑니다 — 「암피실린이 문을 조금 열어 주고, gentamicin이 안으로 들어가 치명타를 준다」. 면역이 잘 닿지 않는 vegetation 안쪽을 확실히 죽여야 하는 심내막염에서 특히 중요했습니다.", "focus": [], "fig": {"type": "pan", "title": "ampicillin 이 문을 열고 gentamicin 이 들어간다", "panels": [{"img": "책_05", "w": 520}]}}, {"t": "현실의 문제는 둘입니다. aminoglycoside 를 오래 쓰면 신독성 · 이독성이 오고, high-level aminoglycoside resistance(HLAR)가 있으면 시너지 자체가 깨집니다. 그래서 감수성 보고서에서 HLAR 여부를 따로 봅니다. HLAR 이 있으면 아주 간혹 ampicillin + ceftriaxone 을 씁니다 — ampicillin 이 PBP 체계를 먼저 흔들어 놓으면 그 틈으로 cephalosporin 이 들어가 작용한다는 dual β-lactam 입니다.", "focus": [], "fig": {"type": "cmp", "title": "무엇을 짝지을까", "vs": "HLAR 이면", "cols": [{"h": "ampicillin + gentamicin", "tone": "go", "pts": ["벽이 흔들린 틈으로 gentamicin", "오래 쓰면 신독성 · 이독성", "HLAR 이면 시너지가 깨진다"]}, {"h": "ampicillin + ceftriaxone", "tone": "", "pts": ["dual β-lactam", "ampicillin 이 PBP 를 흔든 틈으로", "아주 간혹 쓴다"]}]}}, {"t": "enterococcus 라고 다 같지 않습니다. E. faecalis 는 전체의 80% 가까이 되고 ampicillin 이 아직 듣는 경우가 많습니다. E. faecium 은 20% 뿐이지만 ampicillin 내성이 훨씬 흔하고 vancomycin 내성도 문제입니다. 「faecalis는 끝이 s니까.. sensitive.. 이렇게 외우자」.", "focus": ["gpos"], "marks": [{"tip": "끝이 s — sensitive", "ids": ["efaecalis"]}, {"tip": "ampicillin 내성이 흔하다", "ids": ["efaecium"]}]}], "nums": ["E. faecalis 80% 가까이 · E. faecium 20%"], "says": ["Enterococcus에서는 “세포벽 억제 = 성장 억제” 정도로 끝나는 경우가 생깁니다.", "faecalis냐 faecium이냐를 봐야 됩니다."], "vid": "idie2xnir7g", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-06", "part": 0, "title": "β-lactamase", "line": "β-lactam 고리가 부서지면 penicillin 은 더 이상 효과가 없습니다. 세균이 실제로 그 고리를 자르는 효소를 만드는데, 그것이 β-lactamase 입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "more": [{"t": "β-lactamase 는 PBP 의 사촌입니다. PBP 가 penicillin 과 달라붙는 능력을 물려받았지만, 세포막에 붙어 세포벽 합성을 하는 대신 떠다니다 penicillin 에 붙어 부숴 버립니다. 「너 이녀석 잘 만났다!」 하는 셈입니다.", "fig": {"type": "pan", "title": "PBP 와 그 사촌 β-lactamase", "panels": [{"img": "책_06", "w": 520}]}, "focus": []}, {"t": "조금 다듬으면 — β-lactam 은 PBP 에 붙어 PBP 를 묶어 둘 뿐 부수지는 않습니다. β-lactamase 는 β-lactam 을 분해해 버리고, 다음 β-lactam 을 또 분해하며 계속 일합니다.", "fig": "keep", "focus": []}, {"t": "β-lactamase 는 하나가 아니라 아주 여러 종류이고, Ambler class A · B · C · D 로 나눕니다. A · C · D 가 PBP 의 사촌 비슷하고, B 는 zinc 를 쓰는 계열이라 조금 다릅니다.", "fig": {"type": "hub", "title": "β-lactamase 도 여러 가지", "center": "β-lactamase|Ambler 분류", "items": ["class A · C · D — PBP 의 사촌 비슷", "class B — zinc 를 쓴다"]}, "focus": []}, {"t": "「free상태로 분비된다」는 말은 그람양성균에서는 대충 맞습니다. 그람음성균에서는 β-lactamase 가 밖으로 다 나가지 않고, 외막과 세포막 사이 periplasm 에 자리 잡고 일합니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "그람양성: 밖으로 내보낸다", "ids": ["mssa"]}, {"tip": "그람음성: periplasm 에 둔다", "ids": ["ecoli"]}]}, {"t": "세균이 영리한 걸까요? 선택적 진화의 결과입니다. β-lactam 은 PBP 의 정상 기질인 D-Ala-D-Ala 를 흉내 내서 PBP 에 붙고, 기전이 가까운 serine β-lactamase 도 그 고리를 알아봅니다. 여기에 빠른 deacylation 능력이 붙으면서, 붙잡히는 표적이 아니라 항생제를 잘라 버리는 효소가 된 것입니다.", "fig": {"type": "flow", "title": "붙잡히는 표적에서 자르는 효소로", "nodes": [{"t": "β-lactam", "sub": "D-Ala-D-Ala 흉내"}, {"t": "serine β-lactamase", "sub": "그 고리를 알아본다"}, {"t": "빠른 deacylation", "sub": "잘라 내고 다음 것으로", "tone": "stop"}], "arrows": ["", ""]}, "focus": []}], "nums": [], "says": ["세균이 참 영리하죠?", "이 beta-lactamase는 PBP의 사촌이예요.."], "vid": "lvW8pn6envc", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-07", "part": 0, "title": "penicillin G는 어떤 균에 들을까", "line": "penicillin G 는 「항생제 스펙트럼의 원점」입니다. 여기서 무엇이 더해지는지를 보면 ampicillin · nafcillin · piperacillin 에서 cephalosporin · carbapenem 까지 차례로 넓혀 갈 수 있습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "pcng", "more": [{"t": "듣느냐 안 듣느냐는 네 가지 물음으로 정리됩니다. ① 세포벽 peptidoglycan 이 있는가 ② 약이 PBP 까지 닿는가 ③ 그 균의 PBP 에 착 달라붙는가 ④ 가는 길에 β-lactamase 에 잘리지 않는가.", "focus": [], "fig": {"type": "pan", "title": "penicillin G 가 넘어야 하는 네 관문", "panels": [{"img": "책_04", "w": 520}]}}, {"t": "네 관문을 다 통과하는 균 — 세포벽이 있고, outer membrane 이 없고, β-lactamase 를 잘 안 만드는 균 — 이 가장 전형적인 타깃, streptococci 입니다. 특히 GAS 는 아직도 penicillin 에 매우 잘 듣습니다.", "focus": ["c_strep", "gas", "gbs", "viridans", "pneumo"], "marks": [{"tip": "아직도 매우 잘 듣는다", "ids": ["gas"]}]}, {"t": "pneumococcus 는 좀 애매합니다. PBP 를 살짝씩 바꿔서 아예 안 붙는 건 아닌데, 훨씬 많은 양이 있어야 붙습니다. 「얼마나 많이 부어야 듣느냐」 — 여기서 MIC 의 논리가 나옵니다.", "focus": ["pneumo", "gas", "gbs", "viridans"], "marks": [{"tip": "많이 부어야 붙는다", "ids": ["pneumo"]}]}, {"t": "Staphylococcus 도 그람양성인데 안 듣습니다. β-lactamase 를 만들어 약이 PBP 에 닿기 전에 잘라 버리기 때문입니다. 그래서 MSSA 에는 nafcillin · oxacillin · cefazolin, PBP 자체가 바뀐 MRSA 에는 vancomycin · daptomycin 을 생각합니다.", "focus": ["c_staph", "mssa", "mrsa"], "marks": [{"tip": "β-lactamase 에 잘린다", "ids": ["mssa"]}, {"tip": "PBP 자체가 바뀌었다", "ids": ["mrsa"]}]}, {"t": "그람음성 막대균 — E. coli · Klebsiella · Enterobacter · Pseudomonas — 은 outer membrane 이 있고 들어가다 β-lactamase 를 만날 수도 있어서, 기대하면 안 됩니다. Neisseria 는 porin 이 잘 발달해 일부 들었지만, 지금 임균은 β-lactamase 와 PBP 변형으로 안 듣는 경우가 많아 ceftriaxone 을 씁니다.", "focus": ["gneg"], "marks": [{"tip": "outer membrane 에 막힌다", "ids": ["ecoli"]}, {"tip": "요즘은 ceftriaxone", "ids": ["gono"]}]}, {"t": "아래 띠는 각개격파입니다. 구강 혐기성균 일부는 잘 듣고, B. fragilis 는 β-lactamase 로 안 들을 수 있습니다. 매독균 Treponema 는 지금도 penicillin 이 핵심 치료이고, Mycoplasma 는 세포벽이 없어 공격할 목표물 자체가 없습니다.", "focus": ["anaer", "etc"], "marks": [{"tip": "지금도 핵심 치료", "ids": ["trepo"]}, {"tip": "세포벽이 없다", "ids": ["atyp"]}]}], "nums": [], "says": ["그러니까 항생제 스펙트럼의 원점이라고 보시면 되요,.", "균을 쫙 보고, 항생제 쫙 보고 해봤자 어차피 기억도 안나기 때문에,"], "vid": "5mlLi3NxA0k", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-08", "part": 0, "title": "Streptococcus", "line": "균 하나를 정의 · 역학 · 발병기전 … 치료까지 다 보고 넘어가면 다음 균에서 앞 균을 잊습니다. 그래서 Streptococcus 는 간단한 구조와 임상에서 이야기할 거리만 잡습니다.", "focus": ["gpos"], "more": [{"t": "그람양성구균은 셋입니다. staphylococcus 는 동그란 것이 포도송이처럼 뭉쳐 포도상구균, streptococcus 는 사슬처럼 이어져 연쇄구균(사슬알균), enterococcus 는 쌍이나 짧은 사슬입니다.", "focus": ["gpos"], "marks": [{"tip": "사슬처럼 이어진다", "ids": ["gas"]}, {"tip": "쌍 · 짧은 사슬", "ids": ["efaecalis"]}, {"tip": "포도송이처럼 뭉친다", "ids": ["mssa"]}]}, {"t": "Streptococcus 는 실은 엄청 많지만 셋만 봅니다 — Group A β-hemolytic streptococcus, pneumococcus, viridans. 「이름부터 좀 짜증납니다.」 Group A 가 있으니 B · C · G 도 있고, β 용혈(적혈구를 완전히 녹임) 말고도 α 용혈(부분 · 녹색빛, viridans 가 대표)과 γ 용혈이 있습니다. 다 펼치면 길을 잃으니 Group A = S. pyogenes 로만 잡습니다.", "focus": ["gpos"], "marks": [{"tip": "Group A = S. pyogenes", "ids": ["gas"]}, {"tip": "α 용혈 — 녹색빛", "ids": ["viridans"]}]}, {"t": "S. pyogenes 는 한마디로 「피부하고 목을 좋아하는 균입니다.」 목이니 인두염 · 편도염, 피부니 농가진 · 단독 · 봉와직염, 깊이 파고들면 괴사성 근막염, 독소가 문제면 streptococcal toxic shock syndrome, 감염이 지나간 뒤에는 류마티스열 · 급성 사구체신염. 「균이 무슨 병을 일으키는지 목록으로 외우는 것만큼 참담한 일이 없습니다.」 목과 피부 하나를 잡으면 목록이 따라옵니다.", "focus": ["c_strep"], "fig": {"type": "pan", "title": "목과 피부에서 갈라지는 가지", "panels": [{"img": "책_08", "w": 520}]}}, {"t": "성홍열은 GAS 인두염인데, 일부 균주가 erythrogenic exotoxin 을 만들어 온몸에 잔 붉은 발진이 납니다. 사포처럼 까끌까끌한 sandpaper rash, 딸기혀(strawberry tongue), 겨드랑이 · 팔오금처럼 접히는 곳에 진해지는 Pastia lines 가 특징입니다.", "focus": [], "fig": {"type": "hub", "title": "성홍열", "center": "성홍열|GAS 인두염 + 독소", "items": ["sandpaper rash", "strawberry tongue", "Pastia lines"]}}, {"t": "penicillin G 로 보면 GAS 는 「거의 100% penicillin에 감수성이 있다.」 GBS(S. agalactiae)는 질 · 직장 · 비뇨생식기에 사는 균으로 산모와 신생아 감염에서 중요하고, penicillin G 가 분만 중 예방의 핵심 약입니다. Group C · G 도 대체로 잘 듣지만 감수성 확인이 더 중요하고, viridans 는 대체로 듣지만 상대적 내성이 있을 수 있어 감수성 결과를 봅니다.", "drug": "pcng", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "GAS · GBS 모두 잘 듣는다", "ids": ["gas", "gbs"]}]}, {"t": "그렇다고 「penicillin 하나면 항상 충분하다」는 말은 아닙니다. 괴사성 근막염이나 streptococcal toxic shock 처럼 독소와 균량이 문제인 중증 GAS 감염에서는 수술로 괴사조직을 걷어 내고 clindamycin 같은 독소 억제 약을 더합니다.", "drug": "pcng", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "수술 + clindamycin 을 더한다", "ids": ["gas"]}]}], "nums": ["GAS 의 penicillin 감수성 — 거의 100%"], "says": ["균이 무슨 병을 일으키는지 목록으로 외우는 것만큼 참담한 일이 없습니다.", "S. pyogenes는 목과 피부를 좋아한다."], "vid": "M3wAdzCimJk", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-09", "part": 0, "title": "GAS 에 penicillin 이 정말 듣는가", "line": "GAS 가 penicillin 에 잘 듣는다면 GAS 감염에 실제로 penicillin 을 쓸까요? 결론부터 「실제로 쓸 수 있다」 — 다만 어떤 penicillin 을 어떤 상황에서 쓰느냐가 병마다 다릅니다.", "focus": ["c_strep"], "drug": "amp", "more": [{"t": "GAS 인두염의 1차 치료는 penicillin V PO 나 amoxicillin PO 입니다. 우리나라에는 penicillin V 가 없으니 amoxicillin 500 mg bid 10일을 씁니다. 오구멘틴까지 갈 필요는 보통 없습니다 — GAS 는 β-lactamase 를 만들어 amoxicillin 을 깨는 균이 아니기 때문입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "amoxicillin 10일이면 된다", "ids": ["gas"]}]}, {"t": "10일 동안 약을 잘 못 먹을 것 같은 환자에게는 benzathine penicillin G 근육주사가 좋습니다. 한 번 맞으면 S. pyogenes 에 대한 효과가 3 ~ 4주 이어집니다. 다만 보통 외래에는 없습니다 — 언제 쓸지 모르는데 들여놓았다가 안 나가면 반품해야 하니까요.", "drug": "pcng", "focus": [], "fig": {"type": "pan", "title": "benzathine — 한 번 맞으면 3 ~ 4주", "panels": [{"img": "책_10", "w": 520}]}}, {"t": "성홍열은 대개 GAS 인두염과 같고, 일부 균주가 만드는 독소에 대한 전신 반응으로 발진이 납니다. 발진이 있다고 약이 달라지지 않습니다. 균을 없애야 하니 치료는 똑같이 amoxicillin 입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "발진이 있어도 amoxicillin", "ids": ["gas"]}]}, {"t": "봉와직염도 GAS 가 확실하면 penicillin · amoxicillin 을 써도 됩니다. 그러나 GAS 만 있는지 MSSA 가 섞였는지 처음부터 알 수 없고, 대부분을 차지하는 비화농성 봉와직염은 배양할 고름도 없습니다. 그래서 가능한 원인균을 다 덮는 쪽으로 — streptococcus 와 MSSA 를 같이 덮는 cefazolin · cephalexin 을 많이 씁니다.", "drug": "cfz", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "GAS 만인지 알 수 없다", "ids": ["gas"]}, {"tip": "MSSA 가 섞였을 수 있다", "ids": ["mssa"]}]}, {"t": "인두염도 원인은 바이러스 · group C/G strep · EBV 등 여럿이고 증상만으로는 가릴 수 없습니다. 다른 점은 표면이 드러나 있다는 것 — throat swab 으로 rapid antigen test 나 throat culture 를 해서 GAS 를 확인하고 치료합니다. 치료하지 않으면 류마티스열 같은 골치 아픈 합병증이 따라올 수 있어 꼭 확인합니다.", "focus": ["c_strep"], "fig": {"type": "pan", "title": "봉와직염은 cefazolin, 인두염은 amoxicillin 인 까닭", "panels": [{"img": "책_09", "w": 520}]}}, {"t": "괴사성 근막염 · STSS 는 GAS 라도 penicillin 만 쓰지 않습니다. 단백합성을 막아 독소 생산을 줄이는 clindamycin 을 같이 쓰고, 죽은 조직은 수술로 걷어 냅니다. 처음에는 GAS 인지 알 길이 없어 MRSA · 그람음성 · anaerobe 까지 덮어 vancomycin + piperacillin-tazobactam 처럼 넓게 시작하고, 배양에서 GAS 가 확인되면 그제서야 penicillin G + clindamycin 으로 갑니다.", "drug": "pcng", "focus": ["c_strep"], "fig": {"type": "flow", "title": "괴사성 근막염 — 넓게 시작해 좁힌다", "nodes": [{"t": "처음", "sub": "vancomycin + piperacillin-tazobactam 등 · MRSA · G(−) · anaerobe 까지"}, {"t": "배양에서 GAS", "sub": "그제서야 확인"}, {"t": "penicillin G + clindamycin", "sub": "+ 괴사조직 제거", "tone": "go"}], "arrows": ["", "좁힌다"]}}], "nums": ["amoxicillin 500 mg bid × 10일", "benzathine penicillin G IM 한 번 — 3 ~ 4주"], "says": ["GAS 인두염에 amoxicillin-clavulanate까지 갈 필요는 보통 없다", "현실이 대충 어떤 느낌인지 아시겠죠?"], "vid": "NJE7PveE_2A", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-10", "part": 0, "title": "penicillin G 를 실제로 쓰는 것은 매독뿐", "line": "penicillin G 가 잘 듣는 균을 하나씩 지워 보면 남는 것은 spirochete, 매독균 Treponema 하나입니다. 우리나라에서 penicillin G 는 현실적으로 매독 치료를 위해 남아 있는 약입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "pcng", "more": [{"t": "7강에서 penicillin G 가 잘 듣는 균은 Streptococcus, 일부 Neisseria, 일부 anaerobe, spirochete 였습니다. Neisseria · anaerobe 는 일부니까 뺍니다. Streptococcus 도 자신 있게 penicillin G 를 권할 경우는 GAS 가 증명된 인두염 정도인데, 그마저도 amoxicillin 을 씁니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "그마저도 amoxicillin", "ids": ["gas"]}, {"tip": "Neisseria 는 일부니까 뺀다", "ids": ["mening", "gono"]}]}, {"t": "남는 것은 spirochete — 나선형으로 꼬불꼬불한 그람음성균 — 이고, 대표가 매독균 Treponema 입니다. 따지고 들면 GAS 괴사성 근막염이 확인된 경우, 류마티스열 재발 예방, actinomycosis, 일부 clostridial infection 도 있지만 일반 외래에서는 거의 볼 일이 없습니다.", "focus": ["etc"], "marks": [{"tip": "남는 것은 매독 하나", "ids": ["trepo"]}]}, {"t": "매독은 「짧게, 1기는 국소감염, 2기는 전신감염, 3기는 혈관염 끝」. 1기는 chancre(음부궤양), 2기는 온몸 발진 · 열 · 림프절 비대가 좋아졌다 나빠졌다 하고, 3기는 고무종과 대동맥염 · 대동맥류입니다. 신경매독은 3기에만 오는 게 아니라 어느 시기에나 올 수 있고, 잠복매독은 증상 없이 감염의 증거만 나오는 경우입니다.", "focus": [], "fig": {"type": "flow", "title": "매독의 병기", "nodes": [{"t": "1기 · 국소", "sub": "chancre(음부궤양)"}, {"t": "2기 · 전신", "sub": "발진 · 열 · 림프절"}, {"t": "3기 · 혈관", "sub": "고무종 · 대동맥염", "tone": "stop"}], "arrows": ["", ""]}}, {"t": "치료는 병기별로 다릅니다. 1기 · 2기 · 조기 잠복매독은 benzathine penicillin G 엉덩이 주사 한 방으로 끝, 후기 잠복 · 감염 기간 미상 잠복매독과 신경 침범 없는 3기 매독은 매주 한 번씩 세 번, 신경매독은 aqueous crystalline penicillin G 를 IV 로 2주쯤 — 입원이 필요합니다.", "focus": [], "fig": {"type": "tbl", "title": "매독 — 병기별 penicillin G", "head": ["상황", "치료"], "rows": [["1기 · 2기 · 조기 잠복", "benzathine 2.4 million U IM 1회"], ["후기 잠복 · 기간 미상 잠복", "benzathine 2.4 million U IM 매주 × 3"], ["3기 (신경 침범 없음)", "benzathine 2.4 million U IM 매주 × 3"], ["신경매독", "aqueous crystalline 18–24 million U/일 IV × 10–14일"]]}}, {"t": "둘 다 penicillin G 인데 붙어 있는 염이 달라 몸 안에서 움직임(pharmacokinetics)이 다릅니다. 보통 penicillin G 를 근육주사하면 순식간에 퍼져 사라지므로, 천천히 퍼지며 오래 가게 만든 것이 benzathine 입니다. 신경매독은 근육주사로는 CSF 농도를 유지할 수 없어 aqueous crystalline 을 IV 로 높게 줍니다.", "focus": [], "fig": {"type": "pan", "title": "같은 penicillin G, 다른 염", "panels": [{"img": "책_10", "w": 520}]}}, {"t": "환자가 penicillin 알레르기라면? 다른 감염은 대개 차선책이 있지만 매독, 특히 신경매독은 penicillin 이상의 약이 없어 탈감작을 합니다. 아주 작은 양부터 조금씩 올려 몸이 잠시 견디게 만든 뒤 그 상태로 치료를 끝까지 합니다. 중환자실처럼 지켜볼 수 있는 곳에서 알레르기 전문가와 함께 하고, 영구히 없애는 것이 아니라 일시적이니 중간에 끊지 않습니다.", "focus": [], "marks": [{"tip": "신경매독은 대신할 약이 없다", "ids": ["trepo"]}], "fig": {"type": "flow", "title": "탈감작 — 잠시 견디게 만든다", "nodes": [{"t": "아주 작은 양", "sub": "모니터링 되는 곳에서"}, {"t": "조금씩 올린다"}, {"t": "끝까지 이어 간다", "sub": "오래 끊기면 다시 위험", "tone": "go"}], "arrows": ["", ""]}}], "nums": ["benzathine penicillin G 2.4 million units IM — 1회 또는 매주 × 3", "신경매독 aqueous crystalline penicillin G 18–24 million units/일 IV × 10–14일"], "says": ["결국 우리나라에서 penicillin G라는 약은 현실적으로 매독 치료를 하기 위해 남아있는 거라고 봐도 크게 틀린 말이 아닙니다.", "답은? 병기별로 다르다ㅎㅎ"], "vid": "YJFq0Bpphco", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-11", "part": 0, "title": "정말 penicillin 알레르기가 있습니까", "line": "신경매독처럼 penicillin G 를 꼭 써야 하는데 환자가 알레르기가 있다고 하면, 탈감작부터 떠올리기 전에 먼저 그것이 진짜 penicillin 알레르기인지 확인해야 합니다.", "focus": ["etc"], "marks": [{"tip": "penicillin G 가 꼭 필요한 곳", "ids": ["trepo"]}], "more": [{"t": "외래에서 「혹시 페니실린에 알레르기가 있습니까?」 하고 물으면 5명 중 1명은 있다고 답합니다. 그런데 penicillin 알레르기는 5% 정도로 알려져 있고, penicillin 아나필락시스는 10만 명당 1 ~ 50명으로 드뭅니다. 전 국민의 20% 가 penicillin 알레르기라는 건 말이 안 됩니다.", "fig": {"type": "cmp", "title": "체감과 실제", "vs": "vs", "cols": [{"h": "「있다」고 답하는 사람", "tone": "stop", "pts": ["5명 중 1명 — 20%"]}, {"h": "실제 penicillin 알레르기", "tone": "go", "pts": ["5% 정도", "아나필락시스 10만 명당 1 ~ 50명"]}]}, "focus": []}, {"t": "그래서 「어떻게 페니실린에 알레르기가 있는지 알게 되셨어요?」 하고 묻습니다. 그러면 penicillin 이 아니라 다른 항생제나 이름 모를 약이었던 경우가 많습니다 — 약 먹고 설사했다, 감기약 먹고 뭐가 났다, 엄마가 그랬다더라. 진짜 type I hypersensitivity 라면 맞고 얼마 안 돼 온몸 두드러기, 입술 · 눈 부기, 목 조임, 쌕쌕거림, 혈압 저하, 응급실에서 주사 같은 이야기가 나와야 합니다.", "fig": {"type": "cmp", "title": "어떤 일이 있었나요", "vs": "vs", "cols": [{"h": "알레르기가 아닌 이야기", "tone": "", "pts": ["약 먹고 설사했다", "감기약 먹고 뭐가 났다", "엄마가 그랬다더라"]}, {"h": "진짜 type I 이야기", "tone": "stop", "pts": ["맞고 곧 온몸 두드러기", "입술 · 눈 부기 · 목 조임", "쌕쌕거림 · 혈압 저하", "응급실에서 주사"]}]}, "focus": []}, {"t": "그렇다고 그냥 무시할 수도 없습니다. 완전히 배제할 수 없고, 방어적으로 갈 수밖에 없는 현실이라 그냥 투여했다가 아나필락시스가 오면 의사 잘못이 됩니다. 그래서 그때 어떤 약을 먹고 어떤 증상이 있었는지, 예전 병원 기록을 알아 오시라고 합니다. 그런데 대부분 모릅니다. 엄마에게 전화하면 「내가 그랬어? 언제?」", "fig": {"type": "flow", "title": "옛 병력은 되살리기 어렵다", "nodes": [{"t": "당시 상황을 알아 오기", "sub": "어떤 약 · 어떤 증상 · 옛 기록"}, {"t": "대부분 모른다", "sub": "병원도 기록도 없다", "tone": "stop"}], "arrows": [""]}, "focus": []}, {"t": "그러면 확인이 안 되니 알레르기 아닌 걸로 하고 용감하게 투여할까요, 그냥 탈감작을 할까요, 무조건 금기라며 매독 치료를 안 할까요? 다 아닙니다. 알레르기내과에 penicillin allergy evaluation 을 의뢰합니다. 그러면 피부반응검사나 oral amoxicillin challenge 로 진짜 알레르기인지 확인합니다.", "fig": {"type": "cmp", "title": "확인이 안 될 때", "vs": "→", "cols": [{"h": "다 아니다", "tone": "stop", "pts": ["그냥 투여", "그냥 탈감작", "무조건 금기 — 치료 포기"]}, {"h": "알레르기내과 의뢰", "tone": "go", "pts": ["피부반응검사", "oral amoxicillin challenge"]}]}, "focus": []}], "nums": ["「있다」 20% · 실제 5% 정도 · 아나필락시스 10만 명당 1 ~ 50명"], "says": ["교과서에 나와있는 것과 현실은 무척이나 많이 다르다..", "제일 먼저 해야될 것은 뭐다?"], "vid": "kYTdw7nbmOw", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-12", "part": 0, "title": "aminopenicillin 의 지위", "line": "ampicillin · amoxicillin 은 penicillin 에 amino 가 붙은 약으로 지금도 많이 씁니다. 그람음성 쪽으로 조금 넓어졌지만, 이 약이 꼭 있어야 하는 곳은 E. faecalis 와 Listeria 입니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "drug": "amp", "more": [{"t": "amino side chain 때문에 natural penicillin 보다 친수성이 생겨 일부 그람음성균의 outer membrane · porin 을 지나기 쉬워졌습니다. 「기본형 penicillin에서 멀어질수록 점점 그람양성균에 대한 활성이 옅어지고, 그람음성균에 대한 활성이 진해집니다.」 penicillin 만이 아니라 cephalosporin 도, macrolide 도 그렇습니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "fig": {"type": "pan", "title": "기본형에서 멀어질수록 그람음성 쪽으로", "panels": [{"img": "책_21", "w": 520}]}}, {"t": "그래서 N. gonorrhoeae · H. influenzae · E. coli · Proteus mirabilis · Salmonella · Shigella 를 좀 더 덮습니다. 그러나 이런 그람음성균은 전문으로 덮는 약이 따로 있고, aminopenicillin 은 「약간 더 하는 정도」입니다. 게다가 N. gonorrhoeae · H. influenzae 는 β-lactamase 를 만드는 균이 많아져, 억제제를 섞은 오구멘틴 · 유나신으로 더 널리 씁니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "β-lactamase 생성이 늘었다", "ids": ["hflu"]}, {"tip": "약간 더 하는 정도", "ids": ["ecoli"]}]}, {"t": "그람양성 쪽 활성이 약간 떨어진다는 데도 예외가 있습니다. Enterococcus faecalis 에는 aminopenicillin 이 1st choice 입니다 — 균별 PBP 친화성 차이 때문인 듯합니다. E. faecium 은 그렇지 않아 ampicillin 고도내성이 흔합니다. 5강에서 faecalis 는 끝이 s 라서 sensitive 라고 했던 그대로입니다.", "focus": ["gpos"], "marks": [{"tip": "aminopenicillin 이 1순위", "ids": ["efaecalis"]}, {"tip": "ampicillin 고도내성이 흔하다", "ids": ["efaecium"]}]}, {"t": "그래도 enterococcus 는 tolerance 라는 근본 한계가 있습니다. 단순 UTI 같은 가벼운 E. faecalis 감염은 감수성이 있으면 amoxicillin · ampicillin 이 좋은 선택이고, 균혈증 · 심내막염 같은 중증은 ampicillin + gentamicin, 또는 신독성 · HLAR 을 고려해 ampicillin + ceftriaxone(서로 다른 PBP 를 넓게 포화시키는 dual β-lactam)을 씁니다.", "focus": [], "fig": {"type": "cmp", "title": "E. faecalis — 얼마나 중한가", "vs": "vs", "cols": [{"h": "가벼운 감염", "tone": "go", "pts": ["단순 UTI 등", "감수성 있으면 amoxicillin · ampicillin"]}, {"h": "균혈증 · 심내막염", "tone": "stop", "pts": ["ampicillin 단독으로는 부족할 수 있다", "+ gentamicin", "또는 + ceftriaxone"]}]}}, {"t": "Listeria monocytogenes 는 그람양성 막대균입니다. 식중독을 일으키지만 다른 식중독과 달리 전신 증상이 두드러지고, 면역이 약한 환자에게 수막염을 일으킵니다. 경험적으로 ampicillin 이 표준 치료가 되었고 penicillin G 도 듣습니다. 중요한 것은 cephalosporin 이 1 ~ 4세대 전체 하나도 안 듣는다는 점 — PBP 와 상성이 안 맞기 때문인데, 외울 수밖에 없습니다.", "drug": "cro", "focus": ["gpos"], "marks": [{"tip": "cepha 는 하나도 안 듣는다", "ids": ["listeria"]}]}, {"t": "정리하면 aminopenicillin 은 거의 penicillin 과 바꿔 쓸 수 있는 약입니다. 다만 완전히는 아니어서, E. faecalis 와 Listeria 에서는 aminopenicillin 이, 매독에서는 natural penicillin 이 제 자리를 가집니다.", "focus": ["gpos", "gneg", "anaer", "etc"], "marks": [{"tip": "aminopenicillin 의 자리", "ids": ["efaecalis"]}, {"tip": "aminopenicillin 의 자리", "ids": ["listeria"]}, {"tip": "penicillin G 의 자리", "ids": ["trepo"]}]}], "nums": [], "says": ["그래서 뭔가 aminopenicillin의 지위랄까 하는 것이 좀 애매해진게 있어요.", "그냥 거의 Penicillin과 교환 가능한 제제라고 보시면 됩니다."], "vid": "9duuMJ6BJw8", "open": true, "open_date": "", "tier": "니은 회원"}, {"n": "ANTI-13", "part": 0, "title": "Listeria", "line": "「냉장고에서도 버티는 foodborne intracellular G(+) rod」 — 길면 이것 하나만: 50세 이상 뇌수막염에서 반드시 떠올려야 하는 균. ceftriaxone 이 안 들어서 ampicillin 을 떠올려야 합니다.", "focus": ["c_listeria"], "drug": "amp", "more": [{"t": "Listeria monocytogenes 는 그람양성, 운동성 있는(편모가 있는) 막대균입니다. 수막염이 의심되는 환자의 CSF 그람염색에서 그람양성 막대균이 보이면 strep 이 아니라 Listeria 를 떠올릴 수 있습니다. 다만 현실에서는 CSF 그람염색 민감도가 낮아 균이 잘 안 보입니다.", "focus": ["gpos"], "marks": [{"tip": "그람양성 · 운동성 막대균", "ids": ["listeria"]}]}, {"t": "facultative intracellular pathogen — 세포 밖에서도 안에서도 사는 균이라, 음식으로 장에 들어와 장상피세포나 대식세포 안으로 침입합니다. 4°C 냉장에서도 자라서 「냉장 보관했으니 안전하다」가 잘 안 통합니다. 델리미트(얇게 썬 햄 · 살라미), soft cheese, 훈제 생선처럼 조리 없이 먹는 냉장식품이 고위험입니다.", "focus": ["gpos"], "marks": [{"tip": "4°C 냉장에서도 자란다", "ids": ["listeria"]}]}, {"t": "세포 안에서는 ActA 로 actin 을 끌어모아 그 힘으로 세포막을 밖으로 밀어내고, 이웃 세포가 그 돌출부를 삼키면 막을 깨고 탈출합니다. 혈액이나 세포 밖으로 거의 나오지 않고 퍼지니 항체가 닿기 어렵고, 세포매개면역이 중요합니다. 그래서 임신 · 고령 · 면역저하에 약합니다.", "focus": [], "fig": {"type": "pan", "title": "actin 꼬리로 옆 세포로 넘어간다", "panels": [{"img": "책_13", "w": 520}]}}, {"t": "건강한 성인은 뭘 잘못 먹고 1 ~ 3일 토하고 설사하다 좋아지는 가벼운 장염으로 지나가, 진단도 안 되는 경우가 많습니다. 면역저하자는 장을 넘어 균혈증 · 패혈증 · 수막염/수막뇌염으로 가고, 임신부는 본인은 감기몸살 정도여도 균이 태반을 넘어 태아에게 심각한 영향을 줄 수 있습니다.", "focus": [], "fig": {"type": "cmp", "title": "누가 걸렸나에 따라 완전히 다르다", "vs": "vs", "cols": [{"h": "건강한 성인", "tone": "go", "pts": ["1 ~ 3일 구토 · 설사", "가벼운 장염으로 지나감"]}, {"h": "면역저하 · 임신부", "tone": "stop", "pts": ["균혈증 · 수막염/수막뇌염", "태반을 넘어 태아에게"]}]}}, {"t": "성인 세균성 수막염이면 ceftriaxone + vancomycin 을 떠올리는데, 이 조합은 Listeria 를 놓칠 수 있습니다. Listeria 는 cephalosporin 에 intrinsic resistance 가 있어 ampicillin 으로 치료합니다. 그래서 기저질환 없는 18 ~ 50세는 ceftriaxone + vancomycin, 50세 이상 · 알코올 중독 · 면역억제제 · 장기이식 · 생후 1개월 미만처럼 세포성 면역이 떨어진 환자는 여기에 ampicillin 을 붙입니다.", "drug": "cro", "focus": ["gpos"], "marks": [{"tip": "ceftriaxone 으로는 놓친다", "ids": ["listeria"]}], "fig": {"type": "cmp", "title": "성인 세균성 수막염", "vs": "vs", "cols": [{"h": "18 ~ 50세 · 기저질환 없음", "tone": "", "pts": ["ceftriaxone + vancomycin"]}, {"h": "50세 이상 · 세포성 면역 저하", "tone": "go", "pts": ["vancomycin + ceftriaxone", "+ ampicillin"]}]}}, {"t": "Listeria 는 다섯 갈고리로 묶으면 가장 덜 지저분합니다 — 냉장고(4°C), 조리 없이 먹는 식품, 세포 안(actin · cell-to-cell), 위험군(임신부 · 신생아 · 고령 · 면역저하), 그리고 ampicillin(cephalosporin 은 안 됨).", "focus": ["c_listeria"], "fig": {"type": "hub", "title": "Listeria — 다섯 갈고리", "center": "Listeria|5가지 갈고리", "items": ["냉장고 — 4°C 에서도", "Ready-to-eat food", "Intracellular — actin", "임신부 · 신생아 · 고령 · 면역저하", "ampicillin — cephalosporin ✗"]}}], "nums": ["4°C 냉장에서도 증식", "기저질환 없는 18–50세: ceftriaxone + vancomycin · 50세 이상 등: + ampicillin"], "says": ["50세 이상의 뇌수막염에서 반드시 떠올려야 하는 균", "Listeria는 이렇게 묶어서 외우면 가장 덜 지저분합니다."], "vid": "t1z8YvUqcFw", "open": true, "open_date": "", "tier": "니은 회원"}], "board": "균지도", "part_no": 1, "parts": [{"ko": "페니실린", "sub": "ANTI-01 ~ 13"}], "course": "기역 항생제 1 · 페니실린", "intro": "ANTI-01 ~ 13 를 균 지도 위에서 차례로 내려 읽습니다. 대목마다 지금 이야기하는 약이 듣는 균을 칠합니다.", "legend": ["<b>균 지도</b> 왼쪽이 그람양성, 오른쪽이 그람음성. 위가 기본이고 아래로 내려갈수록 내성을 얻은 균입니다", "<b>파랗게 칠해진 칸</b> 지금 이야기하는 약이 듣는 균 — 점선은 일부 · 약하게, 빗금은 안 듣는다. 두 약을 견줄 때는 파랑 · 주황 · 반반", "<b>자홍 화살표와 말풍선</b> 지금 읽는 대목이 가리키는 자리", "<b>파란 테</b> 판에 못 담는 것을 따로 보여 주는 그림 · 표"], "end": "<b>Part 1 「페니실린」 끝.</b> <a href=\"index.html\">차례로 돌아가기</a>"}, "img": {"책_01": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAIcA8ADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVV
