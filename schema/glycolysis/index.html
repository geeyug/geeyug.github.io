// ── 글 기둥: 구간 → 강의 → 줄 ──
const steps = [];                         // {el, focus:'*'|[…], lec}
const T = document.getElementById('text');
const add = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; T.appendChild(d); return d; };
add('hero', `<a class="home" href="/">← 기역 홈페이지</a><div class="over">모식적으로 이해하는 의학 · 물질대사</div><h1>${C.course}</h1>
  <p>포도당 하나가 피루브산 둘이 되기까지.<br>강의 ${S.length}편을 판 하나 위에서 차례로 내려 읽습니다.</p>
  <ul><li><b>구슬</b> 탄소 · <b>막대기</b> 인산</li><li><b>빨간 동그라미</b> 조절점 · <b>＋</b> 재촉 · <b>－</b> 세움</li>
  <li><b>보라</b> 호르몬 · <b>점선</b> 아직 강의가 없는 자리</li>
  <li><b>빨간 테와 빨간 말풍선</b> 지금 읽는 대목이 가리키는 자리</li></ul><div class="down">↓ 아래로 내리면 시작합니다</div>`);
let part = -1;
S.forEach((s, i) => {
  if (s.part !== part) { part = s.part; add('chap', `<div class="k">${part + 1} / ${C.parts.length}</div><h2>${C.parts[part].ko}</h2><p>${C.parts[part].sub}</p>`); }
  const h = add('step lec', `<div class="no">${s.n}강</div><h3>${s.title}</h3><p>${s.line}</p>`);
  h.id = 'L' + s.n; steps.push({ el: h, focus: s.focus, lec: i, marks: [], fig: s.fig });
  s.more.forEach(m => steps.push({ el: add('step', `<p>${m.t}</p>`), focus: m.focus.length ? m.focus : null, lec: i, marks: m.marks || [], fig: m.fig }));
  add('foot', (s.nums.length ? `<p class="nums">${s.nums.join(' · ')}</p>` : '') +
    (s.says.length ? `<p class="say">${s.says.map(q => `「${q}」`).join('<br>')}</p>` : '') +
    `<a href="https://www.youtube.com/watch?v=${s.vid}" target="_blank" rel="noopener">${s.n}강 보기 (멤버십)</a>`);
});
add('end', `<p><b>${C.course} ${S.length}강, 여기까지입니다.</b><br>판은 시트르산회로와 지방, 아미노산으로 이어집니다.</p>`);

// 비출 자리가 없는 줄은 앞 줄 것을 잇고, 지금까지 나온 자리를 쌓아 둔다
let last = '*'; const seenAt = []; const seen = new Set();
steps.forEach(st => { if (st.focus === null) st.focus = last; last = st.focus;
  if (st.focus !== '*') st.focus.forEach(k => seen.add(k)); seenAt.push(new Set(seen)); });

document.getElementById('dots').innerHTML = S.map((s, i) =>
  `<button data-n="${s.n}" title="${s.n}강 ${s.title}"${i && s.part !== S[i - 1].part ? ' class="gap"' : ''}>${s.n}</button>`).join('');
document.getElementById('dots').onclick = e => { const n = e.target.dataset.n; if (n) document.getElementById('L' + n).scrollIntoView({ block: 'center' }); };

// ── 판에 못 담는 말을 그리는 작은 모식도 ──
{ let f; steps.forEach(st => { if (st.fig === 'keep') st.fig = f; f = st.fig; }); }
const BEAD = '#3f63b5', PCOL = '#d08a1e';
function beads(c, p) {                    // 구슬 = 탄소, 막대기 = 인산 (판과 같은 말)

const bdg = (a, cls) => a.map(x => `<span class="bdg ${cls === 'get' && !/ATP|NADH/.test(x) ? 'etc' : cls}">${x}</span>`).join('');

    (i < f.arrows.length ? (a => `<div class="fa">${a.t ? `<div class="lb">${a.t}</div>` : ''}${a.in.length ? `<div class="bg">${bdg(a.in, 'use')}</div>` : ''}<div class="ln"></div>${a.out.length ? `<div class="bg">${bdg(a.out, 'get')}</div>` : ''}</div>`)(f.arrows[i]) : '')).join('') + '</div>',
  cmp: f => '<div class="cmp">' + f.cols.map(c => `<div class="col ${c.tone}"><h5>${c.h}</h5><ul>${c.pts.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join(f.vs ? `<div class="vs">${f.vs}</div>` : '') + '</div>',
  sw: f => '<div class="sws">' + f.rows.map(r => `<div class="sw ${r.on ? 'on' : 'off'}"><span class="st">${r.t}</span><span class="tg"><i></i></span><b>${r.w}</b></div>`).join('') + '</div>',
  sum: f => '<div class="sum">' + f.terms.map(x => `<div class="tm"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('') + `<div class="op">=</div><div class="tm res"><b>${f.eq[0]}</b><small>${f.eq[1]}</small></div></div>`,
  hub: f => { const [c, sub] = f.center.split('|'); return `<div class="hub"><div class="hc">${c}${sub ? `<small>${sub}</small>` : ''}</div><div class="hl"></div><div class="hi">${f.items.map(x => `<span>${x}</span>`).join('')}</div></div>`; },
  curve: f => {                           // 포도당이 늘 때 두 효소의 속도 (모양만)
    const X = x => 50 + x * 40, Y = v => 170 - v * 140, path = (km, vm) => Array.from({ length: 41 }, (_, i) => { const x = i / 4; return (i ? 'L' : 'M') + X(x) + ' ' + Y(vm * x / (km + x)); }).join(' ');
    const line = (id, km, vm, name, col, ly) => `<path d="${path(km, vm)}" fill="none" stroke="${col}" stroke-width="${f.hi === id ? 5 : 2.5}" opacity="${f.hi === id ? 1 : .45}"/><text x="${X(10) + 8}" y="${ly}" font-size="15" font-weight="${f.hi === id ? 800 : 400}" fill="${col}">${name}</text>`;
    return `<svg width="600" height="210" viewBox="0 0 600 210" style="max-width:100%;height:auto"><line x1="50" y1="170" x2="460" y2="170" stroke="#2b2a27" stroke-width="2"/><line x1="50" y1="170" x2="50" y2="18" stroke="#2b2a27" stroke-width="2"/>` +
      `<text x="255" y="196" font-size="14" text-anchor="middle" fill="#4c473f">포도당이 많아질수록 →</text><text x="40" y="24" font-size="14" text-anchor="end" fill="#4c473f">속도</text>` +
      line('hk', .25, .42, 'hexokinase', '#a82a22', Y(.41) + 5) + line('gk', 4.5, 1.35, 'glucokinase', '#25642a', Y(.93) + 5) + '</svg>';
  },
  gate: f => '<div class="gates">' + f.panels.map(pn => {
    const on = pn.door === 'on', dot = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="${BEAD}"/>`;
    return `<figure><svg width="270" height="150" viewBox="0 0 270 150"><rect x="0" y="0" width="270" height="62" fill="#f1dcd7"/><text x="8" y="18" font-size="13" fill="#7a3a33">피</text><text x="8" y="140" font-size="13" fill="#4c473f">세포 안</text>` +
      `<line x1="0" y1="62" x2="270" y2="62" stroke="#2b2a27" stroke-width="3"/><line x1="0" y1="70" x2="270" y2="70" stroke="#2b2a27" stroke-width="3"/>` +
      [60, 95, 150, 190, 225].map((x, i) => dot(x, 26 + (i % 2) * 14)).join('') +
      (on ? `<rect x="118" y="54" width="34" height="24" rx="5" fill="#fff" stroke="#2b2a27" stroke-width="3"/><line x1="135" y1="40" x2="135" y2="104" stroke="#c8372d" stroke-width="3"/><path d="M128 100 L135 112 L142 100 z" fill="#c8372d"/>${dot(135, 124)}${dot(160, 132)}`
          : `<rect x="118" y="100" width="34" height="24" rx="5" fill="#fff" stroke="#2b2a27" stroke-width="3" stroke-dasharray="5 4"/>`) +
      `</svg><figcaption><b>${pn.h}</b>${pn.note}</figcaption></figure>`; }).join('') + '</div>',
};
const figEl = document.getElementById('fig');
let figNow = null, figBox = null;
const mapPx = to => { const W = svg.clientWidth, H = svg.clientHeight, k = Math.min(W / to[2], H / to[3]), ox = (W - to[2] * k) / 2, oy = (H - to[3] * k) / 2;
  return r => [ox + (r[0] - to[0]) * k, oy + (r[1] - to[1]) * k, ox + (r[2] - to[0]) * k, oy + (r[3] - to[1]) * k]; };
function showFig(f, to, st, lit) {        // 판 위, 지금 말하는 자리를 덜 가리는 곳에 파란 테 카드로
  if (!f) { figNow = figBox = null; figEl.className = 'fig'; return; }
  if (f !== figNow) { figNow = f; figEl.classList.remove('in');
    figEl.innerHTML = `<h4>${f.title}</h4>${FIG[f.type](f)}${f.cap ? `<div class="cap">${f.cap}</div>` : ''}`; }
  figEl.classList.add('show');
  const W = svg.clientWidth, H = svg.clientHeight, w = figEl.offsetWidth, h = figEl.offsetHeight, m = 14, px = mapPx(to);
  const marks = (st.marks || []).map(x => bb(x.ids)).filter(Boolean).map(px), lits = [...lit].map(id => bb([id])).filter(Boolean).map(px);
  const o = svg.getBoundingClientRect(), fixed = ['tag', 'mini'].map(id => { const b = document.getElementById(id).getBoundingClientRect(); return [b.left - o.left, b.top - o.top, b.right - o.left, b.bottom - o.top]; });
  const xs = { l: m, c: (W - w) / 2, r: W - w - m }, ys = { t: 54, m: (H - h) / 2, b: H - h - m };
  let best = null, bs = 1e18;
  for (const [a, b] of ['lb', 'cb', 'rt', 'rm', 'lm', 'ct', 'rb', 'lt']) {
    const R = [xs[a], ys[b], xs[a] + w, ys[b] + h]; let s = 0;
    marks.forEach(l => s += 12 * cut(R, l)); lits.forEach(l => s += cut(R, l)); fixed.forEach(l => s += 30 * cut(R, l));
    marks.forEach(l => { if (cut([R[0] - 150, R[1] - 60, R[2] + 150, R[3] + 60], l)) s += 2000; });   // 말풍선 놓을 틈
    if (s < bs) { bs = s; best = R; }
  }
  figBox = best; figEl.style.left = best[0] + 'px'; figEl.style.top = best[1] + 'px';
  requestAnimationFrame(() => figEl.classList.add('in'));
}

// ── 판: 불 켜기와 다가가기 ──
let view = FULL.slice(), anim = null, cur = -2, timer = null;
const NS = 'http://www.w3.org/2000/svg', MK = document.createElementNS(NS, 'g'), bubs = document.getElementById('bubs');
svg.appendChild(MK);
const byKey = {}; els.forEach(g => byKey[key(g)] = g);
function bb(ids) {                        // 여러 자리를 한데 담는 네모 [x1,y1,x2,y2]
  let r = null;
  for (const k of ids) { const g = byKey[k]; if (!g) continue; const b = g.getBBox(); if (!b.width && !b.height) continue;
    r = r ? [Math.min(r[0], b.x), Math.min(r[1], b.y), Math.max(r[2], b.x + b.width), Math.max(r[3], b.y + b.height)] : [b.x, b.y, b.x + b.width, b.y + b.height]; }
  return r;
}
const cut = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
function mark(st, to, lit) {              // 지금 말하는 자리에 빨간 테, 그 옆에 짧은 말
  MK.innerHTML = ''; bubs.innerHTML = ''; clearTimeout(timer);
  const ms = (st ? st.marks : []).map(m => ({ tip: m.tip, r: bb(m.ids) })).filter(m => m.r);
  for (const m of ms) { const p = 8; m.r = [m.r[0] - p, m.r[1] - p, m.r[2] + p, m.r[3] + p];
    const r = document.createElementNS(NS, 'rect'); r.setAttribute('class', 'mk'); r.setAttribute('rx', 12);
    r.setAttribute('x', m.r[0]); r.setAttribute('y', m.r[1]); r.setAttribute('width', m.r[2] - m.r[0]); r.setAttribute('height', m.r[3] - m.r[1]); MK.appendChild(r); }
  if (!ms.length) return;
  timer = setTimeout(() => {
    const W = svg.clientWidth, H = svg.clientHeight, k = Math.min(W / to[2], H / to[3]), ox = (W - to[2] * k) / 2, oy = (H - to[3] * k) / 2;
    const px = r => [ox + (r[0] - to[0]) * k, oy + (r[1] - to[1]) * k, ox + (r[2] - to[0]) * k, oy + (r[3] - to[1]) * k];
    const tag = document.getElementById('tag').getBoundingClientRect(), mi = document.getElementById('mini').getBoundingClientRect(), o = svg.getBoundingClientRect();
    const fixed = [tag, mi].map(b => [b.left - o.left, b.top - o.top, b.right - o.left, b.bottom - o.top]);
    const lits = [...lit].map(id => bb([id])).filter(Boolean).map(px), rects = ms.map(m => px(m.r)), placed = [];
    if (figBox) fixed.push(figBox);
    ms.forEach((m, i) => {
      const el = document.createElement('div'); el.className = 'bub'; el.textContent = m.tip; bubs.appendChild(el);
      const w = el.offsetWidth, h = el.offsetHeight, R = rects[i], g = 13, cx = (R[0] + R[2]) / 2, cy = (R[1] + R[3]) / 2;
      const cand = [];
      for (const y of [cy - h / 2, R[1], R[3] - h]) { cand.push(['sr', R[2] + g, y]); cand.push(['sl', R[0] - g - w, y]); }
      for (const x of [cx - w / 2, R[0], R[2] - w]) { cand.push(['sb', x, R[3] + g]); cand.push(['sa', x, R[1] - g - h]); }
      cand.push(['in', R[0] + 10, R[1] + 10]); cand.push(['in', R[2] - w - 10, R[1] + 10]);
      let best = null, bs = 1e18;
      for (const [side, x, y] of cand) {
        const b = [x, y, x + w, y + h];
        let s = (x < 6 || y < 6 || x + w > W - 6 || y + h > H - 6) ? 1e9 : 0;
        lits.forEach(l => s += 3 * cut(b, l)); fixed.forEach(l => s += 20 * cut(b, l)); placed.forEach(l => s += 20 * cut(b, l));
        rects.forEach((l, j) => { if (j !== i || side !== 'in') s += 8 * cut(b, l); });
        if (side === 'in') s += 400;
        if (s < bs) { bs = s; best = [side, x, y]; }
      }
      let [side, x, y] = best; x = Math.max(6, Math.min(x, W - w - 6)); y = Math.max(6, Math.min(y, H - h - 6));
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.classList.add(side);
      el.style.setProperty('--p', Math.max(12, Math.min((side === 'sr' || side === 'sl' ? cy - y : cx - x), (side === 'sr' || side === 'sl' ? h : w) - 12)) + 'px');
      placed.push([x, y, x + w, y + h]);
      requestAnimationFrame(() => el.classList.add('in'));
    });
  }, 740);
}
function box(ids) {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const g of els) if (ids.has(key(g))) {
    const b = g.getBBox(); if (!b.width && !b.height) continue;
    x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.width); y2 = Math.max(y2, b.y + b.height);
  }
  if (x1 > x2) return FULL.slice();
  const pad = 60; x1 -= pad; y1 -= pad; x2 += pad; y2 += pad;
  let w = Math.max(x2 - x1, 820), h = Math.max(y2 - y1, 560);
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, r = svg.clientWidth / svg.clientHeight || 1;
  if (w / h < r) w = h * r; else h = w / r;
  if (w >= FULL[2] || h >= FULL[3]) return FULL.slice();
  return [Math.max(0, Math.min(cx - w / 2, FULL[2] - w)), Math.max(0, Math.min(cy - h / 2, FULL[3] - h)), w, h];
}
function fly(to) {
  cancelAnimationFrame(anim);
  const from = view.every(isFinite) ? view.slice() : FULL.slice(), t0 = performance.now();
  const step = t => {
    let k = Math.min(1, (t - t0) / 700); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    view = from.map((v, i) => v + (to[i] - v) * k);
    svg.setAttribute('viewBox', view.join(' '));
    frame.setAttribute('x', view[0]); frame.setAttribute('y', view[1]); frame.setAttribute('width', view[2]); frame.setAttribute('height', view[3]);
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function light(i) {                       // i = -1 이면 첫 화면(판 전체)
  if (i === cur) return; cur = i;
  const st = steps[i], all = !st || st.focus === '*';
  const ids = new Set(all ? [] : st.focus), was = st ? seenAt[i] : new Set();
  for (const g of els) g.style.opacity = all || ids.has(key(g)) ? 1 : was.has(key(g)) ? .42 : .1;
  const to = all ? FULL.slice() : box(ids);
  fly(to); showFig(st && st.fig, to, st, ids); mark(st, to, ids);
  steps.forEach((s, k) => s.el.classList.toggle('on', k === i));
  const s = st && S[st.lec];
  document.getElementById('tag').innerHTML = s ? `<b>${s.n}강</b> · ${s.title}` : `${C.course} ${S.length}강`;
  document.querySelectorAll('.dots button').forEach(b => b.classList.toggle('on', !!s && +b.dataset.n === s.n));
  if (s && location.hash !== '#' + s.n) try { history.replaceState(null, '', '#' + s.n); } catch (e) {}   // 앱 안 미리 보기는 주소를 못 바꾼다
}
function pick() {                         // 읽는 줄(화면 가운데쯤)에 가장 가까운 대목
  const narrow = matchMedia('(max-width: 860px)').matches;
  const y = innerHeight * (narrow ? .78 : .5);
  if (steps[0].el.getBoundingClientRect().top > innerHeight * .92) return light(-1);
  let best = 0, d = 1e9;
  steps.forEach((s, k) => { const r = s.el.getBoundingClientRect(), v = Math.abs((r.top + r.bottom) / 2 - y); if (v < d) { d = v; best = k; } });
  light(best);
}
let tick = false;
addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; pick(); }); } }, { passive: true });
addEventListener('resize', () => { cur = -2; pick(); });
const h = parseInt(location.hash.slice(1));
if (h && document.getElementById('L' + h)) document.getElementById('L' + h).scrollIntoView({ block: 'center' });
pick();
</script>
